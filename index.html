// ============================================================ 예측 근거 설명 카드
// result에 이미 계산되어 있는 ELO 차이·동기부여·라이벌전·폼·결장 영향·ML 스큐 등을
// 사람이 읽을 수 있는 문장으로 정리해 "왜 이렇게 예측됐는지"를 보여준다.
function PredictionExplainCard({home, away, result}) {
  if (!result) return null;
  const items = [];

  const eloDiff = result.eloDiff || 0;
  if (Math.abs(eloDiff) > 10) {
    const favored = eloDiff > 0 ? home : away;
    items.push({icon:"📊", text:`ELO 전력 차이가 약 ${Math.abs(Math.round(eloDiff))}점으로, ${favored} 쪽에 유리하게 작용했습니다.`});
  }

  const homeAdv = result.explain?.base?.homeAdvantage;
  if (typeof homeAdv === "number" && homeAdv > 0.02) {
    items.push({icon:"🏠", text:`홈 어드밴티지가 ${home}의 기대득점을 약 ${(homeAdv*100).toFixed(0)}% 끌어올렸습니다.`});
  }

  const mot = result.explain?.motivation;
  if (mot) {
    if (mot.home > 0.02) items.push({icon:"🔥", text:`${home}의 동기부여(순위 경쟁 등)가 긍정적으로 반영됐습니다.`});
    else if (mot.home < -0.02) items.push({icon:"📉", text:`${home}은 동기부여 측면에서 다소 불리하게 반영됐습니다.`});
    if (mot.away > 0.02) items.push({icon:"🔥", text:`${away}의 동기부여가 긍정적으로 반영됐습니다.`});
    else if (mot.away < -0.02) items.push({icon:"📉", text:`${away}은 동기부여 측면에서 다소 불리하게 반영됐습니다.`});
  }

  if (result.explain?.isRivalry) items.push({icon:"⚔️", text:"두 팀은 라이벌전으로 분류되어, 전력 차와 무관한 이변 가능성이 다소 반영됐습니다."});

  try {
    const formHome = getDynElo(home, "form"), formAway = getDynElo(away, "form");
    if (Math.abs(formHome - formAway) > 15) {
      const hot = formHome > formAway ? home : away;
      items.push({icon:"📈", text:`최근 폼은 ${hot} 쪽이 앞서 있는 것으로 나타났습니다.`});
    }
  } catch (e) {}

  try {
    const absHome = absentWinPenaltyPct(home), absAway = absentWinPenaltyPct(away);
    if (absHome > 1) items.push({icon:"🚑", text:`${home}의 결장 선수 영향으로 승률이 약 ${absHome.toFixed(1)}%p 낮아진 것으로 반영됐습니다.`});
    if (absAway > 1) items.push({icon:"🚑", text:`${away}의 결장 선수 영향으로 승률이 약 ${absAway.toFixed(1)}%p 낮아진 것으로 반영됐습니다.`});
  } catch (e) {}

  const mlSkew = (result.mlProbs?.homeWin ?? 0) - (result.mlProbs?.awayWin ?? 0);
  if (Math.abs(mlSkew) > 0.05) {
    const favored = mlSkew > 0 ? home : away;
    const mlLabel = result.usedRealMl ? "학습된 머신러닝 모델" : "보조 예측 규칙";
    items.push({icon:"🤖", text:`${mlLabel}도 ${favored} 쪽 승리 가능성을 더 높게 평가했습니다.`});
  }

  if (result.liveApplied && result.marketProbs) {
    const mp = result.marketProbs;
    const marketFav = mp.home > mp.away && mp.home > mp.draw ? home : (mp.away > mp.home && mp.away > mp.draw ? away : "무승부");
    items.push({icon:"💰", text:`실시간 배당 시장은 ${marketFav === "무승부" ? "무승부" : marketFav} 쪽을 favorite로 보고 있습니다.`});
  }

  if (!items.length) items.push({icon:"⚖️", text:"뚜렷하게 기운 요인 없이 대체로 균형 잡힌 매치업으로 나타났습니다."});

  return (
    <Card style={{marginTop:12}}>
      <SectionTitle sub="이번 예측 확률에 영향을 준 주요 요인들입니다">🧠 예측 근거</SectionTitle>
      <div style={{display:"flex", flexDirection:"column", gap:8, marginTop:6}}>
        {items.slice(0, 6).map((it, i) => (
          <div key={i} style={{display:"flex", gap:8, fontSize:12, color:T.text, lineHeight:1.5}}>
            <span>{it.icon}</span><span>{it.text}</span>
          </div>
        ))}
      </div>
    </Card>
  );
}

function LiveInPlayPanel({home, away, lambdaHome, lambdaAway}) {
  const [active, setActive] = useState(false);
  const [hg, setHg] = useState("0");
  const [ag, setAg] = useState("0");
  const [minute, setMinute] = useState(45);
  const [live, setLive] = useState(null);
  const [busy, setBusy] = useState(false);

  const recalc = useCallback(() => {
    const curH = Math.max(0, Number(hg)||0);
    const curA = Math.max(0, Number(ag)||0);
    const min = Math.min(90, Math.max(0, Number(minute)||0));
    setBusy(true);
    setTimeout(() => {
      const remainFrac = Math.max(0, (90 - min) / 90);
      const rlh = Math.max(0.02, lambdaHome * remainFrac);
      const rla = Math.max(0.02, lambdaAway * remainFrac);
      const sims = 30000;
      let hw=0, dr=0, aw=0;
      const scoreCounts = {};
      for (let i=0;i<sims;i++) {
        const addH = poissonRandom(rlh);
        const addA = poissonRandom(rla);
        const fh = curH + addH, fa = curA + addA;
        if (fh > fa) hw++; else if (fh < fa) aw++; else dr++;
        const key = `${fh}-${fa}`;
        scoreCounts[key] = (scoreCounts[key]||0)+1;
      }
      const topScores = Object.entries(scoreCounts).sort((a,b)=>b[1]-a[1]).slice(0,3)
        .map(([score,count])=>({score, prob:count/sims}));
      setLive({
        homeWinProb: hw/sims, drawProb: dr/sims, awayWinProb: aw/sims,
        topScores, minute: min, curH, curA, remainFrac,
      });
      setBusy(false);
    }, 20);
  }, [hg, ag, minute, lambdaHome, lambdaAway]);

  return (
    <Card style={{marginTop:12}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <SectionTitle sub="경기 중 스코어·경과 시간을 넣으면 남은 시간 기준으로 확률을 다시 계산합니다">🔴 라이브 인플레이 재계산</SectionTitle>
        <button onClick={()=>setActive(a=>!a)} style={{fontSize:11, color:T.accent, background:"transparent",
                border:`1px solid ${T.border}`, borderRadius:8, padding:"5px 10px", cursor:"pointer", whiteSpace:"nowrap"}}>
          {active ? "접기" : "펼치기"}
        </button>
      </div>
      {active && (
        <div>
          <div style={{display:"flex", gap:8, alignItems:"center", marginTop:10}}>
            <span style={{fontSize:11.5, color:T.muted, minWidth:0, flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{home}</span>
            <input type="number" min="0" value={hg} onChange={e=>setHg(e.target.value)}
              style={{width:50, padding:"7px", borderRadius:7, background:T.surface, border:`1px solid ${T.border}`, color:T.text, textAlign:"center"}}/>
            <span style={{color:T.muted}}>:</span>
            <input type="number" min="0" value={ag} onChange={e=>setAg(e.target.value)}
              style={{width:50, padding:"7px", borderRadius:7, background:T.surface, border:`1px solid ${T.border}`, color:T.text, textAlign:"center"}}/>
            <span style={{fontSize:11.5, color:T.muted, minWidth:0, flex:1, textAlign:"right", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{away}</span>
          </div>
          <div style={{marginTop:12}}>
            <div style={{display:"flex", justifyContent:"space-between", fontSize:11.5, color:T.muted}}>
              <span>경과 시간</span>
              <span style={{color:T.text, fontWeight:700}}>{minute}분</span>
            </div>
            <input type="range" min="1" max="90" step="1" value={minute} onChange={e=>setMinute(Number(e.target.value))} style={{width:"100%", marginTop:6}}/>
          </div>
          <button onClick={recalc} disabled={busy}
            style={{width:"100%", marginTop:12, padding:"11px", borderRadius:9, border:"none",
                    background: busy ? T.dim : T.red, color:"#fff", fontSize:13, fontWeight:800, cursor:busy?"default":"pointer"}}>
            {busy ? "재계산 중..." : "🔴 실시간 확률 재계산"}
          </button>

          {live && (
            <div style={{marginTop:12}}>
              <div style={{textAlign:"center", fontSize:11, color:T.muted, marginBottom:6}}>
                {live.minute}분 경과 · 현재 {live.curH}-{live.curA} · 남은 {Math.round(live.remainFrac*90)}분 기준 재계산
              </div>
              <ProbBar home={live.homeWinProb} draw={live.drawProb} away={live.awayWinProb} homeLabel={home} awayLabel={away}/>
              <div style={{fontSize:11, color:T.muted, marginTop:8, textAlign:"center"}}>
                예상 최종 스코어: {live.topScores.map(s=>`${s.score} (${pct(s.prob)})`).join(" · ")}
              </div>
            </div>
          )}
        </div>
      )}
    </Card>
  );
}

// ============================================================ 오늘/내일 경기 요약 위젯
// 예측 탭 진입 시 바로 "오늘 뭐 있지?"를 확인할 수 있게, 관심 팀 우선으로 다가오는 경기를 보여준다.
function TodayWidget({favTeams, onSelectMatch}) {
  const d = new Date();
  const todayStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const d2 = new Date(d.getTime() + 86400000);
  const tomorrowStr = `${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,"0")}-${String(d2.getDate()).padStart(2,"0")}`;

  const upcoming = useMemo(() => {
    const list = SCHEDULE.filter(g => g.date === todayStr || g.date === tomorrowStr);
    return list.map(g => {
      let probs = null;
      try { probs = modelProbsQuick(g.home, g.away); } catch (e) {}
      const isFav = (favTeams||[]).includes(g.home) || (favTeams||[]).includes(g.away);
      return { ...g, probs, isFav };
    }).sort((a,b) => (b.isFav?1:0) - (a.isFav?1:0) || a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
  }, [todayStr, tomorrowStr, favTeams]);

  const favStandings = useMemo(() => {
    if (!favTeams || !favTeams.length) return [];
    try {
      const table = calcGroupStandings().PL || [];
      return favTeams.map(t => {
        const idx = table.findIndex(r => r.team === t);
        return idx >= 0 ? { team: t, rank: idx+1, pts: table[idx].pts, played: table[idx].played } : null;
      }).filter(Boolean);
    } catch (e) { return []; }
  }, [favTeams]);

  if (!upcoming.length && !(favTeams||[]).length) return null;

  return (
    <Card style={{marginBottom:10}}>
      <SectionTitle sub="오늘·내일 예정된 경기 (⭐ 관심 팀 우선 표시)">📌 오늘의 경기</SectionTitle>
      {favStandings.length > 0 && (
        <div style={{display:"flex", flexWrap:"wrap", gap:6, marginBottom:10}}>
          {favStandings.map(s => (
            <div key={s.team} style={{fontSize:10.5, padding:"5px 9px", borderRadius:20,
              background:T.surface, border:`1px solid ${T.border}`, color:T.muted}}>
              ⭐ {s.team} <b style={{color:T.text}}>{s.rank}위</b> · {s.pts}점({s.played}경기)
            </div>
          ))}
        </div>
      )}
      {!upcoming.length ? (
        <div style={{fontSize:11.5, color:T.dim, textAlign:"center", padding:"6px 0"}}>오늘·내일 예정된 경기가 없습니다.</div>
      ) : (
        <div style={{display:"flex", flexDirection:"column", gap:6}}>
          {upcoming.slice(0, 6).map((g, i) => (
            <button key={i} onClick={() => onSelectMatch && onSelectMatch(g.home, g.away)}
              style={{display:"flex", justifyContent:"space-between", alignItems:"center",
                padding:"8px 10px", borderRadius:9, cursor:"pointer", textAlign:"left",
                background: g.isFav ? "rgba(245,166,35,0.08)" : T.surface,
                border:`1px solid ${g.isFav ? T.gold : T.border}`}}>
              <div style={{fontSize:12, color:T.text}}>
                {g.isFav && <span style={{color:T.gold}}>⭐ </span>}
                {g.home} vs {g.away}
                <span style={{color:T.dim, fontSize:10.5}}> · {g.date===todayStr?"오늘":"내일"} {g.time}</span>
              </div>
              {g.probs && (
                <div style={{fontSize:10.5, color:T.muted, whiteSpace:"nowrap", marginLeft:8}}>
                  {pct(g.probs.home)} · {pct(g.probs.draw)} · {pct(g.probs.away)}
                </div>
              )}
            </button>
          ))}
        </div>
      )}
    </Card>
  );
}

function CollapsibleSection({title, defaultOpen=false, children}) {
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div style={{marginTop:12}}>
      <button onClick={() => setOpen(o => !o)}
        style={{width:"100%", display:"flex", alignItems:"center", justifyContent:"space-between",
                padding:"12px 14px", borderRadius:10, border:`1px solid ${T.border}`,
                background:T.surface, color:T.text, cursor:"pointer"}}>
        <span style={{fontSize:13, fontWeight:800}}>{title}</span>
        <span style={{fontSize:11.5, color:T.accent, fontWeight:700, flexShrink:0, marginLeft:8}}>
          {open ? "▲ 접기" : "▼ 펼치기"}
        </span>
      </button>
      {open && <div>{children}</div>}
    </div>
  );
}

function PredictTab({home, away, setHome, setAway, sims, setSims, stage, setStage,
                      result, loading, onPredict, onSave, favTeams, onSelectMatch}) {
  const swap = () => { const h=home; setHome(away); setAway(h); };
  const sm = STAGE_META[stage] || STAGE_META.group;
  const [favMatchups, setFavMatchups] = useState([]);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("wc:favMatchups", false);
        if (r?.value) setFavMatchups(JSON.parse(r.value));
      } catch (e) {}
    })();
  }, []);

  const isFav = favMatchups.some(f => f.home===home && f.away===away);
  const toggleFav = () => {
    setFavMatchups(prev => {
      const next = prev.some(f => f.home===home && f.away===away)
        ? prev.filter(f => !(f.home===home && f.away===away))
        : [{home, away}, ...prev].slice(0, 12);
      window.storage.set("wc:favMatchups", JSON.stringify(next), false).catch(()=>{});
      return next;
    });
  };

  const matchInfo = useMemo(() => SCHEDULE.find(g =>
    (g.home===home && g.away===away) || (g.home===away && g.away===home)
  ), [home, away]);

  const knownResult = useMemo(() => {
    const stored = getStoredResult(home, away);
    if (!stored) return null;
    const isSwapped = !!_liveResults[resultKey(away, home)] && !_liveResults[resultKey(home, away)];
    return { hg: isSwapped ? stored.away : stored.home, ag: isSwapped ? stored.home : stored.away, source: stored.source };
  }, [home, away]);

  return (
    <div>
      <TodayWidget favTeams={favTeams} onSelectMatch={onSelectMatch}/>
      <HiddenTossupPanel onPick={(h,a)=>{ setHome(h); setAway(a); if(typeof window!=="undefined") window.scrollTo({top:0,behavior:"smooth"}); }}/>
      <Card>
        <div style={{display:"flex", gap:8, alignItems:"flex-end"}}>
          <GroupedTeamSelect value={home} onChange={setHome} label="🏠 홈팀" exclude={away}/>
          <button onClick={swap} title="교체" style={{padding:"10px 10px", borderRadius:9, background:T.surface,
                  border:`1px solid ${T.border}`, color:T.accent, fontSize:15, cursor:"pointer"}}>⇄</button>
          <GroupedTeamSelect value={away} onChange={setAway} label="✈️ 원정팀" exclude={home}/>
          <button onClick={toggleFav} title="즐겨찾기" style={{padding:"10px 10px", borderRadius:9,
                  background: isFav ? T.gold : T.surface, border:`1px solid ${isFav?T.gold:T.border}`,
                  color: isFav ? "#1a1200" : T.muted, fontSize:15, cursor:"pointer"}}>{isFav ? "★" : "☆"}</button>
        </div>

        {favMatchups.length > 0 && (
          <div style={{display:"flex", gap:6, flexWrap:"wrap", marginTop:10}}>
            {favMatchups.map((f,i) => (
              <button key={i} onClick={() => { setHome(f.home); setAway(f.away); }}
                style={{fontSize:10.5, padding:"5px 9px", borderRadius:20, cursor:"pointer",
                  border:`1px solid ${T.border}`, background:T.surface, color:T.muted}}>
                ⭐ {f.home} vs {f.away}
              </button>
            ))}
          </div>
        )}

        {/* 프리미어리그는 단일 정규리그 — 라운드 선택 불필요 */}

        <div style={{marginTop:14}}>
          <div style={{display:"flex", justifyContent:"space-between", fontSize:11.5, color:T.muted}}>
            <span>몬테카를로 시뮬레이션 횟수</span>
            <span style={{color:T.text, fontWeight:700}}>{sims.toLocaleString()}회</span>
          </div>
          <input type="range" min="10000" max="100000" step="10000" value={sims}
                 onChange={e=>setSims(Number(e.target.value))} style={{width:"100%", marginTop:6}}/>
        </div>

        <button onClick={onPredict} disabled={loading || home===away}
          style={{width:"100%", marginTop:14, padding:"13px", borderRadius:10, border:"none",
                  background: (loading||home===away) ? T.dim : T.accent, color:"#fff",
                  fontSize:15, fontWeight:800, cursor: (loading||home===away)?"default":"pointer"}}>
          {loading ? "분석 중... (실시간 데이터 조회 포함)" : (home===away ? "서로 다른 팀을 선택하세요" : "🔮 예측 실행")}
        </button>

        {knownResult && (
          <div style={{marginTop:10, padding:"10px 14px", borderRadius:10,
            background:"rgba(0,200,83,0.12)", border:`1px solid ${T.green}`,
            display:"flex", alignItems:"center", justifyContent:"space-between"}}>
            <div>
              <div style={{fontSize:12, color:T.green, fontWeight:700}}>🏁 이미 종료된 경기</div>
              <div style={{fontSize:11, color:T.muted, marginTop:2}}>
                {knownResult.source === "manual" ? "✏️ 수동 입력" : "🤖 자동 조회"} 결과
              </div>
            </div>
            <div style={{fontSize:26, fontWeight:900, color:T.text, fontFamily:"monospace"}}>
              <span style={{color: knownResult.hg > knownResult.ag ? T.green : T.text}}>{knownResult.hg}</span>
              <span style={{color:T.dim}}> : </span>
              <span style={{color: knownResult.ag > knownResult.hg ? T.green : T.text}}>{knownResult.ag}</span>
            </div>
          </div>
        )}
      </Card>

      {home !== away && <H2HCard teamA={home} teamB={away} />}
      {home !== away && (
        <ErrorBoundary>
          <TeamStyleRadarCard home={home} away={away} />
        </ErrorBoundary>
      )}

      {result && (
        <>
          <Card style={{marginTop:12}}>
            <div style={{textAlign:"center", fontSize:17, fontWeight:800}}>
              <TeamCrest name={home}/> {home} <span style={{color:T.muted, fontWeight:400}}>vs</span> {away} <TeamCrest name={away}/>
            </div>
            <div style={{textAlign:"center", marginTop:6}}>
              <span style={{display:"inline-block", padding:"4px 12px", borderRadius:20, background:"rgba(245,166,35,0.12)",
                            border:`1px solid ${T.accent}`, fontSize:11.5, color:T.accent, fontWeight:700}}>
                {sm.emoji} {sm.label}
              </span>
            </div>
            {matchInfo && (
              <div style={{textAlign:"center", marginTop:6}}>
                <span style={{display:"inline-block", padding:"4px 12px", borderRadius:20, background:T.surface,
                              border:`1px solid ${T.border}`, fontSize:11.5, color:T.cyan, fontWeight:700}}>
                  📅 {matchInfo.date} {matchInfo.time} 경기
                </span>
              </div>
            )}
            <div style={{textAlign:"center", marginTop:8}}>
              {result.liveApplied ? (
                <span style={{display:"inline-block", padding:"5px 12px", borderRadius:20, background:"rgba(0,200,83,0.15)",
                              border:`1px solid ${T.green}`, fontSize:11.5, color:T.green, fontWeight:700}}>
                  🟢 실시간 연동 ({result.liveSources.join(", ")} · 가중치 {Math.round(result.liveWeight*100)}%)
                </span>
              ) : (
                <span style={{display:"inline-block", padding:"5px 12px", borderRadius:20, background:"rgba(245,166,35,0.15)",
                              border:`1px solid ${T.gold}`, fontSize:11.5, color:T.gold, fontWeight:700}}>
                  📁 정적 모델 (실시간 미연동 — 설정에서 프록시/키 확인)
                </span>
              )}
            </div>
            <ProbBar home={result.homeWinProb} draw={result.drawProb} away={result.awayWinProb} homeLabel={home} awayLabel={away}/>
            {sm.knockout && (() => {
              const hw = result.homeWinProb, aw = result.awayWinProb, dw = result.drawProb;
              const denom = hw + aw;
              const advH = denom > 0 ? hw + dw * (hw/denom) : hw + dw/2;
              const advA = denom > 0 ? aw + dw * (aw/denom) : aw + dw/2;
              return (
                <div style={{marginTop:10, padding:"9px 12px", borderRadius:9,
                  background:"rgba(245,166,35,0.08)", border:`1px solid ${T.border}`}}>
                  <div style={{fontSize:11, color:T.accent, fontWeight:700, marginBottom:4}}>
                    {sm.emoji} {sm.label} — 무승부 시 연장·승부차기로 승부 결정
                  </div>
                  <div style={{fontSize:12, color:T.text}}>
                    최종 진출 확률(무승부 {pct(dw)} 배분): <TeamCrest name={home}/> <b>{pct(advH)}</b> · <b>{pct(advA)}</b> <TeamCrest name={away}/>
                  </div>
                </div>
              );
            })()}
            {result.liveApplied && result.staticProbs && (
              <div style={{fontSize:11, color:T.muted, marginTop:8, textAlign:"center"}}>
                정적 모델 기준: 홈 {pct(result.staticProbs.home)} · 무 {pct(result.staticProbs.draw)} · 원정 {pct(result.staticProbs.away)}
              </div>
            )}
          </Card>

          {/* 2026-08-01 이동: 결장 체크(핵심선수 자동감지 포함)는 예측에 즉시
              영향을 주는 핵심 기능인데 접이식 섹션 안에 숨어있어서 찾기
              어렵다는 피드백 — 확률 바로 아래 항상 보이는 위치로 뺌. */}
          <AbsenceSummaryPanel home={home} away={away}/>
          <ErrorBoundary>
            <PlayerContributionPanel home={home} away={away} matchDate={matchInfo?.date || null}
              onAbsenceChange={() => { if (typeof onPredict === "function") onPredict(); }}/>
          </ErrorBoundary>

          <CollapsibleSection title="🔍 예측 근거 & 컨텍스트">
            <PredictionExplainCard home={home} away={away} result={result}/>

            <LiveInPlayPanel home={home} away={away} lambdaHome={result.lambdaHome} lambdaAway={result.lambdaAway}/>

            <OddsComparisonPanel home={home} away={away}
              modelProbs={{home: result.homeWinProb, draw: result.drawProb, away: result.awayWinProb}}/>

            <ShareResultPanel home={home} away={away} result={result}/>
          </CollapsibleSection>

          <Card style={{marginTop:12, textAlign:"center"}}>
            <SectionTitle sub="자체 모델이 가장 높은 확률로 예측한 단일 스코어">🎯 자체 분석 예상 스코어</SectionTitle>
            {(() => {
              const top = result.topScores?.[0];
              if (!top) return null;
              const [hg, ag] = top.score.split("-").map(Number);
              const { homeWinProb:hw, drawProb:dw, awayWinProb:aw } = result;
              const maxP = Math.max(hw, dw, aw);
              const favored = hw===maxP ? "home" : aw===maxP ? "away" : "draw";
              const favoredLabel = favored==="home" ? `${home} 승` : favored==="away" ? `${away} 승` : "무승부";
              const isDrawScore = hg === ag;
              const favWinScore = favored !== "draw"
                ? result.topScores.find(s => { const [h2,a2]=s.score.split("-").map(Number); return favored==="home"?h2>a2:a2>h2; })
                : null;
              return (
                <>
                  <div style={{fontSize:36, fontWeight:900, letterSpacing:1, marginTop:4}}>
                    <span style={{color:T.cyan}}>{hg}</span>
                    <span style={{color:T.muted, margin:"0 8px"}}>:</span>
                    <span style={{color:T.cyan}}>{ag}</span>
                  </div>
                  <div style={{fontSize:12, color:T.muted, marginTop:4}}>
                    {home} {hg} - {ag} {away} · 확률 {pct(top.prob)}
                  </div>
                  <div style={{marginTop:10, paddingTop:8, borderTop:`1px dashed ${T.border}`, fontSize:11.5, lineHeight:1.8}}>
                    <div style={{display:"flex", justifyContent:"space-around", marginBottom:6}}>
                      <span><b style={{color:T.accent}}>{home} 승</b><br/><span style={{fontSize:14, fontWeight:800, color:T.accent}}>{pct(hw)}</span></span>
                      <span><b style={{color:T.muted}}>무승부</b><br/><span style={{fontSize:14, fontWeight:800, color:T.muted}}>{pct(dw)}</span></span>
                      <span><b style={{color:T.gold}}>{away} 승</b><br/><span style={{fontSize:14, fontWeight:800, color:T.gold}}>{pct(aw)}</span></span>
                    </div>
                    <div style={{color:T.muted}}>
                      📊 결과 예측: <b style={{color:T.text}}>{favoredLabel}</b> 우세 ({pct(maxP)})
                      {isDrawScore && favored!=="draw" && (
                        <div style={{marginTop:4, fontSize:11}}>
                          💡 최빈 단일 스코어는 무승부지만, 전체 확률로는 {favoredLabel}가 더 높습니다
                          {favWinScore && ` (${favoredLabel} 시 유력: ${favWinScore.score} · ${pct(favWinScore.prob)})`}
                        </div>
                      )}
                    </div>
                  </div>
                </>
              );
            })()}
          </Card>

          <CollapsibleSection title="📊 상세 통계 (xG·득점분포·오버언더·핸디캡·마켓)">
          <div style={{display:"flex", gap:10, marginTop:12}}>
            <Card style={{flex:1, textAlign:"center"}}>
              <div style={{fontSize:11.5, color:T.muted}}>예상 기대득점 (xG)</div>
              <div style={{fontSize:24, fontWeight:800, marginTop:4}}>{result.lambdaHome.toFixed(2)} : {result.lambdaAway.toFixed(2)}</div>
            </Card>
            <Card style={{flex:1, textAlign:"center"}}>
              <div style={{fontSize:11.5, color:T.muted}}>ELO (홈/원정)</div>
              <div style={{fontSize:24, fontWeight:800, marginTop:4}}>{Math.round(result.homeElo)} : {Math.round(result.awayElo)}</div>
            </Card>
          </div>

          <Card style={{marginTop:12}}>
            <SectionTitle>주요 예상 스코어라인 (Top 5)</SectionTitle>
            <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
              {result.topScores.map((s,i) => (
                <div key={s.score} style={{flex:"1 1 28%", minWidth:90}}>
                  <ScoreRow rank={i+1} score={`${s.score} (${pct(s.prob)})`} prob={s.prob} top={i===0}/>
                </div>
              ))}
            </div>
          </Card>

          <Card style={{marginTop:12}}>
            <SectionTitle sub="모델 예측 vs 실시간 시장 배당">오버/언더 (총 골수 기준)</SectionTitle>
            <div style={{display:"flex", gap:10}}>
              {["2.5","3.5"].map(line => {
                const ou = result.overUnder[line];
                const rec = ou && ou.over > ou.under ? "오버" : "언더";
                const recColor = rec === "오버" ? T.green : T.gold;
                const lineNum = parseFloat(line);
                const mktEntry = Array.isArray(result.marketTotals)
                  ? result.marketTotals.find(t => Math.abs(t.point - lineNum) < 0.01)
                  : null;
                const mktProb = mktEntry ? devigTotalsLine(mktEntry) : null;
                const evOver = mktEntry ? computeEV(ou?.over, mktEntry.over) : null;
                const evUnder = mktEntry ? computeEV(ou?.under, mktEntry.under) : null;
                const bestEv = (evOver != null && evUnder != null)
                  ? (evOver >= evUnder ? {label:"오버", ev:evOver, color:T.green} : {label:"언더", ev:evUnder, color:T.gold})
                  : null;
                return (
                  <div key={line} style={{flex:1, textAlign:"center"}}>
                    <div style={{fontSize:12, color:T.muted}}>라인 {line}</div>
                    <div style={{fontSize:14, fontWeight:700, marginTop:4}}>
                      <span style={{color:T.green}}>오버 {pct(ou?.over)}</span>{" "}
                      <span style={{color:T.gold}}>언더 {pct(ou?.under)}</span>
                    </div>
                    <div style={{marginTop:6, height:6, borderRadius:3, background:T.dim, overflow:"hidden"}}>
                      <div style={{height:"100%", width:pct(ou?.over), background:T.green}}/>
                    </div>
                    <span style={{display:"inline-block", marginTop:8, padding:"4px 12px", borderRadius:16,
                                  background: recColor+"26", border:`1px solid ${recColor}`, color:recColor, fontSize:11.5, fontWeight:800}}>
                      예측: {rec} {line}
                    </span>

                    {mktEntry ? (
                      <div style={{marginTop:10, paddingTop:8, borderTop:`1px dashed ${T.border}`}}>
                        <div style={{fontSize:10.5, color:T.muted}}>실시간 시장 배당</div>
                        <div style={{fontSize:12.5, fontWeight:800, marginTop:3}}>
                          <span style={{color:T.green}}>O {mktEntry.over.toFixed(2)}</span>{" "}
                          <span style={{color:T.gold}}>U {mktEntry.under.toFixed(2)}</span>
                        </div>
                        {mktProb && (
                          <div style={{fontSize:10.5, color:T.muted, marginTop:2}}>
                            시장확률 오버 {pct(mktProb.over)} · 언더 {pct(mktProb.under)}
                          </div>
                        )}
                        {bestEv && (
                          <div style={{fontSize:10.5, marginTop:4, fontWeight:800,
                            color: bestEv.ev > 0.03 ? bestEv.color : T.muted}}>
                            {bestEv.ev > 0.03 ? "💰 " : ""}{bestEv.label} EV {bestEv.ev>=0?"+":""}{(bestEv.ev*100).toFixed(1)}%
                          </div>
                        )}
                      </div>
                    ) : (
                      <div style={{marginTop:10, paddingTop:8, borderTop:`1px dashed ${T.border}`, fontSize:10.5, color:T.dim}}>
                        해당 라인 시장 배당 없음
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:10.5, color:T.dim, marginTop:10}}>
              {result.marketTotals
                ? `📡 ${result.marketTotalsSource?.startsWith("the-odds-api") ? "The Odds API" : result.marketTotalsSource?.startsWith("API-Football") ? result.marketTotalsSource : "odds-api.io"} 실시간 오버/언더 배당 기준 · EV는 모델확률×시장배당-1`
                : "ℹ️ 이 경기의 실시간 오버/언더 배당을 찾지 못했습니다 (모델 예측만 표시). 설정탭에서 The Odds API 키 확인."}
            </div>
          </Card>

          {/* ── 핸디캡 확률 카드 (점수/오버언더와 한 묶음으로 표시) ── */}
          {result.handicapProbs && (
            <Card style={{marginTop:12}}>
              <SectionTitle sub="홈팀 기준 아시안 핸디캡 커버 확률">🎯 핸디캡 (Asian Handicap)</SectionTitle>
              <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
                {Object.entries(result.handicapProbs).map(([h, prob]) => {
                  const isPos = prob > 0.55, isNeg = prob < 0.45;
                  const color = isPos ? T.green : isNeg ? T.red : T.muted;
                  return (
                    <div key={h} style={{flex:"1 1 22%", minWidth:70, textAlign:"center", padding:"8px 4px",
                      borderRadius:9, background:T.surface, border:`1px solid ${isPos?T.green:isNeg?T.red:T.border}`}}>
                      <div style={{fontSize:11, color:T.muted}}>홈 {h}</div>
                      <div style={{fontSize:15, fontWeight:800, color, marginTop:2}}>{pct(prob)}</div>
                    </div>
                  );
                })}
              </div>
              <div style={{fontSize:11, color:T.dim, marginTop:8}}>💡 홈팀이 해당 핸디캡을 극복할 확률. 50% 이상이면 홈팀 유리.</div>
            </Card>
          )}

          {/* ── 신규: 시뮬레이션 마켓 통계 (BTTS·클린시트·정확스코어 등) ── */}
          {result.marketStats && (() => {
            const ms = result.marketStats;
            const Row = ({label, a, aLbl, b, bLbl, hi}) => (
              <div style={{display:"flex", alignItems:"center", gap:8, padding:"7px 0", borderBottom:`1px solid ${T.border}33`}}>
                <span style={{fontSize:12, color:T.text, fontWeight:600, width:96, flexShrink:0}}>{label}</span>
                <div style={{flex:1, display:"flex", height:22, borderRadius:6, overflow:"hidden", background:T.bg}}>
                  <div style={{width:pct(a), background: hi===0?T.green:T.cyan, display:"flex", alignItems:"center", justifyContent:"center"}}>
                    {a>=0.15 && <span style={{fontSize:10, fontWeight:700, color:"#000"}}>{pct(a)}</span>}
                  </div>
                  <div style={{width:pct(b), background: hi===1?T.green:T.dim, display:"flex", alignItems:"center", justifyContent:"center"}}>
                    {b>=0.15 && <span style={{fontSize:10, fontWeight:700, color:"#000"}}>{pct(b)}</span>}
                  </div>
                </div>
              </div>
            );
            return (
              <Card style={{marginTop:12}}>
                <SectionTitle sub={`몬테카를로 ${result.sims.toLocaleString()}회 시뮬레이션 기반`}>📊 마켓 분석</SectionTitle>
                {/* 라벨 헤더 */}
                <div style={{display:"flex", gap:8, marginBottom:4}}>
                  <span style={{width:96, flexShrink:0}}/>
                  <div style={{flex:1, display:"flex", justifyContent:"space-between", fontSize:9.5, color:T.muted}}>
                    <span>← 첫 번째</span><span>두 번째 →</span>
                  </div>
                </div>
                <Row label="양팀득점 BTTS" a={ms.btts.yes} b={ms.btts.no} hi={0}/>
                <div style={{fontSize:9, color:T.dim, marginTop:-2, marginBottom:2, paddingLeft:104}}>예/아니오</div>
                <Row label="오버 1.5골" a={ms.over15.over} b={ms.over15.under} hi={0}/>
                <div style={{fontSize:9, color:T.dim, marginTop:-2, marginBottom:2, paddingLeft:104}}>오버/언더</div>
                <Row label={`${home} 클린시트`} a={ms.cleanSheet.home} b={1-ms.cleanSheet.home} hi={0}/>
                <div style={{fontSize:9, color:T.dim, marginTop:-2, marginBottom:2, paddingLeft:104}}>무실점/실점</div>
                <Row label={`${away} 클린시트`} a={ms.cleanSheet.away} b={1-ms.cleanSheet.away} hi={0}/>
                <div style={{fontSize:9, color:T.dim, marginTop:-2, marginBottom:2, paddingLeft:104}}>무실점/실점</div>
                <Row label="총득점 홀짝" a={ms.oddEven.odd} b={ms.oddEven.even} hi={-1}/>
                <div style={{fontSize:9, color:T.dim, marginTop:-2, marginBottom:8, paddingLeft:104}}>홀수/짝수</div>

                {/* 무실점 승리 */}
                <div style={{display:"flex", gap:8, marginTop:6}}>
                  <div style={{flex:1, textAlign:"center", padding:"8px 4px", borderRadius:9, background:T.surface, border:`1px solid ${T.border}`}}>
                    <div style={{fontSize:10.5, color:T.muted}}>{home} 무실점승</div>
                    <div style={{fontSize:15, fontWeight:800, color:T.green, marginTop:2}}>{pct(ms.winToNil.home)}</div>
                  </div>
                  <div style={{flex:1, textAlign:"center", padding:"8px 4px", borderRadius:9, background:T.surface, border:`1px solid ${T.border}`}}>
                    <div style={{fontSize:10.5, color:T.muted}}>{away} 무실점승</div>
                    <div style={{fontSize:15, fontWeight:800, color:T.cyan, marginTop:2}}>{pct(ms.winToNil.away)}</div>
                  </div>
                </div>

                {/* 정확한 스코어 분포 */}
                <div style={{marginTop:14}}>
                  <div style={{fontSize:12, fontWeight:700, color:T.text, marginBottom:6}}>정확한 스코어 확률 (상위 8)</div>
                  <div style={{display:"flex", flexDirection:"column", gap:3}}>
                    {ms.exactDist.map((d,i) => (
                      <div key={d.score} style={{display:"flex", alignItems:"center", gap:8}}>
                        <span style={{fontSize:12, fontWeight:700, color: i===0?T.accent:T.text, width:34, flexShrink:0}}>{d.score}</span>
                        <div style={{flex:1, height:14, background:T.bg, borderRadius:4, overflow:"hidden"}}>
                          <div style={{height:"100%", width:pct(d.prob/ms.exactDist[0].prob), background: i===0?T.accent:T.cyan}}/>
                        </div>
                        <span style={{fontSize:11, color:T.muted, width:42, textAlign:"right", flexShrink:0}}>{pct(d.prob)}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{fontSize:9.5, color:T.dim, marginTop:10, lineHeight:1.5}}>
                  ⚠️ 골 시뮬레이션에서 직접 산출한 확률입니다. 코너·카드·전후반 등은 모델에 없어 제공하지 않습니다.
                </div>
              </Card>
            );
          })()}

          <div style={{textAlign:"center", marginTop:14, fontSize:12, color:T.muted, lineHeight:1.6}}>
            🎲 몬테카를로 {result.sims.toLocaleString()}회 · ELO+ML 앙상블 50% + 시뮬레이션 50% 블렌딩<br/>
            <span style={{fontSize:11, color:T.dim}}>v2: PSxG 골키퍼 보정 · 빅찬스 스큐 · 원정 피로도 반영</span>
          </div>
          </CollapsibleSection>

          <CollapsibleSection title="🔬 심화 분석 패널 (레이더·최근폼·라인업·심판 성향 등)">
          {/* ── 신규: 전력 레이더 차트 ── */}
          <ErrorBoundary>
            <RadarPanel home={home} away={away}/>
          </ErrorBoundary>

          {/* ── 신규: 모델 신뢰도 분석 (보정 차트) ── */}
          <ErrorBoundary>
            <CalibrationPanel predProb={Math.max(result.homeWinProb, result.drawProb, result.awayWinProb)}/>
          </ErrorBoundary>

          {/* ── 신규: 골드만삭스 진출 확률 ── */}
          <ErrorBoundary>
            <GoldmanPanel home={home} away={away}/>
          </ErrorBoundary>

          {/* ── 신규: 최근 5경기 폼 ── */}
          <ErrorBoundary>
            <RecentFormPanel home={home} away={away}/>
          </ErrorBoundary>

          {/* ── v3 신규: 실시간 선발 라인업 ── */}
          <ErrorBoundary>
            <LiveLineupPanel home={home} away={away} matchDate={matchInfo?.date || null}
              onAbsenceChange={() => { if (typeof onPredict === "function") onPredict(); }}/>
          </ErrorBoundary>

          {/* 2026-08-01: 개인 기여도(PlayerContributionPanel)는 확률 바로 아래로
              이동했음(위쪽 참고) — 여기 있던 중복 호출 제거. */}

          {result.cv && <CrossValidationCard cv={result.cv} home={home} away={away} result={result}/>}

          {/* ── v2 신규: 고급 지표 비교 패널 ── */}
          <ErrorBoundary>
            <AdvancedStatsPanel home={home} away={away}/>
          </ErrorBoundary>

          {/* ── 2026-08-02 신규: 세트피스·카드 비교(구 "기타" 리더보드 이동분) ── */}
          <ErrorBoundary>
            <SetPieceCardsCompareCard home={home} away={away}/>
          </ErrorBoundary>

          {/* ── v3 신규: 심판 성향 패널 ── */}
          <ErrorBoundary>
            <RefereePanel home={home} away={away}/>
          </ErrorBoundary>

          {/* ── v3 신규: 원정 이동거리 & 피로도 시각화 ── */}
          <ErrorBoundary>
            <TravelFatigueCard home={home} away={away}/>
          </ErrorBoundary>

          {/* ── v2: 리그 실시간 순위 (로컬 계산) ── */}
          {RUNTIME_CONFIG.useFootballDataOrg && (
            <ErrorBoundary>
              <LiveStandingPanel home={home} away={away}/>
            </ErrorBoundary>
          )}
          </CollapsibleSection>

          <CollapsibleSection title="💰 가치베팅 · 예측근거 · 컨디션 보정">
          {/* ── Value Bet (EV) 카드 ── */}
          {result.liveApplied && result.marketProbs && (() => {
            const mp = result.marketProbs;
            const evH = computeEV(result.homeWinProb, mp.home > 0 ? 1/mp.home : null);
            const evD = computeEV(result.drawProb, mp.draw > 0 ? 1/mp.draw : null);
            const evA = computeEV(result.awayWinProb, mp.away > 0 ? 1/mp.away : null);
            const hasValue = evH > 0.03 || evD > 0.03 || evA > 0.03;
            return (
              <Card style={{marginTop:12}}>
                <SectionTitle sub="내 모델 vs 시장 배당 기대수익 (양수=가치 베팅 기회)">💰 Value Bet 분석 (EV)</SectionTitle>
                {mp.source === "static-report" && (
                  <div style={{fontSize:10.5, color:T.dim, marginBottom:6}}>
                    📋 실시간 배당 API 미응답 — 기본 배당(Bet365/William Hill/1xBet 평균)으로 계산됨
                  </div>
                )}
                {STATIC_PREDICTED_SCORES[`${home}_${away}`] && (
                  <div style={{fontSize:11.5, color:T.muted, marginBottom:8}}>
                    📋 기본 예측 스코어: <span style={{color:T.text, fontWeight:700}}><TeamCrest name={home}/> {STATIC_PREDICTED_SCORES[`${home}_${away}`]} <TeamCrest name={away}/></span>
                  </div>
                )}
                <div style={{display:"flex", gap:10}}>
                  {[
                    {label:`$<TeamCrest name={home}/> 홈승`, ev:evH, color:T.accent},
                    {label:"무승부", ev:evD, color:T.muted},
                    {label:`원정승 $<TeamCrest name={away}/>`, ev:evA, color:T.gold},
                  ].map(({label, ev, color}) => (
                    <div key={label} style={{flex:1, textAlign:"center", padding:"10px 4px",
                      borderRadius:9, background:T.surface,
                      border:`1px solid ${ev!==null && ev>0.03 ? T.green : T.border}`}}>
                      <div style={{fontSize:11, color:T.muted}}>{label}</div>
                      <div style={{fontSize:15, fontWeight:800, marginTop:4,
                        color: ev===null?"gray" : ev>0.03?T.green : ev<-0.03?T.red : T.text}}>
                        {ev===null ? "-" : `${ev>=0?"+":""}${(ev*100).toFixed(1)}%`}
                      </div>
                    </div>
                  ))}
                </div>
                {hasValue && <div style={{marginTop:8, fontSize:11.5, color:T.green, fontWeight:700}}>✅ 모델이 시장보다 유리하게 평가하는 베팅이 있습니다.</div>}
                <div style={{fontSize:11, color:T.dim, marginTop:4}}>⚠️ 참고용입니다. 실제 베팅 판단에 단독으로 사용하지 마세요.</div>
              </Card>
            );
          })()}

          {/* ── 휴식일 / 동기부여 보정 정보 ── */}
          {result.explain && result.explain.factors && result.explain.factors.length > 0 && (
            <Card style={{marginTop:12}}>
              <SectionTitle sub="각 요소가 예상 득점(λ)에 기여한 방향과 크기">🔍 예측 근거</SectionTitle>
              <div style={{fontSize:11, color:T.muted, marginBottom:8}}>
                기본 홈 이점 +{(result.explain.base.homeAdvantage*100).toFixed(0)}% · ELO 격차 {result.explain.base.eloDiff>0?"+":""}{result.explain.base.eloDiff}
                {result.explain.isRivalry && <span style={{color:T.gold, fontWeight:700}}> · ⚔️ 라이벌 매치(접전 보정)</span>}
              </div>
              {(() => {
                const fs = [...result.explain.factors].sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
                const maxAbs = Math.max(...fs.map(f=>Math.abs(f.delta)), 0.01);
                return fs.map((f,i) => {
                  const w = Math.abs(f.delta)/maxAbs*100;
                  const pos = f.delta >= 0;
                  return (
                    <div key={i} style={{display:"flex", alignItems:"center", gap:8, padding:"4px 0"}}>
                      <span style={{fontSize:11.5, color:T.muted, width:96, flexShrink:0}}>{f.label}</span>
                      <div style={{flex:1, display:"flex", alignItems:"center", height:14}}>
                        <div style={{flex:1, display:"flex", justifyContent:"flex-end"}}>
                          {!pos && <div style={{width:`${w}%`, height:10, background:T.red, borderRadius:"3px 0 0 3px"}}/>}
                        </div>
                        <div style={{width:1, height:14, background:T.border}}/>
                        <div style={{flex:1}}>
                          {pos && <div style={{width:`${w}%`, height:10, background:T.green, borderRadius:"0 3px 3px 0"}}/>}
                        </div>
                      </div>
                      <span style={{fontSize:10.5, width:44, textAlign:"right", flexShrink:0,
                        color: pos?T.green:T.red, fontWeight:700}}>
                        {pos?"+":""}{(f.delta).toFixed(2)}
                      </span>
                    </div>
                  );
                });
              })()}
              <div style={{fontSize:9.5, color:T.dim, marginTop:8, lineHeight:1.5}}>
                🟢 오른쪽(+)은 총 예상 득점을 높인 요소, 🔴 왼쪽(−)은 낮춘 요소입니다. 값이 0에 가까운 요소는 생략됩니다.
              </div>
            </Card>
          )}

          {result.restInfo && matchInfo && (
            <Card style={{marginTop:12}}>
              <SectionTitle>📅 경기 컨디션 보정</SectionTitle>
              {[
                {team:home, rest:result.restInfo.homeRestBonus, mot:result.restInfo.homeMotivation},
                {team:away, rest:result.restInfo.awayRestBonus, mot:result.restInfo.awayMotivation},
              ].map(({team, rest, mot}) => {
                const days = getRestDays(team, matchInfo.date);
                return (
                  <div key={team} style={{display:"flex", justifyContent:"space-between", alignItems:"center",
                    padding:"8px 0", borderBottom:`1px solid ${T.border}`}}>
                    <span style={{fontSize:13, fontWeight:700}}><TeamCrest name={team}/> {team}</span>
                    <span style={{fontSize:12, color:T.muted}}>
                      휴식 {days!==null?`${days.toFixed(0)}일`:"첫 경기"}
                      <span style={{color: rest>0?T.green:rest<0?T.red:T.muted, fontWeight:700, marginLeft:6}}>
                        {rest>0?`+${(rest*100).toFixed(0)}%`:rest<0?`${(rest*100).toFixed(0)}%`:"±0"}
                      </span>
                      {" · 동기"}
                      <span style={{color: mot>1.0?T.cyan:T.muted, fontWeight:700, marginLeft:4}}>
                        {mot>1.0?`+${((mot-1)*100).toFixed(0)}%`:"기본"}
                      </span>
                    </span>
                  </div>
                );
              })}
            </Card>
          )}
          </CollapsibleSection>

          <Card style={{marginTop:12}}>
            <SectionTitle>💾 예측 저장 &amp; 결과 추적</SectionTitle>
            <div style={{fontSize:12, color:T.muted, marginBottom:10}}>
              저장하면 "기록" 탭에서 실제 경기 결과를 입력해 적중 여부를 추적하고, 동적 ELO에도 반영할 수 있어요.
            </div>
            <button onClick={onSave} style={{width:"100%", padding:"10px", borderRadius:9,
                    border:`1px solid ${T.border}`, background:T.surface, color:T.cyan, fontSize:13, fontWeight:700, cursor:"pointer"}}>
              📌 이 예측 저장하기
            </button>
          </Card>
        </>
      )}
    </div>
  );
}

function CrossValidationCard({cv, home, away, result}) {
  const Box = ({title, probs, empty}) => (
    <div style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:10, padding:10}}>
      <div style={{fontSize:11.5, color:T.muted, marginBottom:6}}>{title}</div>
      {probs ? (
        <div style={{fontSize:12.5, lineHeight:1.7}}>
          <span style={{color:T.accent, fontWeight:700}}><TeamCrest name={home}/> {pct(probs.home)}</span> · 무 {pct(probs.draw)} ·{" "}
          <span style={{color:T.gold, fontWeight:700}}>{pct(probs.away)} <TeamCrest name={away}/></span>
        </div>
      ) : (
        <div style={{fontSize:12, color:T.dim}}>{empty}</div>
      )}
    </div>
  );
  return (
    <Card style={{marginTop:12}}>
      <SectionTitle sub="외부 랭킹/배당/ML예측을 자체 모델과 비교합니다">🔬 교차검증 (Opta / 시장배당 / API예측 / SPI)</SectionTitle>
      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8}}>
        <Box title="Opta 파워랭킹" probs={cv.opta} empty="데이터 없음"/>
        <Box title="시장 배당 (마진제거)" probs={cv.market} empty={result.liveApplied ? "데이터 없음" : "실시간 배당 미연동"}/>
        <Box title="API 예측 (API-Football/BSD)" probs={cv.apiFootball} empty={result.liveApplied ? "이 경기 데이터 없음" : "미연동 (설정에서 확인)"}/>
        <Box title="SPI (정적)" probs={cv.spi} empty="데이터 없음"/>
      </div>
      <div style={{marginTop:12}}>
        <div style={{display:"flex", justifyContent:"space-between", fontSize:12, color:T.muted}}>
          <span>모델 신뢰도</span>
          <span style={{color:T.gold, fontWeight:800}}>{cv.confidence}/100</span>
        </div>
        <div style={{marginTop:5, height:6, borderRadius:3, background:T.dim, overflow:"hidden"}}>
          <div style={{height:"100%", width:`${cv.confidence}%`, background: cv.confidence>=60?T.green : cv.confidence>=35?T.gold : T.red}}/>
        </div>
      </div>
      {cv.deviation != null && (
        <div style={{display:"flex", justifyContent:"space-between", marginTop:8, fontSize:12, color:T.muted}}>
          <span>모델 vs 컨센서스 편차</span>
          <span style={{color:T.text, fontWeight:700}}>{pct(cv.deviation)}p</span>
        </div>
      )}
    </Card>
  );
}

// ============================================================ 일정 .ics 캘린더 내보내기
function icsPad2(n) { return String(n).padStart(2, "0"); }
function icsDateTime(dateStr, timeStr) {
  const [y, m, d] = dateStr.split("-");
  const [hh, mm] = timeStr.split(":");
  return `${y}${m}${d}T${hh}${mm}00`;
}
function icsDateTimePlusHours(dateStr, timeStr, hours) {
  const dt = new Date(`${dateStr}T${timeStr}:00`);
  dt.setHours(dt.getHours() + hours);
  return `${dt.getFullYear()}${icsPad2(dt.getMonth()+1)}${icsPad2(dt.getDate())}T${icsPad2(dt.getHours())}${icsPad2(dt.getMinutes())}00`;
}
function generateICS(matches) {
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${icsPad2(now.getUTCMonth()+1)}${icsPad2(now.getUTCDate())}T${icsPad2(now.getUTCHours())}${icsPad2(now.getUTCMinutes())}00Z`;
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//EPL 예측기//KO", "CALSCALE:GREGORIAN"];
  matches.forEach((g, i) => {
    if (!g.date || !g.time) return;
    lines.push("BEGIN:VEVENT");
    lines.push(`UID:epl-${g.date}-${g.time}-${i}@epl-predictor`);
    lines.push(`DTSTAMP:${stamp}`);
    lines.push(`DTSTART:${icsDateTime(g.date, g.time)}`);
    lines.push(`DTEND:${icsDateTimePlusHours(g.date, g.time, 2)}`);
    lines.push(`SUMMARY:⚽ ${g.home} vs ${g.away}`);
    lines.push(`DESCRIPTION:프리미어리그 · ${g.home} vs ${g.away}`);
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}
function downloadICS(filename, content) {
  const blob = new Blob([content], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function ScheduleTab({onSelectMatch, liveResults, onResultFetched}) {
  const d = new Date();
  const today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const [fetchingKey, setFetchingKey] = useState(null);
  const [manualScores, setManualScores] = useState({});
  const [showPast, setShowPast] = useState(false);

  const byDate = useMemo(() => {
    const m = {};
    for (const g of SCHEDULE) {
      if (!g || !g.date || !g.home || !g.away) continue;
      if (!m[g.date]) m[g.date] = [];
      m[g.date].push(g);
    }
    const entries = Object.entries(m).filter(([date]) => date && date !== "undefined");
    return entries.sort((a,b)=> a[0]<b[0]?-1:1);
  }, [SCHEDULE.length]);

  const isPast = (date) => date < today;
  const isToday = (date) => date === today;

  // 다가오는 경기를 최상단에 항상 표시, 종료된 경기는 접어서 하단에 기본 숨김
  const upcomingDates = byDate.filter(([date]) => !isPast(date));
  const pastDates = byDate.filter(([date]) => isPast(date)).slice().reverse();
  // 원하는 달만 골라서 보기 (예: 12월 경기만 보고 예측하고 싶을 때)
  const months = [...new Set(byDate.map(([date]) => date.slice(0,7)))].sort();
  const [selectedMonth, setSelectedMonth] = useState(null);
  const monthDates = selectedMonth ? byDate.filter(([date]) => date.startsWith(selectedMonth)) : null;

  const handleAutoFetch = async (g) => {
    const key = resultKey(g.home, g.away);
    setFetchingKey(key);
    const res = await autoFetchAndStoreResult(g.home, g.away, g.date).catch(()=>null);
    setFetchingKey(null);
    if (res) {
      onResultFetched();
    } else {
      alert(`⚠️ 자동조회 실패\n\n${g.home} vs ${g.away}\n\n외부 소스에서 결과를 가져오지 못했습니다.\n인터넷 연결을 확인하거나, 아래 수동 입력을 이용해주세요.`);
    }
  };

  const handleManualInput = (g, field, val) => {
    const key = resultKey(g.home, g.away);
    setManualScores(prev => ({...prev, [key]: {...(prev[key]||{}), [field]: val}}));
  };

  const handleManualSave = async (g) => {
    const key = resultKey(g.home, g.away);
    const sc = manualScores[key];
    if (!sc || sc.hg === undefined || sc.ag === undefined || sc.hg === "" || sc.ag === "") return;
    setStoredResult(g.home, g.away, Number(sc.hg), Number(sc.ag), "manual");
    await saveLiveResults();
    const staticTeamStats = STATIC_MATCH_STATS[`${g.home}_${g.away}`]?.team;
    updateEloAfterMatch(g.home, g.away, Number(sc.hg), Number(sc.ag),
      staticTeamStats?.home?.xg, staticTeamStats?.away?.xg, "group");
    await saveDynamicElo();
    onResultFetched();
  };

  return (
    <div>
      <Card>
        <div style={{fontSize:12.5, color:T.muted, lineHeight:1.6}}>
          프리미어리그 일정 (총 {SCHEDULE.length}경기).
          <span style={{color:T.green, fontWeight:700}}> 종료 경기</span>는 결과를 자동 조회하거나 직접 입력할 수 있습니다.
        </div>
        <button onClick={() => {
            const upcoming = SCHEDULE.filter(g => g.date >= today);
            downloadICS("EPL_일정.ics", generateICS(upcoming));
          }}
          style={{width:"100%", marginTop:10, padding:"10px 0", borderRadius:9, border:`1px solid ${T.border}`,
                  background:T.surface, color:T.text, fontSize:12.5, fontWeight:700, cursor:"pointer"}}>
          📅 남은 일정 캘린더로 내보내기 (.ics)
        </button>
      </Card>
      {months.length > 1 && (
        <div style={{display:"flex", gap:6, overflowX:"auto", padding:"10px 2px 2px", marginTop:10}}>
          <button onClick={() => setSelectedMonth(null)}
            style={{flexShrink:0, padding:"6px 13px", borderRadius:20, border:`1px solid ${!selectedMonth?T.accent:T.border}`,
                    background: !selectedMonth?T.accent:T.surface, color: !selectedMonth?"#fff":T.muted,
                    fontSize:12, fontWeight:700, cursor:"pointer"}}>
            전체
          </button>
          {months.map(m => {
            const active = selectedMonth === m;
            const label = `${m.slice(2,4)}.${m.slice(5,7)}`;
            return (
              <button key={m} onClick={() => setSelectedMonth(m)}
                style={{flexShrink:0, padding:"6px 13px", borderRadius:20, border:`1px solid ${active?T.accent:T.border}`,
                        background: active?T.accent:T.surface, color: active?"#fff":T.muted,
                        fontSize:12, fontWeight:700, cursor:"pointer"}}>
                {label}
              </button>
            );
          })}
        </div>
      )}
      {selectedMonth ? (
        monthDates.length === 0 ? (
          <Card style={{marginTop:10, textAlign:"center"}}>
            <div style={{fontSize:12.5, color:T.muted}}>해당 월 경기가 없습니다.</div>
          </Card>
        ) : monthDates.map(([date, games]) => renderDateGroup(date, games))
      ) : (
        <React.Fragment>
          {upcomingDates.length === 0 && (
            <Card style={{marginTop:10, textAlign:"center"}}>
              <div style={{fontSize:12.5, color:T.muted}}>예정된 경기가 없습니다.</div>
            </Card>
          )}
          {upcomingDates.map(([date, games]) => renderDateGroup(date, games))}
          {pastDates.length > 0 && (
            <div style={{marginTop:14}}>
              <button onClick={() => setShowPast(s => !s)}
                style={{width:"100%", padding:"10px 0", borderRadius:9, border:`1px solid ${T.border}`,
                        background:T.surface, color:T.muted, fontSize:12.5, fontWeight:700, cursor:"pointer"}}>
                {showPast
                  ? "▲ 종료된 경기 숨기기"
                  : `▼ 종료된 경기 보기 (${pastDates.reduce((n,[,g])=>n+g.length,0)}경기)`}
              </button>
              {showPast && pastDates.map(([date, games]) => renderDateGroup(date, games))}
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );

  function renderDateGroup(date, games) {
    const past = isPast(date), todayFlag = isToday(date);
    return (
      <Card key={date} style={{marginTop:10}}>
            <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:6}}>
              <span style={{fontSize:12.5, fontWeight:800, color: todayFlag?T.gold:past?T.muted:T.cyan}}>
                📆 {date}
              </span>
              {todayFlag && <span style={{fontSize:11, padding:"2px 8px", borderRadius:10, background:"rgba(245,166,35,0.2)", color:T.gold, fontWeight:700}}>오늘</span>}
              {past && <span style={{fontSize:11, color:T.dim}}>종료</span>}
            </div>
            {games.filter(g => g && g.home && g.away).map((g,i) => {
              const key = resultKey(g.home, g.away);
              const stored = getStoredResult(g.home, g.away);
              const isFetching = fetchingKey === key;
              const ms = manualScores[key] || {};

              if ((past || todayFlag) && stored) {
                const isSwapped = !!_liveResults[resultKey(g.away, g.home)] && !_liveResults[resultKey(g.home, g.away)];
                const hg = isSwapped ? stored.away : stored.home;
                const ag = isSwapped ? stored.home : stored.away;
                const homeWon = hg > ag, awayWon = ag > hg;

                const predKey = `${g.home}_${g.away}`;
                const predEntry = OPENING_RESULTS.find(o => o && o.home===g.home && o.away===g.away);
                const predScore = (predEntry && predEntry.topScore) ? predEntry.topScore : (STATIC_PREDICTED_SCORES[predKey] || null);
                let hitBadge = null;
                if (predScore) {
                  const [ph, pa] = predScore.split("-").map(Number);
                  const exactHit = ph===hg && pa===ag;
                  const predDir = ph>pa?"home":ph<pa?"away":"draw";
                  const actualDir = hg>ag?"home":hg<ag?"away":"draw";
                  const dirHit = predDir===actualDir;
                  if (exactHit) hitBadge = {label:"✅ 스코어 적중", color:T.green, bg:"rgba(0,255,128,0.12)"};
                  else if (dirHit) hitBadge = {label:"🔵 방향 적중", color:T.cyan, bg:"rgba(0,200,255,0.12)"};
                  else hitBadge = {label:"❌ 미적중", color:T.red, bg:"rgba(255,80,80,0.10)"};
                }

                return (
                  <div key={i} style={{borderTop: i>0?`1px solid ${T.border}`:"none", padding:"9px 0"}}>
                    <div style={{display:"flex", alignItems:"center", gap:6}}>
                      <span style={{display:"flex", flexDirection:"column", width:46}}>
                        <span style={{fontSize:11, color:T.muted}}>{g.time}</span>
                        {g.friendly && <span style={{fontSize:8.5, color:T.gold, fontWeight:700}}>친선</span>}
                      </span>
                      <span style={{flex:1, fontSize:13, fontWeight: homeWon?800:400, color: homeWon?T.text:T.muted}}>
                        <TeamCrest name={g.home}/> {g.home}
                      </span>
                      <span style={{fontSize:16, fontWeight:900, color:T.text, minWidth:52, textAlign:"center"}}>
                        <span style={{color: homeWon?T.green:T.text}}>{hg}</span>
                        <span style={{color:T.dim}}> : </span>
                        <span style={{color: awayWon?T.green:T.text}}>{ag}</span>
                      </span>
                      <span style={{flex:1, fontSize:13, fontWeight: awayWon?800:400, color: awayWon?T.text:T.muted, textAlign:"right"}}>
                        {g.away} <TeamCrest name={g.away}/>
                      </span>
                      <span style={{fontSize:10, color:T.dim, marginLeft:4}}>{stored.source==="manual"?"✏️":"🤖"}</span>
                    </div>
                    {predScore && hitBadge && (
                      <div style={{display:"flex", alignItems:"center", gap:6, marginTop:4, paddingLeft:52}}>
                        <span style={{fontSize:10.5, color:T.dim}}>예측 {predScore}</span>
                        <span style={{fontSize:10.5, fontWeight:700, color:hitBadge.color,
                          background:hitBadge.bg, borderRadius:6, padding:"2px 7px"}}>
                          {hitBadge.label}
                        </span>
                      </div>
                    )}
                  </div>
                );
              }

              if (past || todayFlag) {
                const [hh, mm] = (g.time || "00:00").split(":").map(Number);
                const now = new Date();
                const gameStart = new Date(date + "T" + String(hh).padStart(2,"0") + ":" + String(mm||0).padStart(2,"0") + ":00");
                const gameStarted = (now - gameStart) > 100 * 60 * 1000;

                if (!gameStarted) {
                  return (
                    <div key={i} style={{borderTop: i>0?`1px solid ${T.border}`:"none", padding:"9px 0"}}>
                      <div style={{display:"flex", alignItems:"center", gap:6}}>
                        <span style={{display:"flex", flexDirection:"column", width:46}}>
                        <span style={{fontSize:11, color:T.muted}}>{g.time}</span>
                        {g.friendly && <span style={{fontSize:8.5, color:T.gold, fontWeight:700}}>친선</span>}
                      </span>
                        <span style={{flex:1, fontSize:13, color:T.muted, display:"inline-flex", alignItems:"center", gap:5}}><TeamCrest name={g.home}/> {g.home}</span>
                        <span style={{fontSize:13, color:T.dim, padding:"0 8px"}}>vs</span>
                        <span style={{flex:1, fontSize:13, color:T.muted, textAlign:"right", display:"inline-flex", alignItems:"center", gap:5, justifyContent:"flex-end"}}>{g.away} <TeamCrest name={g.away}/></span>
                        <button onClick={()=>onSelectMatch(g.home, g.away)}
                          style={{padding:"5px 10px", borderRadius:7, border:"none",
                            background:T.accent, color:"#fff", fontSize:12, cursor:"pointer"}}>▶</button>
                      </div>
                    </div>
                  );
                }

                return (
                  <div key={i} style={{borderTop: i>0?`1px solid ${T.border}`:"none", padding:"9px 0"}}>
                    <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:6}}>
                      <span style={{display:"flex", flexDirection:"column", width:46}}>
                        <span style={{fontSize:11, color:T.muted}}>{g.time}</span>
                        {g.friendly && <span style={{fontSize:8.5, color:T.gold, fontWeight:700}}>친선</span>}
                      </span>
                      <span style={{flex:1, fontSize:13, color:T.muted, display:"inline-flex", alignItems:"center", gap:5, flexWrap:"wrap"}}><TeamCrest name={g.home}/> {g.home} vs {g.away} <TeamCrest name={g.away}/></span>
                    </div>
                    <div style={{display:"flex", gap:6, alignItems:"center", paddingLeft:46}}>
                      <button onClick={()=>handleAutoFetch(g)} disabled={isFetching}
                        style={{padding:"5px 10px", borderRadius:7, border:`1px solid ${T.green}`,
                          background:"transparent", color:T.green, fontSize:11, fontWeight:700, cursor:"pointer"}}>
                        {isFetching ? "⏳" : "🤖 자동"}
                      </button>
                      <input type="number" min="0" max="20" placeholder="홈" value={ms.hg??""} onChange={e=>handleManualInput(g,"hg",e.target.value)}
                        style={{width:40,padding:"5px",borderRadius:7,background:T.surface,border:`1px solid ${T.border}`,color:T.text,textAlign:"center",fontSize:13}}/>
                      <span style={{color:T.dim}}>:</span>
                      <input type="number" min="0" max="20" placeholder="원정" value={ms.ag??""} onChange={e=>handleManualInput(g,"ag",e.target.value)}
                        style={{width:40,padding:"5px",borderRadius:7,background:T.surface,border:`1px solid ${T.border}`,color:T.text,textAlign:"center",fontSize:13}}/>
                      <button onClick={()=>handleManualSave(g)}
                        style={{padding:"5px 10px", borderRadius:7, border:`1px solid ${T.accent}`,
                          background:"transparent", color:T.accent, fontSize:11, fontWeight:700, cursor:"pointer"}}>
                        ✏️ 저장
                      </button>
                    </div>
                  </div>
                );
              }

              return (
                <button key={i} onClick={()=>onSelectMatch(g.home, g.away)}
                  style={{display:"flex", alignItems:"center", width:"100%", background:"transparent", border:"none",
                          borderTop: i>0?`1px solid ${T.border}`:"none", padding:"9px 0", cursor:"pointer", color:T.text, textAlign:"left"}}>
                  <span style={{display:"flex", flexDirection:"column", width:46}}>
                        <span style={{fontSize:11, color:T.muted}}>{g.time}</span>
                        {g.friendly && <span style={{fontSize:8.5, color:T.gold, fontWeight:700}}>친선</span>}
                      </span>
                  <span style={{flex:1, fontSize:13.5, display:"flex", alignItems:"center", justifyContent:"space-between"}}>
                    <span style={{display:"inline-flex",alignItems:"center",gap:5}}><TeamCrest name={g.home}/> {g.home}</span>
                    <span style={{color:T.muted, fontSize:11, margin:"0 6px"}}>vs</span>
                    <span style={{textAlign:"right",display:"inline-flex",alignItems:"center",gap:5,justifyContent:"flex-end"}}>{g.away} <TeamCrest name={g.away}/></span>
                  </span>
                  <span style={{color:T.accent, fontSize:12, marginLeft:8}}>▶</span>
                </button>
              );
            })}
          </Card>
    );
  }
}

function ApiFootballInjuriesPanel({team}) {

  const [loading, setLoading] = useState(false);

  // 2026-07-31 수정: 예전엔 캐시만 불러오고 새로고침을 눌러야 실제로 조회됐는데,
  // ESPN 폴백이 생기면서(키 불필요) 마운트 시 바로 자동조회하도록 바꿈 —
  // fetchApiFootballInjuries 내부에 6시간 쿨다운이 있어서 과호출 걱정 없음.
  useEffect(() => { fetchApiFootballInjuries(false).then(setData); }, []);

  const refresh = async () => {
    setLoading(true);
    try {
      const d = await fetchApiFootballInjuries(true);
      setData(d);
    } finally { setLoading(false); }
  };

  // 2026-07-31 수정: API-Football 키가 없어도 ESPN 폴백으로 동작하니 더 이상
  // 패널 자체를 숨기지 않는다(예전엔 `!RUNTIME_CONFIG.apiFootballKey`면 null 반환).
  const list = data?.byTeam?.[team] || [];
  const lastFetch = data?.lastFetch ? new Date(data.lastFetch) : null;
  const sourceLabel = data?.source || "부상/결장";

  // 2026-08-01 추가: compute_card_suspensions.py가 만든 카드 결장위험 정보.
  // 레드카드(직전경기)는 "결장 확정"급으로, 옐로누적(5장+)은 "정지 위험"
  // 경고로 구분해서 보여준다(정확한 리그별 정지규정은 다를 수 있어서
  // 옐로누적은 확정 아닌 경고 톤 유지 — compute_card_suspensions.py
  // docstring에 명시된 원칙 그대로).
  const cardList = Object.entries(
    (typeof PIPELINE_CARD_SUSPENSIONS !== "undefined" && PIPELINE_CARD_SUSPENSIONS) || {}
  )
    .filter(([, info]) => info.team === team)
    .map(([name, info]) => ({ name, ...info }));

  return (
    <div style={{marginTop:12, paddingTop:10, borderTop:`1px solid ${T.border}`}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6}}>
        <span style={{fontSize:12, fontWeight:700, color:T.text}}>🚑 {sourceLabel} 부상/결장 (자동)</span>
        <button onClick={refresh} disabled={loading}
          style={{padding:"5px 10px", borderRadius:7, border:"none", background:T.cyan, color:"#001018",
            fontWeight:700, fontSize:11, cursor: loading ? "default" : "pointer", opacity: loading ? 0.7 : 1}}>
          {loading ? "⏳ 갱신 중..." : "🔄 갱신"}
        </button>
      </div>
      {cardList.length > 0 && (
        <div style={{display:"flex", flexDirection:"column", gap:4, marginBottom: list.length > 0 ? 8 : 0}}>
          {cardList.map((p, i) => (
            <div key={`card-${i}`} style={{fontSize:12, color: p.red_on_last_match ? T.red : T.gold}}>
              🟨 {p.name}{" "}
              <span style={{color:T.muted}}>
                — {p.red_on_last_match
                  ? "직전 경기 퇴장 (다음 경기 결장 확정)"
                  : `옐로카드 누적 ${p.yellow_total}장 (정지 위험)`}
              </span>
            </div>
          ))}
        </div>
      )}
      {list.length > 0 ? (
        <div style={{display:"flex", flexDirection:"column", gap:4}}>
          {list.map((p, i) => (
            <div key={i} style={{fontSize:12, color:T.red}}>
              {p.name} <span style={{color:T.muted}}>— {p.type === "Suspension" ? "징계" : "부상"}{p.reason ? ` (${p.reason})` : ""}</span>
            </div>
          ))}
        </div>
      ) : (
        <div style={{fontSize:11.5, color:T.muted}}>
          {data?.lastFetch ? "현재 API-Football에 등록된 부상/결장 없음" : "아직 갱신 안 됨 — \"🔄 갱신\" 버튼을 눌러보세요"}
        </div>
      )}
      {lastFetch && (
        <div style={{fontSize:10, color:T.dim, marginTop:6}}>
          마지막 갱신: {lastFetch.toLocaleString("ko-KR")} (4시간마다 자동 업데이트되는 데이터)
        </div>
      )}
    </div>
  );
}

// ============================================================ 선수 개별 통계 페이지
// 경기별로 쌓인 개인 기록(TEAM_GROUP_GAMES/STATIC_MATCH_STATS)을 선수 단위로 집계해
// 시즌 누적 스탯과 공격/수비 기여도를 보여준다.
function PlayerStatsPanel({team}) {
  const [expanded, setExpanded] = useState(null);

  const players = useMemo(() => {
    const raw = aggregateTeamPlayers(team);
    return raw.map(p => {
      const s = playerContribScore(p);
      const totals = p.games.reduce((acc, g) => {
        acc.goals += g.goals; acc.assists += g.assists; acc.shots += g.shots; acc.sot += g.sot;
        acc.xg += g.xg; acc.xa += g.xa; acc.tackles += g.tackles; acc.clr += g.clr;
        return acc;
      }, {goals:0, assists:0, shots:0, sot:0, xg:0, xa:0, tackles:0, clr:0});
      return { name: p.name, pos: p.pos, apps: p.games.length, totals, atk: s.atk, def: s.def };
    }).sort((a,b) => (b.atk+b.def) - (a.atk+a.def));
  }, [team]);

  return (
    <Card style={{marginTop:10}}>
      <SectionTitle sub="경기별 기록을 집계한 시즌 누적 스탯입니다 (선수를 탭하면 상세 보기)">📈 선수 개별 통계</SectionTitle>
      {!players.length ? (
        <div style={{fontSize:12, color:T.muted, textAlign:"center", padding:"10px 0"}}>
          아직 집계된 경기별 개인 기록이 없습니다. 경기가 진행되면 자동으로 채워집니다.
        </div>
      ) : players.map(p => (
        <div key={p.name} style={{borderTop:`1px solid ${T.border}`, padding:"9px 0"}}>
          <div onClick={() => setExpanded(expanded === p.name ? null : p.name)}
            style={{display:"flex", justifyContent:"space-between", alignItems:"center", cursor:"pointer"}}>
            <div>
              <span style={{fontSize:13, fontWeight:700, color:T.text}}>{p.name}</span>
              <span style={{fontSize:10.5, color:T.muted, marginLeft:6}}>{p.pos} · {p.apps}경기</span>
            </div>
            <div style={{fontSize:12, color:T.gold, fontWeight:700}}>
              ⚽{p.totals.goals} · 🅰️{p.totals.assists} <span style={{color:T.dim, marginLeft:4}}>{expanded===p.name?"▲":"▼"}</span>
            </div>
          </div>
          {expanded === p.name && (
            <div style={{marginTop:8, display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:6, fontSize:10.5}}>
              {[
                {label:"xG", val:p.totals.xg.toFixed(2)},
                {label:"xA", val:p.totals.xa.toFixed(2)},
                {label:"슈팅", val:p.totals.shots},
                {label:"유효슈팅", val:p.totals.sot},
                {label:"태클", val:p.totals.tackles},
                {label:"클리어런스", val:p.totals.clr},
                {label:"공격기여도", val:p.atk.toFixed(2)},
                {label:"수비기여도", val:p.def.toFixed(2)},
              ].map(m => (
                <div key={m.label} style={{background:T.surface, borderRadius:7, padding:"6px 4px", textAlign:"center"}}>
                  <div style={{color:T.dim}}>{m.label}</div>
                  <div style={{color:T.text, fontWeight:700, marginTop:2}}>{m.val}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
    </Card>
  );
}
