      {id:"clr",label:"클리어링",src:"stat",key:"clr",unit:"",dec:1},
      {id:"recoveries",label:"볼 회수",src:"stat",key:"recoveries",unit:"",dec:1},
      {id:"aerialWinPct",label:"공중볼 승률",src:"stat",key:"aerialWinPct",unit:"%",dec:1},
    ]},
    gk:      { label:"🧤 골키퍼", metrics:[
      {id:"saves",label:"선방",src:"gk",gkKey:"saves",unit:""},
      {id:"cs",label:"클린시트",src:"gk",gkKey:"cs",unit:""},
      {id:"psxgGA",label:"PSxG-GA",src:"stat",key:"psxgGA",unit:"",dec:2},
    ]},
    etc:     { label:"📋 기타", metrics:[
      // 2026-08-02 수정: 경고/퇴장·자책골·헤더골/페널티골/프리킥골은
      // "20인 개인 랭킹"보다 "지금 보는 두 팀끼리 비교"가 자연스럽다는
      // 피드백 반영 — 예측 화면의 SetPieceCardsCompareCard로 이동함.
      // 출전경기/출전시간은 그대로 둠 — 팀 합계론 의미 없지만(스쿼드
      // 인원 많은 팀이 그냥 유리), 1인 지표로는 스쿼드 내에서 누가
      // 꾸준히 기회를 받는 선수인지(기회창출) 보여줘서 여전히 유효함.
      {id:"appearances",label:"출전경기",src:"leaderboard",lbKey:"appearances",unit:"경기"},
      {id:"minutesPlayed",label:"출전시간",src:"leaderboard",lbKey:"minutesPlayed",unit:"분"},
    ]},
  };

  const activeMetrics = GROUPS[group].metrics;
  const curMetric = activeMetrics.find(m => m.id === metric) || activeMetrics[0];

  // 그룹 변경 시 첫 지표로
  const switchGroup = (g) => { setGroup(g); setMetric(GROUPS[g].metrics[0].id); setShowAll(false); };

  // ── 선수별 세부 스탯 집계 (aggregateTeamPlayers + gameRawScore 기반) ──
  const statLeaders = useMemo(() => {
    const rows = [];
    try {
      for (const team of Object.keys(SQUADS)) {
        const aggr = (typeof aggregateTeamPlayers === "function") ? aggregateTeamPlayers(team) : [];
        for (const p of aggr) {
          if (!p || !Array.isArray(p.games) || !p.games.length) continue;
          const n = p.games.length;
          const avg = (k) => p.games.reduce((a,g)=>a+(g[k]||0),0) / n;
          const sc = (typeof playerContribScore === "function") ? playerContribScore(p) : {atk:0,def:0};
          rows.push({
            name: p.name, pos: p.pos, team, apps: n,
            xg:avg("xg"), xa:avg("xa"), shots:avg("shots"), sot:avg("sot"),
            bigChances:avg("bigChances"), keyPasses:avg("keyPasses"), sca:avg("sca"),
            crossComp:avg("crossComp"), progPass:avg("progPass"),
            tacklesWon:avg("tacklesWon"), interceptions:avg("interceptions"),
            clr:avg("clr"), recoveries:avg("recoveries"), aerialWinPct:avg("aerialWinPct"),
            psxgGA:avg("psxgGA"),
            contrib: (sc.atk||0)*0.7 + (sc.def||0)*0.3,
          });
        }
      }
    } catch(e) {}
    return rows;
  }, [state]);

  // ── 현재 선택 지표의 순위 리스트 ──
  const list = useMemo(() => {
    const LIMIT = showAll ? 999 : 15;
    const m = curMetric;
    if (!m) return [];
    if (m.src === "scorers" || m.src === "assists") {
      const src = m.src === "scorers" ? STATIC_LEADERBOARD.scorers : STATIC_LEADERBOARD.assists;
      return Object.entries(src).map(([k,v])=>{ const [name,team]=k.split("|"); return {name,team,val:v,disp:`${v}${m.unit}`}; })
        .sort((a,b)=>b.val-a.val).slice(0,LIMIT);
    }
    if (m.src === "gk") {
      return Object.entries(STATIC_LEADERBOARD.gk).map(([k,v])=>{ const [name,team]=k.split("|");
        const val = m.gkKey==="saves" ? (v.saves||0) : (v.cs||0);
        return {name,team,val,disp:`${val} · ${v.apps||0}경기`}; })
        .filter(p=>p.val>0).sort((a,b)=>b.val-a.val).slice(0,LIMIT);
    }
    if (m.src === "cards") {
      return Object.entries(STATIC_LEADERBOARD.cards).map(([k,v])=>{ const [name,team]=k.split("|");
        return {name,team,val:(v.red||0)*100+(v.yellow||0),disp:`🟨${v.yellow||0} 🟥${v.red||0}`}; })
        .filter(p=>p.val>0).sort((a,b)=>b.val-a.val).slice(0,LIMIT);
    }
    if (m.src === "ownGoals") {
      return Object.entries(STATIC_LEADERBOARD.ownGoals).map(([k,v])=>{ const [name,team]=k.split("|");
        return {name,team,val:v,disp:`${v}${m.unit}`}; })
        .sort((a,b)=>b.val-a.val).slice(0,LIMIT);
    }
    // 2026-08-01 추가: 헤더골/페널티골/프리킥골/출전경기/출전시간 —
    // scorers/assists와 동일하게 단순 {key:숫자} 구조를 그대로 순위화.
    if (m.src === "leaderboard") {
      const src = STATIC_LEADERBOARD[m.lbKey] || {};
      return Object.entries(src).map(([k,v])=>{ const [name,team]=k.split("|"); return {name,team,val:v,disp:`${v}${m.unit||""}`}; })
        .sort((a,b)=>b.val-a.val).slice(0,LIMIT);
    }
    // 세부 스탯(SQUADS games 기반)
    if (m.src === "stat") {
      return statLeaders.filter(r => typeof r[m.key] === "number" && r[m.key] > 0)
        .map(r => ({ name:r.name, team:r.team, val:r[m.key], disp:`${(r[m.key]).toFixed(m.dec||1)}${m.unit||""}` }))
        .sort((a,b)=>b.val-a.val).slice(0,LIMIT);
    }
    return [];
  }, [state, curMetric, statLeaders, showAll]);

  // ── 상단 요약카드: 득점왕/도움왕/클린시트/평점 1위 ──
  const summary = useMemo(() => {
    const top = (src, key) => {
      const entries = Object.entries(src||{});
      if (!entries.length) return null;
      const sorted = entries.map(([k,v])=>({k, v: typeof v==="object"?(v[key]||0):v}))
        .sort((a,b)=>b.v-a.v);
      if (!sorted[0] || !sorted[0].v) return null;
      const [name,team] = sorted[0].k.split("|");
      return { name, team, v: sorted[0].v };
    };
    const scorer = top(STATIC_LEADERBOARD.scorers);
    const assist = top(STATIC_LEADERBOARD.assists);
    const cs = top(STATIC_LEADERBOARD.gk, "cs");
    // 평점: 개인 기여도(contrib) 최고
    let rating = null;
    if (statLeaders.length) {
      const r = [...statLeaders].sort((a,b)=>(b.contrib||0)-(a.contrib||0))[0];
      if (r && r.contrib) rating = { name:r.name, team:r.team, v:(r.contrib).toFixed(1) };
    }
    return { scorer, assist, cs, rating };
  }, [state, statLeaders]);

  const handleManualAdd = async () => {
    const name = mName.trim();
    if (!name || !state) return;
    const key = `${name}|${mTeam}`;
    const s = JSON.parse(JSON.stringify(state));
    const m = curMetric;
    if (m.src === "gk") {
      if (!s.gk) s.gk = {};
      const cur = s.gk[key] || { apps:0, cs:0, saves:0, conceded:0 };
      s.gk[key] = { ...cur, saves:(cur.saves||0)+(parseInt(mVal1)||0), apps:(cur.apps||0)+(parseInt(mVal2)||0) };
    } else if (m.src === "cards") {
      if (!s.cards) s.cards = {};
      const cur = s.cards[key] || { yellow:0, red:0 };
      s.cards[key] = { yellow:cur.yellow+(parseInt(mVal1)||0), red:cur.red+(parseInt(mVal2)||0) };
    } else if (m.src === "ownGoals") {
      if (!s.ownGoals) s.ownGoals = {};
      s.ownGoals[key] = (s.ownGoals[key]||0)+(parseInt(mVal1)||1);
    } else if (m.src === "scorers" || m.src === "assists") {
      const tgt = m.src;
      if (!s[tgt]) s[tgt] = {};
      s[tgt][key] = (s[tgt][key]||0)+(parseInt(mVal1)||1);
    } else { return; } // stat 계열은 수동추가 미지원
    await saveLeaderboardState(s);
    setState(s); setMName("");
  };

  const manualSupported = ["scorers","assists","gk","cards","ownGoals"].includes(curMetric?.src);

  const SummaryCard = ({emoji, title, data, unit}) => (
    <div style={{flex:1, minWidth:0, background:T.card, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 8px", textAlign:"center"}}>
      <div style={{fontSize:11, color:T.muted, marginBottom:4}}>{emoji} {title}</div>
      {data ? (<>
        <div style={{fontSize:13, fontWeight:800, color:T.text, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{data.name}</div>
        <div style={{fontSize:10, color:T.dim, marginTop:1, display:"flex", alignItems:"center", justifyContent:"center", gap:3}}>
          <TeamCrest name={data.team} size={12}/> {data.v}{unit||""}
        </div>
      </>) : (<div style={{fontSize:11, color:T.dim, padding:"6px 0"}}>-</div>)}
    </div>
  );

  return (
    <div>
      {/* 상단 요약 카드 4개 */}
      <div style={{display:"flex", gap:6, marginBottom:12}}>
        <SummaryCard emoji="🏆" title="득점왕" data={summary.scorer} unit="골"/>
        <SummaryCard emoji="👟" title="도움왕" data={summary.assist} unit="도움"/>
        <SummaryCard emoji="🧤" title="클린시트" data={summary.cs} unit="회"/>
        <SummaryCard emoji="⭐" title="평점" data={summary.rating} unit=""/>
      </div>

      {/* 그룹 탭 */}
      <div style={{display:"flex", gap:5, marginBottom:8, overflowX:"auto"}}>
        {Object.entries(GROUPS).map(([g,info]) => (
          <button key={g} onClick={()=>switchGroup(g)}
            style={{flex:"1 0 auto", padding:"9px 10px", borderRadius:8, border:"none", cursor:"pointer",
              fontSize:12.5, fontWeight:700, whiteSpace:"nowrap",
              background: group===g ? T.accent : T.surface, color: group===g ? "#fff" : T.muted}}>
            {info.label}
          </button>
        ))}
      </div>

      {/* 지표 칩 */}
      <div style={{display:"flex", gap:5, marginBottom:10, flexWrap:"wrap"}}>
        {activeMetrics.map(m => (
          <button key={m.id} onClick={()=>{setMetric(m.id); setShowAll(false);}}
            style={{padding:"6px 11px", borderRadius:16, border:`1px solid ${metric===m.id?T.accent:T.border}`, cursor:"pointer",
              fontSize:11.5, fontWeight:600, background: metric===m.id ? "rgba(41,121,255,0.12)" : "transparent",
              color: metric===m.id ? T.accent : T.muted}}>
            {m.label}
          </button>
        ))}
      </div>

      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
        <span style={{fontSize:11, color:T.muted}}>{GROUPS[group].label} · {curMetric?.label}</span>
        <button onClick={refresh} disabled={loading}
          style={{padding:"7px 14px", borderRadius:8, border:"none", background:T.cyan, color:"#001018",
            fontWeight:700, fontSize:12, cursor: loading?"default":"pointer", opacity: loading?0.7:1}}>
          {loading ? "⏳ 갱신 중..." : "🔄 경기결과 반영"}
        </button>
      </div>

      {list.length === 0 ? (
        <Card>
          <div style={{fontSize:12.5, color:T.muted, textAlign:"center", padding:"10px 0"}}>
            {curMetric?.src === "stat"
              ? "선수 경기별 세부 스탯이 아직 없습니다 — 파이프라인 데이터를 연동하거나 스쿼드에 선수 기록을 넣으면 여기에 순위가 표시됩니다."
              : "데이터 없음 — 위 \"경기결과 반영\" 버튼을 누르거나, 아래 \"수동 추가\"로 입력하세요."}
          </div>
        </Card>
      ) : (
        <Card style={{padding:"6px 10px"}}>
          {list.map((p,i) => {
            const pid = `${p.name}|${p.team}`;
            const radarData = statLeaders.find(r => r.name===p.name && r.team===p.team);
            const canRadar = !!radarData;
            const isOpen = openPlayer === pid;
            return (
            <div key={i} style={{borderBottom: i<list.length-1 ? `1px solid ${T.border}` : "none"}}>
              <div style={{display:"flex", alignItems:"center", gap:8, padding:"7px 4px", fontSize:12.5,
                cursor: canRadar?"pointer":"default"}}
                onClick={()=>{ if(canRadar) setOpenPlayer(isOpen?null:pid); }}>
                <span style={{color: i<3?T.accent:T.muted, width:20, textAlign:"right", fontWeight: i<3?800:400}}>{i+1}</span>
                <TeamCrest name={p.team} size={16}/>
                <span style={{flex:1, color:T.text}}>{p.name} <span style={{color:T.dim, fontSize:11}}>({p.team})</span>
                  {canRadar && <span style={{color:T.dim, fontSize:10, marginLeft:4}}>{isOpen?"▲":"▼"}</span>}
                </span>
                <b style={{color:T.accent, whiteSpace:"nowrap"}}>{p.disp}</b>
                {manualSupported && (
                  <button onClick={async (e)=>{ e.stopPropagation(); if(!state)return; const key=`${p.name}|${p.team}`;
                    const s=JSON.parse(JSON.stringify(state)); const tgt=curMetric.src;
                    if(s[tgt]) delete s[tgt][key]; await saveLeaderboardState(s); setState(s); }}
                    style={{background:"none", border:"none", color:T.dim, fontSize:14, padding:"0 2px", cursor:"pointer", lineHeight:1}}>✕</button>
                )}
              </div>
              {isOpen && radarData && (
                <div style={{background:T.surface, borderRadius:8, margin:"2px 0 8px", padding:"6px"}}>
                  <div style={{fontSize:11, color:T.muted, textAlign:"center", marginBottom:2}}>
                    {p.name} · 경기당 평균 능력치 ({radarData.apps}경기)
                  </div>
                  <PlayerRadar player={radarData}/>
                </div>
              )}
            </div>
          );})}
        </Card>
      )}

      {!loading && list.length >= 15 && (
        <button onClick={()=>setShowAll(v=>!v)} style={{width:"100%", marginTop:8, padding:"8px", borderRadius:8,
          border:"none", background:"transparent", color:T.accent, fontSize:12, fontWeight:700, cursor:"pointer"}}>
          {showAll ? "▲ 접기" : "▼ 전체 보기"}
        </button>
      )}

      {/* 수동 추가 (기록형 지표만) */}
      {manualSupported && (
        <div style={{marginTop:12}}>
          <button onClick={()=>setShowManual(v=>!v)}
            style={{width:"100%", padding:"9px", borderRadius:8, border:`1px solid ${T.border}`, background:"none",
              color:T.muted, fontSize:12.5, fontWeight:700, cursor:"pointer"}}>
            {showManual ? "▲ 수동 추가 닫기" : "✏️ 선수 기록 수동 추가"}
          </button>
          {showManual && (
            <Card style={{marginTop:8}}>
              <div style={{display:"flex", gap:6, marginBottom:6}}>
                <input value={mName} onChange={e=>setMName(e.target.value)} placeholder="선수명"
                  style={{flex:1, minWidth:0, padding:"8px 10px", borderRadius:8, border:`1px solid ${T.border}`, background:T.bg, color:T.text, fontSize:12.5}}/>
                <select value={mTeam} onChange={e=>setMTeam(e.target.value)}
                  style={{padding:"8px 6px", borderRadius:8, border:`1px solid ${T.border}`, background:T.bg, color:T.text, fontSize:12.5, maxWidth:120}}>
                  {ALL_TEAMS.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div style={{display:"flex", gap:6}}>
                <input type="number" value={mVal1} onChange={e=>setMVal1(e.target.value)}
                  placeholder={curMetric.src==="gk"?"선방":curMetric.src==="cards"?"옐로":curMetric.label}
                  style={{flex:1, minWidth:0, padding:"8px 10px", borderRadius:8, border:`1px solid ${T.border}`, background:T.bg, color:T.text, fontSize:12.5}}/>
                {(curMetric.src==="gk"||curMetric.src==="cards") && (
                  <input type="number" value={mVal2} onChange={e=>setMVal2(e.target.value)}
                    placeholder={curMetric.src==="gk"?"출전수":"레드"}
                    style={{flex:1, minWidth:0, padding:"8px 10px", borderRadius:8, border:`1px solid ${T.border}`, background:T.bg, color:T.text, fontSize:12.5}}/>
                )}
                <button onClick={handleManualAdd}
                  style={{padding:"8px 14px", borderRadius:8, border:"none", background:T.cyan, color:"#001018", fontWeight:700, fontSize:12.5, cursor:"pointer", whiteSpace:"nowrap"}}>추가</button>
              </div>
            </Card>
          )}
        </div>
      )}
    </div>
  );
}

function RankingTab({eloVersion}) {
  const [sortKey, setSortKey] = useState("spi");
  const [view, setView] = useState("standings"); // "standings" | "ratings"

  const rows = useMemo(() => {
    const list = ALL_TEAMS.map(team => ({
      team,
      spi: SPI_RATINGS[team]?.spi ?? 0,
      opta: OPTA_RANKINGS[team]?.powerScore ?? 0,
      optaRank: OPTA_RANKINGS[team]?.rank ?? 999,
      elo: compositeElo(team),
    }));
    const dir = sortKey === "optaRank" ? 1 : -1;
    return [...list].sort((a,b) => (a[sortKey]-b[sortKey]) * dir);
  }, [sortKey, eloVersion]);

  const Header = ({k, children, w}) => (
    <th onClick={()=>setSortKey(k)} style={{padding:"8px 4px", fontSize:11, color: sortKey===k ? T.accent : T.muted,
        cursor:"pointer", textAlign: w==="left" ? "left" : "right", whiteSpace:"nowrap"}}>
      {children}{sortKey===k ? " ▾" : ""}
    </th>
  );

  return (
    <div>
      {/* 뷰 전환 */}
      <div style={{display:"flex", gap:8, marginBottom:10}}>
        {[{id:"standings",label:"🏆 리그 순위"},{id:"ratings",label:"📈 레이팅 비교"},{id:"leaderboard",label:"⚽ 시즌 기록"}].map(v => (
          <button key={v.id} onClick={()=>setView(v.id)}
            style={{flex:1, padding:"10px", borderRadius:10, border:"none", cursor:"pointer",
              fontSize:13, fontWeight:700,
              background: view===v.id ? T.accent : T.surface,
              color: view===v.id ? "#fff" : T.muted}}>
            {v.label}
          </button>
        ))}
      </div>

      {view === "standings" ? (
        <>
          <Card style={{marginBottom:10}}>
            <div style={{fontSize:12, color:T.muted, lineHeight:1.6}}>
              실제 경기 결과 기반 리그 순위입니다. 일정 탭에서 결과를 입력하거나 자동 조회하면 반영됩니다.
              <span style={{color:T.accent, fontWeight:700}}> 파란색 배경</span>은 상위 4위(챔피언스리그권).
            </div>
          </Card>
          <GroupStandingsPanel eloVersion={eloVersion}/>
        </>
      ) : view === "leaderboard" ? (
        <LeaderboardView/>
      ) : (
        <>
          <Card>
            <div style={{fontSize:12.5, color:T.muted, lineHeight:1.6}}>
              SPI(FiveThirtyEight식), Opta 파워랭킹, 자체 하이브리드 ELO를 비교합니다. 열 제목을 탭하면 정렬됩니다.
            </div>
          </Card>
          <Card style={{marginTop:10, padding:0, overflow:"hidden"}}>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%", borderCollapse:"collapse", fontSize:12.5}}>
                <thead>
                  <tr style={{borderBottom:`1px solid ${T.border}`}}>
                    <th style={{padding:"8px 4px", fontSize:11, color:T.muted, textAlign:"left"}}>#</th>
                    <Header k="spi" w="left">구단</Header>
                    <Header k="spi">SPI</Header>
                    <Header k="elo">ELO</Header>
                    <Header k="opta">Opta파워</Header>
                    <Header k="optaRank">Opta순위</Header>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r,i) => (
                    <tr key={r.team} style={{borderBottom:`1px solid ${T.border}`}}>
                      <td style={{padding:"7px 4px", color:T.muted}}>{i+1}</td>
                      <td style={{padding:"7px 4px", whiteSpace:"nowrap"}}><TeamCrest name={r.team}/> {r.team}</td>
                      <td style={{padding:"7px 4px", textAlign:"right", color:T.gold, fontWeight:700}}>{r.spi.toFixed(1)}</td>
                      <td style={{padding:"7px 4px", textAlign:"right", color:T.cyan, fontWeight:700}}>{Math.round(r.elo)}</td>
                      <td style={{padding:"7px 4px", textAlign:"right"}}>{r.opta.toFixed(1)}</td>
                      <td style={{padding:"7px 4px", textAlign:"right", color:T.muted}}>{r.optaRank}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        </>
      )}
    </div>
  );
}

function HistoryEntry({entry, onSettle, onDelete}) {
  const [hg, setHg] = useState("");
  const [ag, setAg] = useState("");

  const predicted = entry.homeWinProb > entry.awayWinProb
    ? (entry.homeWinProb > entry.drawProb ? "home" : "draw")
    : (entry.awayWinProb > entry.drawProb ? "away" : "draw");

  let actualOutcome = null;
  if (entry.settled) {
    if (entry.actualHome > entry.actualAway) actualOutcome = "home";
    else if (entry.actualHome < entry.actualAway) actualOutcome = "away";
    else actualOutcome = "draw";
  }
  const dirHit = entry.settled && actualOutcome === predicted;
  const [predH, predA] = entry.topScore ? entry.topScore.split("-").map(Number) : [null, null];
  const exactHit = entry.settled && predH===entry.actualHome && predA===entry.actualAway;
  const hitBadge = !entry.settled ? null
    : exactHit ? {label:"✅ 스코어 정확 적중!", color:T.green, bg:"rgba(0,255,128,0.13)"}
    : dirHit   ? {label:"🔵 방향 적중 (승/무/패)", color:T.cyan, bg:"rgba(0,200,255,0.13)"}
    :             {label:"❌ 미적중", color:T.red, bg:"rgba(255,80,80,0.11)"};

  return (
    <Card style={{marginTop:10}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <div style={{fontSize:13.5, fontWeight:700}}>
          <TeamCrest name={entry.home}/> {entry.home} <span style={{color:T.muted, fontWeight:400}}>vs</span> {entry.away} <TeamCrest name={entry.away}/>
        </div>
        <button onClick={()=>onDelete(entry.id)} style={{background:"transparent", border:"none", color:T.muted, fontSize:16, cursor:"pointer"}}>✕</button>
      </div>
      <div style={{fontSize:11.5, color:T.muted, marginTop:4}}>
        예측: 홈 {pct(entry.homeWinProb)} · 무 {pct(entry.drawProb)} · 원정 {pct(entry.awayWinProb)} · 최다 스코어 {entry.topScore}
      </div>

      {!entry.settled ? (
        <div>
          <div style={{display:"flex", alignItems:"center", gap:8, marginTop:10}}>
            <span style={{fontSize:12, color:T.muted}}>실제 결과</span>
            <input type="number" min="0" value={hg} onChange={e=>setHg(e.target.value)}
              style={{width:46, padding:"6px", borderRadius:7, background:T.surface, border:`1px solid ${T.border}`, color:T.text, textAlign:"center"}}/>
            <span style={{color:T.muted}}>:</span>
            <input type="number" min="0" value={ag} onChange={e=>setAg(e.target.value)}
              style={{width:46, padding:"6px", borderRadius:7, background:T.surface, border:`1px solid ${T.border}`, color:T.text, textAlign:"center"}}/>
            <button onClick={()=>{
                if (hg==="" || ag==="") return;
                onSettle(entry.id, Number(hg), Number(ag));
              }}
              style={{flex:1, padding:"7px", borderRadius:8, border:"none", background:T.accent, color:"#fff", fontSize:12.5, fontWeight:700, cursor:"pointer"}}>
              결과 입력 (ELO 갱신)
            </button>
          </div>
          <div style={{fontSize:11, color:T.dim, marginTop:6}}>💡 경기 종료 후 실제 스코어를 위에 직접 입력하면 동적 ELO에 반영됩니다.</div>
        </div>
      ) : (
        <div style={{marginTop:10, padding:"10px 12px", borderRadius:8, background:T.surface,
                      border:`1px solid ${hitBadge?.color}55`}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
            <span style={{fontSize:15, fontWeight:900, color:T.text, letterSpacing:1}}>
              실제 <span style={{color:hitBadge?.color||T.text}}>{entry.actualHome}</span>
              <span style={{color:T.muted, margin:"0 4px"}}>:</span>
              <span style={{color:hitBadge?.color||T.text}}>{entry.actualAway}</span>
              {entry.topScore && <span style={{fontSize:11, color:"#8aa0c0", fontWeight:400, marginLeft:10}}>예측 {entry.topScore}</span>}
            </span>
            <span style={{fontSize:12, fontWeight:800, color:hitBadge?.color,
                          background:hitBadge?.bg, borderRadius:7, padding:"4px 10px",
                          border:`1px solid ${hitBadge?.color}44`}}>
              {hitBadge?.label}
            </span>
          </div>
        </div>
      )}
    </Card>
  );
}

function BackupRestorePanel() {
  const [exportText, setExportText] = useState("");
  const [importText, setImportText] = useState("");
  const [status, setStatus] = useState("");
  const exportRef = useRef(null);

  const copyText = async (text) => {
    if (!text) return false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) {}
    try {
      const ta = exportRef.current;
      if (ta) {
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        if (document.execCommand("copy")) return true;
      }
    } catch (e) {}
    try {
      const tmp = document.createElement("textarea");
      tmp.value = text;
      tmp.style.position = "fixed";
      tmp.style.top = "0";
      tmp.style.left = "0";
      tmp.style.opacity = "0";
      document.body.appendChild(tmp);
      tmp.focus();
      tmp.select();
      tmp.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(tmp);
      if (ok) return true;
    } catch (e) {}
    return false;
  };

  const handleCopy = async () => {
    const text = exportText || JSON.stringify(collect());
    if (!text || text === "{}") { setStatus("복사할 데이터가 없습니다. 먼저 '내보내기'를 누르세요."); return; }
    if (!exportText) setExportText(text);
    const ok = await copyText(text);
    if (ok) {
      setStatus("✅ 클립보드에 복사됐습니다! 새 파일의 복원칸에 붙여넣으세요.");
    } else {
      try { if (exportRef.current) { exportRef.current.focus(); exportRef.current.select(); } } catch(e){}
      setStatus("⚠️ 자동 복사가 차단됐습니다. 아래 박스를 길게 눌러 '전체 선택 → 복사'하거나, '파일로 다운로드'를 이용하세요.");
    }
  };

  const collect = () => {
    const data = {};
    for (let i=0; i<localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith("user:wc:") || k.startsWith("user:config:") || k.startsWith("shared:wc:"))) {
        data[k] = localStorage.getItem(k);
      }
    }
    return data;
  };

  const handleExport = async () => {
    const data = collect();
    const n = Object.keys(data).length;
    if (n === 0) { setStatus("내보낼 데이터가 없습니다 (저장된 항목 0개)."); setExportText(""); return; }
    const text = JSON.stringify(data);
    setExportText(text);
    const ok = await copyText(text);
    if (ok) {
      setStatus(`✅ ${n}개 항목을 내보내고 클립보드에 복사했습니다! 새 파일의 복원칸에 붙여넣으세요.`);
    } else {
      setStatus(`✅ ${n}개 항목을 아래 텍스트로 내보냈습니다. '📋 복사' 버튼을 누르거나, 박스를 길게 눌러 복사하거나, '파일로 다운로드'를 이용하세요.`);
    }
  };

  const handleDownload = () => {
    const text = exportText || JSON.stringify(collect());
    if (!text || text === "{}") { setStatus("내보낼 데이터가 없습니다."); return; }
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `wc26_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };

  const handleImport = () => {
    try {
      const data = JSON.parse(importText.trim());
      let count = 0;
      for (const [k, v] of Object.entries(data)) {
        if (typeof k === "string" && (k.startsWith("user:wc:") || k.startsWith("user:config:") || k.startsWith("shared:wc:"))) {
          localStorage.setItem(k, v);
          count++;
        }
      }
      setStatus(`✅ ${count}개 항목 복원 완료! 아래 "새로고침" 버튼을 눌러 적용하세요.`);
    } catch (e) {
      setStatus("❌ 형식 오류 — 내보내기로 받은 JSON 텍스트를 그대로 붙여넣어주세요.");
    }
  };

  return (
    <Card style={{marginTop:10}}>
      <SectionTitle sub="파일을 새로 받을 때마다 예측기록·부상메모·시즌기록 등이 사라진다면, 새 파일을 열기 전 여기서 내보내고 새 파일에서 가져오세요">
        💾 데이터 백업 / 복원
      </SectionTitle>
      <div style={{fontSize:11.5, color:T.muted, lineHeight:1.6, marginBottom:10}}>
        예측기록, 부상 메모, 시즌 기록(득점/카드 등), 동적 ELO, API 설정이 모두 포함됩니다.
        API 키도 포함되니 백업 파일은 다른 사람에게 공유하지 마세요.
      </div>
      <div style={{display:"flex", gap:6, marginBottom:8}}>
        <button onClick={handleExport}
          style={{flex:1, padding:"9px", borderRadius:8, border:"none", background:T.cyan, color:"#001018", fontWeight:700, fontSize:12.5, cursor:"pointer"}}>
          📤 내보내기
        </button>
        <button onClick={handleDownload}
          style={{flex:1, padding:"9px", borderRadius:8, border:`1px solid ${T.border}`, background:"transparent", color:T.text, fontWeight:700, fontSize:12.5, cursor:"pointer"}}>
          📥 파일로 다운로드
        </button>
      </div>
      {exportText && (
        <>
          <textarea ref={exportRef} readOnly value={exportText} onClick={e=>e.target.select()}
            style={{width:"100%", height:90, marginBottom:6, padding:8, borderRadius:8, border:`1px solid ${T.border}`,
              background:T.bg, color:T.text, fontSize:10.5, fontFamily:"monospace", resize:"vertical"}}/>
          <button onClick={handleCopy}
            style={{width:"100%", padding:"9px", borderRadius:8, border:"none", background:T.accent, color:"#fff", fontWeight:700, fontSize:12.5, cursor:"pointer", marginBottom:10}}>
            📋 복사
          </button>
        </>
      )}

      <div style={{fontSize:11.5, color:T.muted, marginBottom:6, marginTop:6}}>
        새 파일에서 복원하려면 위에서 받은 텍스트(또는 다운로드한 파일 내용)를 아래에 붙여넣으세요.
      </div>
      <textarea value={importText} onChange={e=>setImportText(e.target.value)} placeholder='내보낸 JSON 텍스트를 여기에 붙여넣기'
        style={{width:"100%", height:90, marginBottom:8, padding:8, borderRadius:8, border:`1px solid ${T.border}`,
          background:T.bg, color:T.text, fontSize:10.5, fontFamily:"monospace", resize:"vertical"}}/>
      <div style={{display:"flex", gap:6}}>
        <button onClick={handleImport}
          style={{flex:1, padding:"9px", borderRadius:8, border:"none", background:T.green, color:"#001018", fontWeight:700, fontSize:12.5, cursor:"pointer"}}>
          📋 복원하기
        </button>
        <button onClick={()=>window.location.reload()}
          style={{flex:1, padding:"9px", borderRadius:8, border:`1px solid ${T.border}`, background:"transparent", color:T.text, fontWeight:700, fontSize:12.5, cursor:"pointer"}}>
          🔄 새로고침
        </button>
      </div>

      {status && <div style={{fontSize:11.5, color:T.gold, marginTop:8, lineHeight:1.5}}>{status}</div>}
    </Card>
  );
}

// ============================================================ 예측 정확도 분석 (브라이어 스코어 · 캘리브레이션)
// 정산 완료된 예측들을 모아 모델의 확률 예측이 실제로 얼마나 잘 맞는지 정량화한다.
// 브라이어 스코어: 0(완벽)~2(최악), 3지선다(홈/무/원정) 기준.
// 캘리브레이션: "70% 확률"이라고 말한 예측들이 실제로 70% 근처로 맞았는지 신뢰구간별로 확인.
function computeAccuracyMetrics(entries) {
  const valid = (entries || []).filter(h => h && h.settled
    && h.actualHome != null && h.actualAway != null
    && typeof h.homeWinProb === "number" && typeof h.drawProb === "number" && typeof h.awayWinProb === "number");
  if (!valid.length) return null;

  let brierSum = 0;
  let dirHits = 0, exactHits = 0;
  const buckets = Array.from({length:10}, () => ({count:0, hits:0, confSum:0}));

  for (const h of valid) {
    const actual = h.actualHome > h.actualAway ? "home" : (h.actualHome < h.actualAway ? "away" : "draw");
    const oh = actual === "home" ? 1 : 0, od = actual === "draw" ? 1 : 0, oa = actual === "away" ? 1 : 0;
    const ph = h.homeWinProb, pd = h.drawProb, pa = h.awayWinProb;
    brierSum += (ph-oh)*(ph-oh) + (pd-od)*(pd-od) + (pa-oa)*(pa-oa);

    const predicted = (ph >= pd && ph >= pa) ? "home" : ((pa >= pd && pa >= ph) ? "away" : "draw");
    const confidence = Math.max(ph, pd, pa);
    if (predicted === actual) dirHits++;

    const [predH, predA] = h.topScore ? h.topScore.split("-").map(Number) : [null, null];
    if (predH === h.actualHome && predA === h.actualAway) exactHits++;

    const bIdx = Math.min(9, Math.max(0, Math.floor(confidence*10)));
    buckets[bIdx].count++;
    buckets[bIdx].confSum += confidence;
    if (predicted === actual) buckets[bIdx].hits++;
  }

  return {
    n: valid.length,
    brierScore: brierSum / valid.length,
    dirHitRate: dirHits / valid.length,
    exactHitRate: exactHits / valid.length,
    buckets: buckets.map((b, i) => ({
      range: `${i*10}–${(i+1)*10}%`,
      count: b.count,
      avgConfidence: b.count ? b.confSum / b.count : null,
      actualHitRate: b.count ? b.hits / b.count : null,
    })).filter(b => b.count > 0),
  };
}

// ============================================================ 모델 vs 시장배당 괴리 추적
// 정산된 예측 중 시장배당(marketProbs)이 함께 저장된 건들을 모아, 내 모델이 시장 대비
// 체계적으로 낙관적/비관적인 편향이 있는지, 그리고 어느 쪽이 더 정확했는지 비교한다.
function computeModelVsMarketBias(entries) {
  const valid = (entries || []).filter(h => h && h.settled
    && h.actualHome != null && h.actualAway != null
    && h.marketProbs && typeof h.marketProbs.home === "number"
    && typeof h.homeWinProb === "number");
  if (!valid.length) return null;

  let biasSum = 0, modelBrierSum = 0, marketBrierSum = 0, modelCloser = 0;
  for (const h of valid) {
    const actual = h.actualHome > h.actualAway ? "home" : (h.actualHome < h.actualAway ? "away" : "draw");
    const oh = actual==="home"?1:0, od = actual==="draw"?1:0, oa = actual==="away"?1:0;
    biasSum += (h.homeWinProb - h.marketProbs.home);
    const mBrier = (h.homeWinProb-oh)**2 + (h.drawProb-od)**2 + (h.awayWinProb-oa)**2;
    const mkBrier = (h.marketProbs.home-oh)**2 + (h.marketProbs.draw-od)**2 + (h.marketProbs.away-oa)**2;
    modelBrierSum += mBrier; marketBrierSum += mkBrier;
    if (mBrier < mkBrier) modelCloser++;
  }
  return {
    n: valid.length,
    avgBias: biasSum / valid.length, // 양수면 모델이 시장보다 홈 승리를 더 낙관적으로 봄
    modelBrier: modelBrierSum / valid.length,
    marketBrier: marketBrierSum / valid.length,
    modelCloserRate: modelCloser / valid.length,
  };
}

function ModelVsMarketPanel({liveHistory}) {
  const merged = useMemo(() => {
    const fromBackup = (typeof BACKUP_SEED !== "undefined" && Array.isArray(BACKUP_SEED.history)) ? BACKUP_SEED.history : [];
    return [...(liveHistory||[]), ...fromBackup];
  }, [liveHistory]);
  const bias = useMemo(() => computeModelVsMarketBias(merged), [merged]);

  if (!bias || bias.n < 5) {
    return (
      <Card style={{marginTop:10}}>
        <SectionTitle sub="시장배당과 함께 정산된 예측이 5건 이상 쌓이면 모델의 편향을 추적해 보여드립니다">📐 모델 vs 시장배당 괴리</SectionTitle>
        <div style={{fontSize:11.5, color:T.muted, textAlign:"center"}}>아직 데이터가 충분하지 않습니다{bias ? ` (현재 ${bias.n}건)` : ""}.</div>

  const biasPct = bias.avgBias * 100;

  const biasColor = Math.abs(biasPct) < 1.5 ? T.green : T.gold;

  return (
    <Card style={{marginTop:10}}>
      <SectionTitle sub={`정산 ${bias.n}건 기준 · 내 모델의 홈 승률 예측이 시장 대비 평균적으로 얼마나 다른지`}>📐 모델 vs 시장배당 괴리</SectionTitle>

          <div style={{fontSize:18, fontWeight:900, color:biasColor}}>{biasPct>=0?"+":""}{biasPct.toFixed(1)}%p</div>
          <div style={{fontSize:10, color:T.muted, marginTop:2}}>평균 편향(모델−시장)</div>
          <div style={{fontSize:9.5, color:biasColor, marginTop:2, fontWeight:700}}>{biasLabel}</div>
        </div>
        <div style={{background:T.surface, borderRadius:9, padding:"10px 8px", border:`1px solid ${T.border}`, textAlign:"center"}}>
          <div style={{fontSize:18, fontWeight:900, color: bias.modelCloserRate>0.5 ? T.green : T.red}}>{pct(bias.modelCloserRate)}</div>
          <div style={{fontSize:10, color:T.muted, marginTop:2}}>모델이 시장보다 정확했던 비율</div>
          <div style={{fontSize:9.5, color:T.dim, marginTop:2}}>모델 브라이어 {bias.modelBrier.toFixed(3)} · 시장 {bias.marketBrier.toFixed(3)}</div>
        </div>
      </div>
    </Card>
  );
}

function HistoryTab({history, onSettle, onDelete, onClear, onResetElo}) {
  const settled = history.filter(h=>h.settled);
  const hits = settled.filter(h => {
    const predicted = h.homeWinProb > h.awayWinProb ? (h.homeWinProb > h.drawProb ? "home":"draw") : (h.awayWinProb > h.drawProb ? "away":"draw");
    const actual = h.actualHome > h.actualAway ? "home" : (h.actualHome < h.actualAway ? "away" : "draw");
    return predicted === actual;
  }).length;

  const exactHits = settled.filter(h => {
    const [ph, pa] = h.topScore ? h.topScore.split("-").map(Number) : [null, null];
    return ph===h.actualHome && pa===h.actualAway;
  }).length;
  const dirOnly = hits - exactHits;
  const misses = settled.length - hits;

  return (
    <div>
      <Card>
        <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:6, textAlign:"center"}}>
          <div>
            <div style={{fontSize:18, fontWeight:800}}>{history.length}</div>
            <div style={{fontSize:10, color:T.muted}}>저장</div>
          </div>
          <div>
            <div style={{fontSize:18, fontWeight:800, color:T.green}}>
              {exactHits}
            </div>
            <div style={{fontSize:10, color:T.muted}}>✅ 스코어 적중</div>
          </div>
          <div>
            <div style={{fontSize:18, fontWeight:800, color:T.cyan}}>
              {dirOnly}
            </div>
            <div style={{fontSize:10, color:T.muted}}>🔵 방향 적중</div>
          </div>
          <div>
            <div style={{fontSize:18, fontWeight:800, color:T.red}}>
              {misses}
            </div>
            <div style={{fontSize:10, color:T.muted}}>❌ 미적중</div>
          </div>
        </div>
        {settled.length > 0 && (
          <div style={{marginTop:8, padding:"6px 0", borderTop:`1px solid ${T.border}`, textAlign:"center"}}>
            <span style={{fontSize:11, color:T.muted}}>방향 적중률 </span>
            <span style={{fontSize:14, fontWeight:800, color:T.accent}}>{pct(hits/settled.length)}</span>
            <span style={{fontSize:11, color:T.muted, marginLeft:10}}>스코어 정확도 </span>
            <span style={{fontSize:14, fontWeight:800, color:T.green}}>{pct(exactHits/settled.length)}</span>
          </div>
        )}
      </Card>

      <AccuracyPanel liveHistory={history}/>
      <ModelVsMarketPanel liveHistory={history}/>

      <BackupRestorePanel/>

      {/* 📊 EPL 예측 적중 기록 — history에서 자동 생성 (수동 목록 X) */}
      {(() => {
        // history 전체(정산 완료분)를 읽어 적중/방향/미적중 자동 판정
        const hist = (typeof BACKUP_SEED !== "undefined" && Array.isArray(BACKUP_SEED.history)) ? BACKUP_SEED.history : [];
        const dirOf = (h,a) => h>a ? "H" : (h<a ? "A" : "D");
        const ALL_MATCHES = hist
          .filter(h => h.settled && h.actualHome!=null && h.actualAway!=null)
          .map(h => {
            const ts = (h.topScore||"").split("-");
            const ph = parseInt(ts[0]), pa = parseInt(ts[1]);
            const hasPred = !isNaN(ph) && !isNaN(pa);
            // 예측 방향: topScore 우선, 없으면 승률로
            let predDir;
            if (hasPred) predDir = dirOf(ph,pa);
            else predDir = (h.homeWinProb>=h.drawProb && h.homeWinProb>=h.awayWinProb) ? "H"
                         : (h.awayWinProb>=h.homeWinProb && h.awayWinProb>=h.drawProb) ? "A" : "D";
            const actDir = dirOf(h.actualHome, h.actualAway);
            let type;
            if (hasPred && ph===h.actualHome && pa===h.actualAway) type = "exact";
            else if (predDir===actDir) type = "dir";
            else type = "miss";
            const dLabel = d => d==="H"?"홈":d==="A"?"원":"무";
            const predStr = hasPred ? (type==="miss" ? `${ph}-${pa}(${dLabel(predDir)})` : `${ph}-${pa}`) : `(${dLabel(predDir)})`;
            const realStr = type==="miss" ? `${h.actualHome}-${h.actualAway}(${dLabel(actDir)})` : `${h.actualHome}-${h.actualAway}`;
            return { m:`${h.home} vs ${h.away}`, pred:predStr, real:realStr, type, date:h.date };
          })
          .reverse(); // 최신 경기 먼저
        const exact = ALL_MATCHES.filter(x=>x.type==="exact");
        const dir   = ALL_MATCHES.filter(x=>x.type==="dir");
        const miss  = ALL_MATCHES.filter(x=>x.type==="miss");
        const total = ALL_MATCHES.length;
        const hitRate = total ? ((exact.length+dir.length)/total*100).toFixed(1) : "0.0";

        const Badge = ({type}) => {
          const map = {
            exact:{bg:"rgba(0,220,100,0.15)", color:"#00dc64", label:"✅ 적중"},
            dir:  {bg:"rgba(0,180,255,0.15)", color:"#00b4ff", label:"🔵 방향"},
            miss: {bg:"rgba(255,70,70,0.13)",  color:"#ff5050", label:"❌ 미적중"},
          };
          const s = map[type];
          return <span style={{fontSize:10, fontWeight:700, color:s.color, background:s.bg,
            borderRadius:5, padding:"2px 6px", whiteSpace:"nowrap"}}>{s.label}</span>;
        };

        const MatchRow = ({m, pred, real, type}) => (
          <div style={{display:"flex", alignItems:"center", gap:6, padding:"6px 0",
            borderBottom:`1px solid ${T.border}22`}}>
            <Badge type={type}/>
            <span style={{flex:1, fontSize:11.5, fontWeight:600, color:T.text, minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{m}</span>
            <span style={{fontSize:10.5, color:T.muted, whiteSpace:"nowrap"}}>예측 <b style={{color:T.text}}>{pred}</b></span>
            <span style={{fontSize:10.5, color:T.dim}}>→</span>
            <span style={{fontSize:10.5, color: type==="miss"?T.red:T.green, fontWeight:700, whiteSpace:"nowrap"}}>{real}</span>
          </div>
        );

        return (
          <Card style={{marginTop:10}}>
            {/* 상단 요약 */}
            <div style={{marginBottom:10}}>
              <div style={{fontSize:13, fontWeight:800, color:T.text, marginBottom:6}}>
                📊 EPL 예측 적중 기록
                <span style={{fontSize:10, color:T.muted, fontWeight:400, marginLeft:6}}>2026/27 시즌 · {total}경기</span>
              </div>
              <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:5}}>
                {[
                  {label:"✅ 스코어",  val:exact.length, color:"#00dc64"},
                  {label:"🔵 방향",    val:dir.length,   color:"#00b4ff"},
                  {label:"❌ 미적중", val:miss.length,  color:"#ff5050"},
                  {label:"📈 적중률", val:`${hitRate}%`, color:T.accent},
                ].map(({label,val,color})=>(
                  <div key={label} style={{background:T.surface, borderRadius:8, padding:"8px 4px",
                    textAlign:"center", border:`1px solid ${T.border}`}}>
                    <div style={{fontSize:16, fontWeight:800, color}}>{val}</div>
                    <div style={{fontSize:9.5, color:T.muted, marginTop:2}}>{label}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* 전체 경기 카드 */}
            <div>
              {ALL_MATCHES.map((x,i)=><MatchRow key={i} {...x}/>)}
            </div>
          </Card>
        );
      })()}

      {history.length === 0 && (
        <Card style={{marginTop:10}}>
          <div style={{fontSize:12.5, color:T.muted, textAlign:"center"}}>
            예측 탭에서 "📌 예측기록에 저장"을 누르면 여기에 기록됩니다.
          </div>
        </Card>
      )}

      {history.map(h => <HistoryEntry key={h.id} entry={h} onSettle={onSettle} onDelete={onDelete}/>)}

      {history.length > 0 && (
        <button onClick={onClear} style={{width:"100%", marginTop:14, padding:"10px", borderRadius:9,
                border:`1px solid ${T.border}`, background:"transparent", color:T.red, fontSize:12.5, fontWeight:700, cursor:"pointer"}}>
          🗑️ 예측기록 전체 삭제
        </button>
      )}
      <button onClick={onResetElo} style={{width:"100%", marginTop:8, padding:"10px", borderRadius:9,
              border:`1px solid ${T.border}`, background:"transparent", color:T.muted, fontSize:12.5, fontWeight:700, cursor:"pointer"}}>
        ♻️ 동적 ELO 초기화 (경기결과로 갱신된 레이팅을 기본값으로 되돌리기)
      </button>
    </div>
  );
}

// ============================================================ 파이프라인 자동 연동
// GitHub Actions가 매일 갱신하는 reports/app_data.js를 앱 로딩 시 자동으로 가져와
// ELO/ADVANCED_STATS/RECENT_FORM/SQUADS/STATIC_LEADERBOARD/_liveResults에 병합한다.
// 실패해도(오프라인, 아직 파일 없음 등) 앱은 정상적으로 하드코딩된 기본값으로 동작한다.
const PIPELINE_REPO_OWNER = "style2580n-droid";
const PIPELINE_REPO_NAME = "epl-management";
const PIPELINE_BRANCH = "main";

async function loadPipelineData() {
  const url = `https://raw.githubusercontent.com/${PIPELINE_REPO_OWNER}/${PIPELINE_REPO_NAME}/${PIPELINE_BRANCH}/reports/app_data.js?t=${Date.now()}`;
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) { console.warn("[pipeline] app_data.js 없음:", res.status); return; }
    const text = await res.text();
    const extract = new Function(text +
      "\nreturn {PIPELINE_ELO, PIPELINE_ADVANCED_STATS, PIPELINE_RECENT_FORM, " +
      "PIPELINE_SQUADS, PIPELINE_STATIC_LEADERBOARD, PIPELINE_LIVE_RESULTS, " +
      "PIPELINE_TRANSFERS, PIPELINE_SCHEDULE, PIPELINE_H2H, " +
      "PIPELINE_TEAM_GROUP_GAMES: (typeof PIPELINE_TEAM_GROUP_GAMES!=='undefined'?PIPELINE_TEAM_GROUP_GAMES:null), " +
      "PIPELINE_PLAYER_BASELINE: (typeof PIPELINE_PLAYER_BASELINE!=='undefined'?PIPELINE_PLAYER_BASELINE:null)};");
    const d = extract();

    if (d.PIPELINE_ELO) {
      Object.entries(d.PIPELINE_ELO).forEach(([team, v]) => {
        ELO[team] = { ...ELO[team], ...v };
      });
    }
    if (d.PIPELINE_ADVANCED_STATS) {
      Object.entries(d.PIPELINE_ADVANCED_STATS).forEach(([team, v]) => {
        ADVANCED_STATS[team] = { ...ADVANCED_STATS[team], ...v };
      });
    }
    if (d.PIPELINE_RECENT_FORM) {
      Object.entries(d.PIPELINE_RECENT_FORM).forEach(([team, arr]) => {
        if (Array.isArray(arr) && arr.length) RECENT_FORM[team] = arr;
      });
    }
    if (d.PIPELINE_SQUADS) {
      Object.entries(d.PIPELINE_SQUADS).forEach(([team, v]) => {
        if (!SQUADS[team]) return;
        const merged = { ...SQUADS[team] };
        Object.entries(v).forEach(([key, val]) => {
          // 빈 배열/빈 문자열로 덮어써서 기존(수동 입력) 데이터를 지우지 않음.
          // 파이프라인이 실제 값을 갖고 있을 때만 교체한다.
          if (Array.isArray(val)) {
            if (val.length) merged[key] = val;
          } else if (typeof val === "string") {
            if (val.trim()) merged[key] = val;
          } else if (val !== null && val !== undefined) {
            merged[key] = val;
          }
        });
        SQUADS[team] = merged;
      });
    }
    // 2026-07-26 추가: TEAM_GROUP_GAMES(개인기여도 playerImpactPct의 소스)가
    // 여태 빈 객체로 하드코딩돼 있어서 죽어있던 기능. app_export.py가
    // *_metrics.json(경기별 실측 스탯)에서 재구성해 보내주는 걸 그대로 병합.
    if (d.PIPELINE_TEAM_GROUP_GAMES) {
      Object.entries(d.PIPELINE_TEAM_GROUP_GAMES).forEach(([team, gamesByLabel]) => {
        TEAM_GROUP_GAMES[team] = { ...(TEAM_GROUP_GAMES[team] || {}), ...gamesByLabel };
      });
      // 팀 기여도 캐시(getTeamShares)가 이전 계산(빈 데이터 기준)을 들고 있을
      // 수 있어서, 새 경기 데이터가 들어온 이상 반드시 비워야 함.
      if (typeof __teamShareCache !== "undefined") {
        Object.keys(__teamShareCache).forEach(k => delete __teamShareCache[k]);
      }
    }
    if (d.PIPELINE_STATIC_LEADERBOARD) {
      const lb = d.PIPELINE_STATIC_LEADERBOARD;
      Object.assign(STATIC_LEADERBOARD.scorers, lb.scorers || {});
      Object.assign(STATIC_LEADERBOARD.assists, lb.assists || {});
      Object.assign(STATIC_LEADERBOARD.gk, lb.gk || {});
      Object.assign(STATIC_LEADERBOARD.cards, lb.cards || {});
      Object.assign(STATIC_LEADERBOARD.ownGoals, lb.ownGoals || {});
    }
    if (d.PIPELINE_LIVE_RESULTS) {
      Object.assign(_liveResults, d.PIPELINE_LIVE_RESULTS);
    }
    if (d.PIPELINE_TRANSFERS) {
      Object.assign(TRANSFERS, d.PIPELINE_TRANSFERS);
    }
    if (Array.isArray(d.PIPELINE_SCHEDULE) && d.PIPELINE_SCHEDULE.length) {
      // 수동으로 짜둔 일정(SCHEDULE)은 유지하되, 같은 홈/원정 매치업이
      // 파이프라인에 있으면 그걸로 교체(더 정확한 실제 킥오프 시각).
      const byPair = new Map(SCHEDULE.map((m, i) => [`${m.home}||${m.away}`, i]));
      const next = [...SCHEDULE];
      d.PIPELINE_SCHEDULE.forEach(m => {
        const k = `${m.home}||${m.away}`;
        if (byPair.has(k)) next[byPair.get(k)] = m;
        else next.push(m);
      });
      next.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
      SCHEDULE = next;
    }
    if (d.PIPELINE_H2H) {
      Object.assign(H2H, d.PIPELINE_H2H);
    }
    if (d.PIPELINE_PLAYER_BASELINE && typeof d.PIPELINE_PLAYER_BASELINE === "object") {
      // A단계 (2026-07-22): 선수 능력치 기준선. 개막 전엔 빈 {}라 무효과.
      Object.assign(PLAYER_BASELINE, d.PIPELINE_PLAYER_BASELINE);
    }
    console.log("[pipeline] 파이프라인 데이터 연동 완료");
  } catch (e) {
    console.warn("[pipeline] 연동 실패(오프라인이거나 아직 데이터 없음):", e.message);
  }
}

  const [tab, setTab] = useState("predict");
  const [home, setHome] = useState(ALL_TEAMS[0]);
  const [away, setAway] = useState(ALL_TEAMS[1]);
  const [sims, setSims] = useState(100000);
  const [stage, setStage] = useState("group");
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [squadTeam, setSquadTeam] = useState(ALL_TEAMS[0]);
  const [history, setHistory] = useState([]);
  const [eloVersion, setEloVersion] = useState(0);
  const [config, setConfig] = useState(RUNTIME_CONFIG);
  const [ready, setReady] = useState(false);
  const [liveResults, setLiveResults] = useState({});
  const [themeMode, setThemeMode] = useState("dark");
  const [favTeams, setFavTeams] = useState([]);
  const [notifyEnabled, setNotifyEnabled] = useState(false);
  const [themeTick, setThemeTick] = useState(0);
  const notifiedKeysRef = useRef(new Set());

  useEffect(() => {
    (async () => {
      try {
        const rf = await window.storage.get("wc:favTeams", false);
        if (rf?.value) setFavTeams(JSON.parse(rf.value));
      } catch (e) {}
      try {
        const rn = await window.storage.get("wc:notifyEnabled", false);
        if (rn?.value === "true") setNotifyEnabled(true);
      } catch (e) {}
      try {
        const rk = await window.storage.get("wc:notifiedKeys", false);
        if (rk?.value) notifiedKeysRef.current = new Set(JSON.parse(rk.value));
      } catch (e) {}
    })();
  }, []);

  const toggleFavTeam = useCallback((team) => {
    setFavTeams(prev => {
      const next = prev.includes(team) ? prev.filter(t => t !== team) : [...prev, team];
      window.storage.set("wc:favTeams", JSON.stringify(next), false).catch(()=>{});
      return next;
    });
  }, []);

  const toggleNotify = useCallback(async (enabled) => {
    if (enabled && "Notification" in window && Notification.permission === "default") {
      try { await Notification.requestPermission(); } catch (e) {}
    }
    setNotifyEnabled(enabled);
    window.storage.set("wc:notifyEnabled", String(enabled), false).catch(()=>{});
  }, []);

  // 킥오프 30분 전 · 10분 전 알림 — 앱(탭)이 열려 있는 동안 1분마다 확인.
  // 실제 백그라운드 푸시(앱을 완전히 닫아도 오는 알림)는 서버 인프라가 필요해 이 앱 범위 밖입니다.
  useEffect(() => {
    if (!notifyEnabled || !favTeams.length) return;
    if (!("Notification" in window) || Notification.permission !== "granted") return;

    const check = () => {
      const now = Date.now();
      for (const m of SCHEDULE) {
        if (!favTeams.includes(m.home) && !favTeams.includes(m.away)) continue;
        const kickoff = new Date(`${m.date}T${m.time}:00`).getTime();
        if (isNaN(kickoff)) continue;
        const minutesUntil = (kickoff - now) / 60000;
        for (const lead of [30, 10]) {
          if (minutesUntil <= lead && minutesUntil > lead - 1) {
            const key = `${m.date}_${m.time}_${m.home}_${m.away}_${lead}`;
            if (notifiedKeysRef.current.has(key)) continue;
            notifiedKeysRef.current.add(key);
            window.storage.set("wc:notifiedKeys", JSON.stringify([...notifiedKeysRef.current]), false).catch(()=>{});
            try {
              new Notification(`⚽ ${lead}분 후 킥오프`, {
                body: `${m.home} vs ${m.away} · ${m.time} 시작`,
                tag: key,
              });
            } catch (e) {}
          }
        }
      }
    };
    check();
    const id = setInterval(check, 60000);
    return () => clearInterval(id);
  }, [notifyEnabled, favTeams]);

  useEffect(() => { updateSettledHistoryCache(history); }, [history]);

  useEffect(() => {
    (async () => {
      let mode = "dark";
      try {
        const r = await window.storage.get("wc:themeMode", false);
        if (r?.value === "light" || r?.value === "dark" || r?.value === "system") mode = r.value;
      } catch (e) {}
      applyTheme(mode);
      setThemeMode(mode);
    })();
  }, []);

  // 시스템 모드일 때 OS 다크/라이트 설정이 바뀌면 실시간 반영
  useEffect(() => {
    if (themeMode !== "system" || typeof window === "undefined" || !window.matchMedia) return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const handler = () => { applyTheme("system"); setThemeTick(v => v + 1); }; // 리렌더 유도
    try { mq.addEventListener("change", handler); } catch (e) { mq.addListener && mq.addListener(handler); }
    return () => { try { mq.removeEventListener("change", handler); } catch (e) { mq.removeListener && mq.removeListener(handler); } };
  }, [themeMode]);

  // 관심 팀 부상/이적 변경 감지 — 마지막 방문 이후 새로 추가된 항목이 있으면 알림.
  useEffect(() => {
    if (!notifyEnabled || !favTeams.length) return;
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    (async () => {
      let snapshot = {};
      try {
        const r = await window.storage.get("wc:teamUpdateSnapshot", false);
        if (r?.value) snapshot = JSON.parse(r.value);
      } catch (e) {}

      const nextSnapshot = { ...snapshot };
      for (const team of favTeams) {
        const sq = SQUADS[team];
        const custom = getCustomInjuries(team);
        const injuries = [...((sq && sq.injured) || []), ...custom];
        const tr = TRANSFERS[team] || { in: [], out: [] };
        const transferNames = [...(tr.in||[]).map(t=>`IN:${t.player}`), ...(tr.out||[]).map(t=>t.player ? `OUT:${t.player}` : "")].filter(Boolean);
        const current = [...injuries, ...transferNames];
        const prev = snapshot[team] || [];
        const newItems = current.filter(x => !prev.includes(x));
        if (prev.length > 0 && newItems.length > 0) {
          try {
            new Notification(`🚑 ${team} 소식 업데이트`, {
              body: newItems.slice(0, 3).join(" · "),
              tag: `team-update-${team}`,
            });
          } catch (e) {}
        }
        nextSnapshot[team] = current;
      }
      window.storage.set("wc:teamUpdateSnapshot", JSON.stringify(nextSnapshot), false).catch(()=>{});
    })();
  }, [notifyEnabled, favTeams]);

  const changeTheme = useCallback((mode) => {
    applyTheme(mode);
    setThemeMode(mode);
    window.storage.set("wc:themeMode", mode, false).catch(()=>{});
  }, []);

  useEffect(() => {
    (async () => {
      await loadDynamicElo();
      await loadLiveResults();
      try {
        let _merged = false;
        OPENING_RESULTS.forEach(o => {
          if (typeof o.hg === "number" && typeof o.ag === "number") {
            const k = `${o.home}_${o.away}`;
            if (!_liveResults[k] && !_liveResults[`${o.away}_${o.home}`]) {
              _liveResults[k] = { home:o.hg, away:o.ag, date:o.date, source:"opening", fetched:Date.now() };
              _merged = true;
            }
          }
        });
        if (_merged) await saveLiveResults();
      } catch (e) {}
      await loadCustomInjuries();
      const cfg = await loadRuntimeConfig();
      setConfig(cfg);
      try {
        let hist = [];
        let loadedFromStorage = false;
        try {
          const r = await window.storage.get("wc:history", false);
          if (r?.value) { hist = JSON.parse(r.value); loadedFromStorage = true; }
        } catch (e) {}

        try {
          let seededFlag = null;
          try { seededFlag = await window.storage.get("wc:seededBackup_v8", false); } catch(e){}

          if (true) { // v5: 항상 최신 BACKUP_SEED 적용
            BACKUP_SEED.history.forEach((bh) => {
              const i = hist.findIndex(h => h.home===bh.home && h.away===bh.away && h.date===bh.date);
              if (i >= 0) hist[i] = { ...hist[i], ...bh };
              else hist.push(bh);
            });

            hist.sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.id||0)-(a.id||0));

            try {
              Object.entries(BACKUP_SEED.dynamicElo).forEach(([team, val]) => { _dynamicElo[team] = val; });
              await saveDynamicElo();
            } catch (e) {}

            try {
              Object.entries(BACKUP_SEED.results).forEach(([key, val]) => { _liveResults[key] = val; });
              OPENING_RESULTS.forEach(o => {
                if (typeof o.hg === "number" && typeof o.ag === "number") {
                  const k = `${o.home}_${o.away}`;
                  if (!_liveResults[k] && !_liveResults[`${o.away}_${o.home}`]) {
                    _liveResults[k] = { home:o.hg, away:o.ag, date:o.date, source:"opening", fetched:Date.now() };
                  }
                }
              });
              await saveLiveResults();
            } catch (e) {}

            try { await window.storage.set("wc:leaderboard_v8", JSON.stringify(BACKUP_SEED.leaderboard), false); } catch (e) {}

            try {
              await window.storage.set("wc:history", JSON.stringify(hist), false);
              await window.storage.set("wc:seededBackup_v8", "1", false);
            } catch (e) {}
            setEloVersion(v => v + 1);
          }
        } catch (e) {}

        setHistory(hist);
      } catch (e) {}
      await loadPipelineData();
      setLiveResults({..._liveResults});
      setReady(true);
    })();
  }, []);

  const onResultFetched = useCallback(() => {
    setLiveResults({..._liveResults});
    setEloVersion(v => v + 1);
  }, []);

  const persistHistory = useCallback(async (list) => {
    setHistory(list);
    try { await window.storage.set("wc:history", JSON.stringify(list), false); } catch (e) {}
  }, []);

  const runPredict = useCallback(async () => {
    if (home === away) return;
    setLoading(true);
    try {
      const matchInfo = SCHEDULE.find(g => (g.home===home&&g.away===away)||(g.home===away&&g.away===home));
      const dateISO = matchInfo?.date || null;
      const live = await predictMatchLive(home, away, sims, dateISO);
      const cv = await crossValidate(home, away, live, dateISO);
      setResult({ ...live, cv });
    } catch (e) {
      const base = predictMatch(home, away, sims, { neutralVenue: true });
      const cv = await crossValidate(home, away, base).catch(()=>null);
      setResult({ ...base, liveApplied:false, liveSources:[], cv });
    } finally {
      setLoading(false);
    }
  }, [home, away, sims]);

  const saveToHistory = useCallback(() => {
    if (!result) return;
    const matchInfo = SCHEDULE.find(g => (g.home===home&&g.away===away)||(g.home===away&&g.away===home));
    const entry = {
      id: Date.now(),
      home, away,
      date: matchInfo?.date || null,
      stage,
      homeWinProb: result.homeWinProb, drawProb: result.drawProb, awayWinProb: result.awayWinProb,
      marketProbs: result.marketProbs || null,
      topScore: result.topScores[0]?.score,
      liveApplied: result.liveApplied,
      actualHome: null, actualAway: null, settled: false,
    };
    persistHistory([entry, ...history]);
  }, [result, home, away, history, persistHistory, stage]);

  const settleEntry = useCallback(async (id, hg, ag) => {
    const entry = history.find(h => h.id === id);
    if (!entry) return;
    const staticTeamStats = STATIC_MATCH_STATS[`${entry.home}_${entry.away}`]?.team;
    updateEloAfterMatch(entry.home, entry.away, hg, ag,
      staticTeamStats?.home?.xg, staticTeamStats?.away?.xg, entry.stage || "group");
    await saveDynamicElo();
    setEloVersion(v => v + 1);
    // 정확도 추적(브라이어 스코어·캘리브레이션)을 위해 삭제 대신 settled 상태로 보존
    persistHistory(history.map(h => h.id === id
      ? { ...h, actualHome: hg, actualAway: ag, settled: true }
      : h));
  }, [history, persistHistory]);

  const deleteEntry = useCallback((id) => {
    persistHistory(history.filter(h => h.id !== id));
  }, [history, persistHistory]);

  const clearHistory = useCallback(() => {
    if (!confirm("저장된 예측기록을 모두 삭제할까요?")) return;
    persistHistory([]);
  }, [persistHistory]);

  const resetElo = useCallback(async () => {
    if (!confirm("경기결과로 갱신된 동적 ELO를 기본값으로 초기화할까요?")) return;
    await resetDynamicElo();
    setEloVersion(v => v + 1);
  }, []);

  const onSelectMatch = useCallback((h, a) => {
    setHome(h); setAway(a); setResult(null); setTab("predict");
  }, []);

  const onSelectKnockoutMatch = useCallback((h, a, st) => {
    setHome(h); setAway(a); setResult(null);
    if (st && STAGE_META[st]) setStage(st);
    setTab("predict");
  }, []);

  return (
    <div style={{maxWidth:520, margin:"0 auto", minHeight:"100vh", paddingBottom:30}}>
      <div style={{padding:"18px 14px 10px", textAlign:"center"}}>
        <div style={{fontSize:20, fontWeight:900, color:T.text}}>⚽ 프리미어리그 예측기 <span style={{fontSize:13, color:T.cyan, fontWeight:600}}>v1.0</span></div>
        <div style={{fontSize:11.5, color:T.muted, marginTop:3}}>
          하이브리드 ELO · xG · ML 앙상블 · 몬테카를로 · 실시간 결과 · 리그 순위 자동집계
        </div>
      </div>

      <div style={{display:"flex", overflowX:"auto", gap:6, padding:"0 12px 10px", borderBottom:`1px solid ${T.border}`}}>
        {TABS.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{flex:"0 0 auto", padding:"8px 14px", borderRadius:20, border:"none", cursor:"pointer",
                    fontSize:13, fontWeight:700, whiteSpace:"nowrap",
                    background: tab===t.id ? T.accent : T.surface,
                    color: tab===t.id ? "#fff" : T.muted}}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={{padding:"12px 12px 0"}}>
        {!ready ? (
          <Card><div style={{textAlign:"center", color:T.muted, fontSize:13}}>불러오는 중...</div></Card>
        ) : (
          <>
            {tab === "predict" && (
              <PredictTab home={home} away={away} setHome={setHome} setAway={setAway}
                sims={sims} setSims={setSims} stage={stage} setStage={setStage}
                result={result} loading={loading} onPredict={runPredict} onSave={saveToHistory}
                favTeams={favTeams} onSelectMatch={onSelectMatch}/>
            )}
            {tab === "schedule" && <ScheduleTab onSelectMatch={onSelectMatch} liveResults={liveResults} onResultFetched={onResultFetched}/>}
            {tab === "standings" && <LeagueStandingsTab onSelectMatch={onSelectMatch}/>}
            {tab === "season" && <SeasonForecastTab eloVersion={eloVersion}/>}
            {tab === "squads" && <SquadTab team={squadTeam} setTeam={setSquadTeam}/>}
            {tab === "rankings" && <RankingTab eloVersion={eloVersion}/>}
            {tab === "settings" && <SettingsTab config={config} setConfig={setConfig} sampleHome={home} sampleAway={away}
              themeMode={themeMode} onChangeTheme={changeTheme}
              favTeams={favTeams} onToggleFavTeam={toggleFavTeam}
              notifyEnabled={notifyEnabled} onToggleNotify={toggleNotify}/>}
            {tab === "history" && (
              <HistoryTab history={history} onSettle={settleEntry} onDelete={deleteEntry}
                onClear={clearHistory} onResetElo={resetElo}/>
            )}
          </>
        )}
      </div>

      <div style={{textAlign:"center", marginTop:24, fontSize:10.5, color:T.dim}}>
        ⚠️ 본 예측은 통계 모델 + 실시간 배당/예측 기반 시뮬레이션이며 실제 결과와 다를 수 있습니다.<br/>
        v1.0 · 프리미어리그 · ELO 자동갱신 · MC 100,000회
      </div>
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(
    <ErrorBoundary><App/></ErrorBoundary>
  );
} catch (e) {
  const el = document.getElementById("root");
  if (el) el.innerHTML = '<div style="padding:20px;color:#ff6b6b;font-family:sans-serif;font-size:14px;line-height:1.6">'
    + '⚠️ 앱 로딩 중 오류가 발생했습니다.<br/><br/>'
    + '브라우저 메뉴 → 방문 기록/캐시 삭제 후 다시 열어보세요.<br/><br/>'
    + '<small style="color:#888">' + (e && e.message ? e.message : e) + '</small></div>';
}
</script>

<script>
// PWA 서비스워커 등록 — sw.js가 같은 폴더에 없으면(로컬 파일로 열었거나 아직 안 올렸으면) 조용히 무시됨.
// file:// 로 열면 서비스워커 자체가 브라우저 정책상 동작하지 않으므로, GitHub Pages 등 http(s) 호스팅에서만 실제로 활성화됩니다.
if ("serviceWorker" in navigator && (location.protocol === "http:" || location.protocol === "https:")) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () { /* sw.js 없음 — 앱은 정상 동작 */ });
  });
}
</script>

</body>
</html>
