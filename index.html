<script>
/* window.storage 폴리필 — Claude 아티팩트 밖(일반 웹)에서는 localStorage로 영구 저장 */
(function(){
  if (window.storage) return;
  function lsKey(k, shared){ return (shared?"shared:":"user:") + k; }
  window.storage = {
    async get(key, shared){
      const v = localStorage.getItem(lsKey(key, shared));
      if (v === null) return null;
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared){
      localStorage.setItem(lsKey(key, shared), value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      localStorage.removeItem(lsKey(key, shared));
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      const pfx = lsKey(prefix||"", shared);
      const keys = [];
      for (let i=0;i<localStorage.length;i++){
        const full = localStorage.key(i);
        if (full && full.startsWith(pfx)){
          keys.push(full.replace(shared?"shared:":"user:",""));
        }
      }
      return { keys, prefix, shared: !!shared };
    }
  };
})();
</script>

var PLAYER_NAME_NORM_FULL = {}; // 월드컵 국가대표 선수명 사전(EPL과 무관) 제거 — 필요시 향후 EPL 전용으로 재구성
var PLAYER_NAME_NORM_LAST = {};
var PLAYER_KO_TO_EN = {};

function __normName(s){
  if(!s) return "";
  try { s = s.normalize("NFKD").replace(/[\u0300-\u036f]/g,""); } catch(e){}
  return s.toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
}
// 영문 선수명 → 한글 (없으면 원문 유지). 숫자/등번호 앞부분 제거 후 매칭.
function koPlayer(name){
  if(name==null) return name;
  var raw = String(name).trim();
  if(!raw) return raw;
  // 한글이 이미 포함되면 그대로
  if(/[\uAC00-\uD7A3]/.test(raw)) return raw;
  var n = __normName(raw);
  if(!n) return raw;
  if(PLAYER_NAME_NORM_FULL[n]) return PLAYER_NAME_NORM_FULL[n];
  var toks = n.split(" ");
  var last = toks[toks.length-1];
  if(PLAYER_NAME_NORM_LAST[last]) return PLAYER_NAME_NORM_LAST[last];
  // "C. Ronaldo" 형태: 첫토큰이 이니셜이면 성으로 재시도
  if(toks.length>=2 && toks[0].length===1 && PLAYER_NAME_NORM_LAST[toks[1]]) return PLAYER_NAME_NORM_LAST[toks[1]];
  return raw; // 폴백: 영문 원문
}
// 배열/문자열 라인업을 한글로 변환
function koPlayerList(arr){ return Array.isArray(arr) ? arr.map(koPlayer) : arr; }

// 확정 라인업(영문 배열)에서 특정 한글선수가 '미포함'인지 판정.
function isKoPlayerInLineup(koName, lineupEnArr){
  if(!Array.isArray(lineupEnArr) || !lineupEnArr.length) return true; // 라인업 없으면 판단불가→포함으로 간주
  // 라인업 원소를 한글로 바꿔 직접 비교
  for(var i=0;i<lineupEnArr.length;i++){
    var el = lineupEnArr[i];
    if(el==null) continue;
    if(String(el).indexOf(koName)>=0) return true;
    if(koPlayer(el)===koName) return true;
  }
  // 역인덱스: 이 한글선수의 영문 별칭이 라인업 정규화 결과에 있나
  var aliases = PLAYER_KO_TO_EN[koName];
  if(aliases){
    var normLU = lineupEnArr.map(function(x){ return __normName(String(x)); });
    for(var a=0;a<aliases.length;a++){
      for(var b=0;b<normLU.length;b++){
        if(normLU[b].indexOf(aliases[a])>=0 || aliases[a].indexOf(normLU[b])>=0){
          // 성 단위라도 겹치면 포함
          var la = aliases[a].split(" ").pop(), lb = normLU[b].split(" ").pop();
          if(la===lb) return true;
        }
      }
    }
    return false; // 별칭 아는데 라인업에 없음 → 미포함(결장 의심)
  }
  return true; // 매핑 없는 선수는 판단 보류(오탐 방지)
}
// 팀의 한글 핵심선수 중 확정 라인업에 없는 선수 목록 반환
function keyPlayersMissing(team, lineupEnArr){
  if(!Array.isArray(lineupEnArr) || !lineupEnArr.length) return [];
  var keys = (typeof getKeyPlayers==="function") ? getKeyPlayers(team) : [];
  var out = [];
  for(var i=0;i<keys.length;i++){
    var nm = keys[i] && keys[i].name;
    if(!nm) continue;
    // 역인덱스에 영문별칭을 아는 선수만 신뢰성 있게 판정(모르면 스킵→오탐방지)
    if(!PLAYER_KO_TO_EN[nm]) continue;
    if(!isKoPlayerInLineup(nm, lineupEnArr)) out.push(keys[i]);
  }
  return out;
}

function staticOddsToProb(o) {
  if (!o) return null;
  const ih = 1/o.home, id = 1/o.draw, ia = 1/o.away;
  const sum = ih + id + ia;
  return { home: ih/sum, draw: id/sum, away: ia/sum };
}

function expScore(ra, rb) {
  return 1 / (1 + Math.pow(10, (rb - ra) / 400));
}
function glicko2Factor(rd) {
  const q = Math.log(10) / 400;
  return 1 / Math.sqrt(1 + (3 * q * q * rd * rd) / (Math.PI * Math.PI));
}
function calcDrawProb(eloDiff) {
  const base = 0.27;
  const closeness = Math.max(0, 1 - Math.abs(eloDiff) / 500);
  return Math.min(0.34, Math.max(0.16, base + closeness * 0.07));
}
function poissonRandom(lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}
function playerEloPenalty(team) {
  const data = ELO[team];
  if (!data) return 0;
  return (data.injuries || 0) * 8;
}
function bayesianBlend(priorProb, dataProb, weight = 0.6) {
  if (typeof dataProb !== "number" || isNaN(dataProb)) return priorProb;
  return priorProb * (1 - weight) + dataProb * weight;
}

function getDynElo(team, field) {
  const dyn = _dynamicElo[team];
  if (dyn && typeof dyn[field] === "number") return dyn[field];
  const base = ELO[team];
  if (base && typeof base[field] === "number") return base[field];

  return FALLBACK[field] ?? 1300;
}
function getKFactor(stage = "group") {
  const factors = { group:20, ro32:22, ro16:24, qf:28, sf:32, final:40, friendly:12, qualifier:16, po:18 };
  return factors[stage] ?? 20;
}

function updateEloAfterMatch(home, away, homeGoals, awayGoals, xgHome, xgAway, stage = "group") {
  const hg = Number.isFinite(homeGoals) ? homeGoals : 0;
  const ag = Number.isFinite(awayGoals) ? awayGoals : 0;
  const safeXgHome = (typeof xgHome === "number" && !isNaN(xgHome)) ? xgHome : Math.max(0.2, hg + 0.3);
  const safeXgAway = (typeof xgAway === "number" && !isNaN(xgAway)) ? xgAway : Math.max(0.2, ag + 0.3);

  const homeBase = getDynElo(home, "base");
  const awayBase = getDynElo(away, "base");
  const expectedHome = expScore(homeBase + 60, awayBase);

  let actualHome = 0.5;
  if (hg > ag) actualHome = 1; else if (hg < ag) actualHome = 0;

  const k = getKFactor(stage);
  const goalDiff = Math.abs(hg - ag);
  const margin = goalDiff <= 1 ? 1 : (goalDiff === 2 ? 1.5 : 1.75);
  const homeChange = k * margin * (actualHome - expectedHome);
  const awayChange = -homeChange;

  if (!_dynamicElo[home]) _dynamicElo[home] = { ...(ELO[home] || {}) };
  if (!_dynamicElo[away]) _dynamicElo[away] = { ...(ELO[away] || {}) };

function buildFeatureVector(home, away, homeAdv = 60) {
  const h = ELO[home] || {}, a = ELO[away] || {};
  const hSpi = SPI_RATINGS[home]?.spi ?? 50, aSpi = SPI_RATINGS[away]?.spi ?? 50;
  const hOpta = OPTA_RANKINGS[home]?.powerScore ?? 50, aOpta = OPTA_RANKINGS[away]?.powerScore ?? 50;

  // 갱신을 안 해서 항상 0-0=0이었음(사용자 확인 + 전수조사). getRollingXgForm은 _liveResults

    eloDiff: getDynElo(home,"base") - getDynElo(away,"base") + homeAdv,
    spiDiff: hSpi - aSpi,
    optaDiff: hOpta - aOpta,
    xgDiff: getDynElo(home,"xG") - getDynElo(away,"xG"),
    xgaDiff: getDynElo(away,"xGA") - getDynElo(home,"xGA"),
    formDiff: (hForm - aForm) * 10,
    ppdaDiff: (a.ppda ?? 14) - (h.ppda ?? 14),
    fieldTiltDiff: (h.fieldTilt ?? 45) - (a.fieldTilt ?? 45),

function mlXgFeature(homeName, awayName) {

function getHandicapProbs(scoreCounts, totalSims) {
  const handicaps = [-1.5, -1.0, -0.5, 0, 0.5, 1.0, 1.5];
  const result = {};
  for (const h of handicaps) {
    let cover = 0;
    for (const [score, cnt] of Object.entries(scoreCounts)) {
      const [hg, ag] = score.split("-").map(Number);
      if (hg + h > ag) cover += cnt;
    }

function getRestDays(team, matchDate) {

function getMotivationFactor(team, matchDate) {
  if (!matchDate) return 1.0;
  let f = 1.0;
  // (a) 일정상 위치 보정
  const teamMatches = SCHEDULE
    .filter(m => m && m.home && m.away && (m.home === team || m.away === team))
    .sort((a, b) => a.date < b.date ? -1 : 1);
  const idx = teamMatches.findIndex(m => m.date === matchDate);
  const total = teamMatches.length;
  if (idx === total - 1) f *= 1.03;
  else if (idx === 0) f *= 1.02;
  // (b) 순위 기반 동기부여: 실제 결과가 쌓였을 때만
  try {
    const st = (typeof getLocalTeamStanding === "function") ? getLocalTeamStanding(team) : null;
    if (st && st.playedGames >= 3) {
      const pos = st.position;
      // 시즌 진행도(경기 소화율)에 비례해 동기부여 강도 증가 (종반일수록 절실)
      const prog = Math.min(1, (st.playedGames || 0) / 34);
      const k = 0.5 + 0.5 * prog; // 초반 0.5 → 종반 1.0
      if (pos >= 18)      f *= (1 + 0.09 * k); // 강등권: 절실
      else if (pos >= 15) f *= (1 + 0.05 * k); // 강등 다툼
      else if (pos <= 4)  f *= (1 + 0.04 * k); // 챔스권 다툼
      else if (pos <= 7)  f *= (1 + 0.03 * k); // 유럽권 다툼
      else                f *= 1.0;            // 중위권: 동기 낮음
    }
  } catch(e) {}
  return Math.max(0.95, Math.min(1.14, f));
}


// ── 홈/원정 폼 분리: 최근 홈경기 폼 / 원정경기 폼 (저장된 결과 기반) ──
function getVenueForm(team, isHome, matchDate) {
  try {
    const rows = [];
    for (const [k, v] of Object.entries(_liveResults || {})) {
      if (!v || typeof v.home !== "number") continue;
      const [h, a] = k.split("__");
      if (h !== team && a !== team) continue;
      if (matchDate && v.date && v.date >= matchDate) continue; // 미래 제외
      const teamIsHome = (h === team);
      if (teamIsHome !== isHome) continue; // 홈/원정 필터
      const gf = teamIsHome ? v.home : v.away;
      const ga = teamIsHome ? v.away : v.home;
      rows.push({ date: v.date || "", gd: gf - ga, pts: gf>ga?3:(gf===ga?1:0) });
    }
    if (!rows.length) return null;
    rows.sort((x,y)=> x.date < y.date ? 1 : -1);
    const recent = rows.slice(0, 5);
    const avgPts = recent.reduce((s,r)=>s+r.pts,0) / recent.length; // 0~3
    const avgGd  = recent.reduce((s,r)=>s+r.gd,0) / recent.length;
    return { avgPts, avgGd, n: recent.length };
  } catch(e) { return null; }
}

// 홈/원정 폼 → λ 배수 (해당 장소 폼이 좋으면 소폭 상승)
function venueFormFactor(team, isHome, matchDate) {
  const vf = getVenueForm(team, isHome, matchDate);
  if (!vf || vf.n < 2) return 1.0;
  // 평균승점 1.5(중립) 기준, ±에 비례. gd도 소폭 반영.
  const f = 1 + (vf.avgPts - 1.5) * 0.03 + vf.avgGd * 0.01;
  return Math.max(0.93, Math.min(1.08, f));
}

function getRollingXgForm(team, matchDate) {
  try {
    const rows = [];
    for (const [k, v] of Object.entries(_liveResults || {})) {
      if (!v || typeof v.home !== "number") continue;
      const [h, a] = k.split("__");
      if (h !== team && a !== team) continue;
      if (matchDate && v.date && v.date >= matchDate) continue;
      const teamIsHome = (h === team);
      // xG가 저장돼 있으면 우선 사용, 없으면 실제 득실로 근사
      const xgF = teamIsHome ? (v.xgHome ?? v.home) : (v.xgAway ?? v.away);
      const xgA = teamIsHome ? (v.xgAway ?? v.away) : (v.xgHome ?? v.home);
      rows.push({ date: v.date || "", xgd: xgF - xgA });
    }
    if (!rows.length) return null;
    rows.sort((x,y)=> x.date < y.date ? 1 : -1);
    const recent = rows.slice(0, 5);
    // 지수가중(최신 무겁게)
    let w=1, ws=0, vs=0;
    for (const r of recent) { vs += r.xgd * w; ws += w; w *= 0.8; }
    return ws>0 ? vs/ws : 0; // 평균 xGD (양수=최근 폼 좋음)
  } catch(e) { return null; }
}

function rollingXgFactor(team, matchDate) {
  const xgd = getRollingXgForm(team, matchDate);
  if (xgd === null) return 1.0;
  return Math.max(0.90, Math.min(1.12, 1 + xgd * 0.06)); // xGD +1 → +6%
}

    }
    // 잃은 공격 비중(0~1)만큼 최대 -35% 감쇠
    return Math.max(0.65, 1 - Math.min(0.5, lostAtk) * 0.7);
  } catch(e) { return 1.0; }
}

const STAGE_WEIGHTS = { base:0.20, xgElo:0.15, atk:0.10, def:0.10, form:0.15, market:0.15, player:0.15 };

function compositeElo(team) {
  let total = 0;
  for (const [field, w] of Object.entries(STAGE_WEIGHTS)) total += getDynElo(team, field) * w;
  total -= playerEloPenalty(team);
  return total;
}

function predictMatch(homeName, awayName, sims = 100000, liveOverride = {}) {
  const dateISO = liveOverride.dateISO || null;
  const homeRestBonus = getRestPenalty(homeName, dateISO);
  const awayRestBonus = getRestPenalty(awayName, dateISO);
  const homeMotivation = getMotivationFactor(homeName, dateISO);
  const awayMotivation = getMotivationFactor(awayName, dateISO);

  const homeEuPen = euRotationPenalty(homeName, dateISO);
  const awayEuPen = euRotationPenalty(awayName, dateISO);
  const homeEloRaw = compositeElo(homeName) * (1 + homeRestBonus + homeEuPen) * homeMotivation;
  const awayEloRaw = compositeElo(awayName) * (1 + awayRestBonus + awayEuPen) * awayMotivation;
  const homeAdv = liveOverride.neutralVenue ? 25 : 60;
  const homeElo = homeEloRaw + homeAdv;
  const awayElo = awayEloRaw;

  const eloDiff = homeElo - awayElo;
  const winProbRaw = expScore(homeElo, awayElo);
  const drawProbRaw = calcDrawProb(eloDiff);
  let homeWinProb = winProbRaw * (1 - drawProbRaw);
  let awayWinProb = (1 - winProbRaw) * (1 - drawProbRaw);
  let drawProb = drawProbRaw;

  const features = buildFeatureVector(homeName, awayName, homeAdv);
  const { xgDiff: mlXgDiff, hasXg: mlHasXg } = mlXgFeature(homeName, awayName);
  const realMlProbs = mlEnsembleProbs(eloDiff, mlXgDiff, mlHasXg);
  let mlApplied = false, usedRealMl = false, mlProbs;
  if (realMlProbs) {
    // 진짜 학습된 모델이 있으면 이걸 우선 사용(하드코딩 트리보다 신뢰도 높음).
    // 8개리그 앱과 동일하게 20% 가중치 — 시즌 초반 학습표본이 적을 수 있어 과신 방지.
    mlProbs = { homeWin: realMlProbs.H, draw: realMlProbs.D, awayWin: realMlProbs.A }; // 아래 mlSkew·return용으로 통일된 모양 유지
    const ML_WEIGHT = 0.2;
    homeWinProb = homeWinProb * (1 - ML_WEIGHT) + realMlProbs.H * ML_WEIGHT;
    awayWinProb = awayWinProb * (1 - ML_WEIGHT) + realMlProbs.A * ML_WEIGHT;
    drawProb    = drawProb    * (1 - ML_WEIGHT) + realMlProbs.D * ML_WEIGHT;
    mlApplied = true; usedRealMl = true;
  } else {
    // 폴백: 진짜 모델 없으면 기존 하드코딩 트리 3개(ELO/xG/폼) 블렌딩 유지
    mlProbs = randomForestWinProb(features);
    homeWinProb = bayesianBlend(homeWinProb, mlProbs.homeWin, 0.4);
    awayWinProb = bayesianBlend(awayWinProb, mlProbs.awayWin, 0.4);
    drawProb    = bayesianBlend(drawProb,    mlProbs.draw,    0.4);
    mlApplied = true;
  }
  let normTotal = homeWinProb + awayWinProb + drawProb;
  homeWinProb /= normTotal; awayWinProb /= normTotal; drawProb /= normTotal;

  const hData = ELO[homeName] || {}, aData = ELO[awayName] || {};
  const hXg = getDynElo(homeName, "xG"), hXga = getDynElo(homeName, "xGA");
  const aXg = getDynElo(awayName, "xG"), aXga = getDynElo(awayName, "xGA");
  const homeLambdaMul = liveOverride.neutralVenue ? 1.00 : 1.08;
  const awayLambdaMul = liveOverride.neutralVenue ? 1.00 : 0.95;
  let lambdaHome = ((hXg + aXga) / 2) * homeLambdaMul;
  let lambdaAway = ((aXg + hXga) / 2) * awayLambdaMul;

  const eloLambdaFactor = Math.max(-0.35, Math.min(0.35, eloDiff / 200 * 0.18));
  lambdaHome *= (1 + eloLambdaFactor);
  lambdaAway *= (1 - eloLambdaFactor);
  lambdaHome = Math.max(0.15, lambdaHome);
  lambdaAway = Math.max(0.15, lambdaAway);
  const mlSkew = mlProbs.homeWin - mlProbs.awayWin;
  lambdaHome = mlAdjustedLambda(lambdaHome, mlSkew);
  lambdaAway = mlAdjustedLambda(lambdaAway, -mlSkew);

  if (typeof liveOverride.lambdaHomeAdj === "number") lambdaHome = Math.max(0.15, lambdaHome + liveOverride.lambdaHomeAdj);
  if (typeof liveOverride.lambdaAwayAdj === "number") lambdaAway = Math.max(0.15, lambdaAway + liveOverride.lambdaAwayAdj);

  // ── 예측 근거 추적: 각 보정 단계의 λ합 변화(홈+원정)를 기여도로 기록 ──
  const _factors = [];
  const _sum = () => lambdaHome + lambdaAway;
  let _prev = _sum();
  const _track = (label) => { const now = _sum(); _factors.push({ label, delta: +(now - _prev).toFixed(3) }); _prev = now; };

  const psxgAdj = psxgLambdaAdjust(lambdaHome, lambdaAway, homeName, awayName);
  lambdaHome = psxgAdj.lH;
  lambdaAway = psxgAdj.lA;
  _track("골키퍼(PSxG)");

  const setpAdj = setPieceLambdaAdjust(lambdaHome, lambdaAway, homeName, awayName);
  lambdaHome = setpAdj.lH; lambdaAway = setpAdj.lA;
  _track("세트피스");
  const headAdj = headingLambdaAdjust(lambdaHome, lambdaAway, homeName, awayName);
  lambdaHome = headAdj.lH; lambdaAway = headAdj.lA;
  _track("헤딩·공중볼");
  const haAdj = homeAwaySplitAdjust(lambdaHome, lambdaAway, homeName, awayName);
  lambdaHome = haAdj.lH; lambdaAway = haAdj.lA;
  _track("홈/원정 스플릿");

  const injAdj = injuryLambdaAdjust(lambdaHome, lambdaAway, homeName, awayName);
  lambdaHome = injAdj.lH; lambdaAway = injAdj.lA;
  _track("결장·부상");
  const pbAdj = playerBaselineLambdaAdjust(lambdaHome, lambdaAway, homeName, awayName);
  lambdaHome = pbAdj.lH; lambdaAway = pbAdj.lA;
  _track("선수 능력치");  // A단계 (2026-07-22): 개막 후 팀당 표본 쌓이기 전엔 무효과
  const formAdj = formLambdaAdjust(lambdaHome, lambdaAway, homeName, awayName);
  lambdaHome = formAdj.lH; lambdaAway = formAdj.lA;
  _track("최근 폼");
  const promoAdj = promotedLambdaAdjust(lambdaHome, lambdaAway, homeName, awayName);
  lambdaHome = promoAdj.lH; lambdaAway = promoAdj.lA;
  _track("승격팀 보정");

  // 홈/원정 폼 분리 (홈팀은 홈 폼, 원정팀은 원정 폼)
  lambdaHome *= venueFormFactor(homeName, true,  dateISO);
  lambdaAway *= venueFormFactor(awayName, false, dateISO);
  _track("홈/원정 최근폼");
  // 롤링 xG 폼(최근 5경기 xGD)
  lambdaHome *= rollingXgFactor(homeName, dateISO);
  lambdaAway *= rollingXgFactor(awayName, dateISO);
  _track("롤링 xG");
  // 결장의 xG 가중치(핵심선수 비중 기반)
  lambdaHome *= injuryXgWeight(homeName);
  lambdaAway *= injuryXgWeight(awayName);
  _track("결장 xG비중");
  lambdaHome = Math.max(0.15, lambdaHome);
  lambdaAway = Math.max(0.15, lambdaAway);

  const starAdj = starPlayerLambdaBoost(lambdaHome, lambdaAway, homeName, awayName);
  lambdaHome = starAdj.lH;
  lambdaAway = starAdj.lA;

  const bcSkew = bigChanceSkew(homeName, awayName);
  homeWinProb = Math.max(0.02, Math.min(0.96, homeWinProb + bcSkew));
  awayWinProb = Math.max(0.02, Math.min(0.96, awayWinProb - bcSkew * 0.6));
  drawProb    = Math.max(0.02, 1 - homeWinProb - awayWinProb);

  // 더비/라이벌 매치: 전력차 완화 + 무승부 확률 상승(접전 성향)
  if (isRivalry(homeName, awayName)) {
    const favComp = 0.90; // 승패 확률을 10% 무승부 쪽으로 압축
    homeWinProb *= favComp;
    awayWinProb *= favComp;
    drawProb = Math.max(0.02, 1 - homeWinProb - awayWinProb);
    // λ도 소폭 수렴시켜 접전 스코어 유도
    const mid = (lambdaHome + lambdaAway) / 2;
    lambdaHome = lambdaHome * 0.92 + mid * 0.08;
    lambdaAway = lambdaAway * 0.92 + mid * 0.08;
  }

  const safeSims = Number.isFinite(sims) && sims > 0 ? Math.floor(sims) : 100000;
  let hw=0, dr=0, aw=0;
  const scoreCounts = {};
  for (let i=0;i<safeSims;i++) {
    const hg = poissonRandom(lambdaHome);
    const ag = poissonRandom(lambdaAway);
    if (hg>ag) hw++; else if (hg<ag) aw++; else dr++;
    const key = `${hg}-${ag}`;
    scoreCounts[key] = (scoreCounts[key]||0)+1;
  }
  const mcHome = hw/safeSims, mcDraw = dr/safeSims, mcAway = aw/safeSims;

  const finalHome = (homeWinProb + mcHome) / 2;
  const finalDraw = (drawProb + mcDraw) / 2;
  const finalAway = (awayWinProb + mcAway) / 2;

  const allBaseScores = Object.entries(scoreCounts)
    .sort((a,b)=>b[1]-a[1])
    .map(([score,count])=>({ score, prob: count/safeSims }));

  const bFav = homeWinProb > awayWinProb && homeWinProb > drawProb ? "home"
    : awayWinProb > homeWinProb && awayWinProb > drawProb ? "away" : "draw";
  let topScores;
  if (bFav !== "draw") {
    const fwins = allBaseScores.filter(s => {
      const [hg,ag] = s.score.split("-").map(Number);
      return bFav === "home" ? hg > ag : ag > hg;
    });
    const rest = allBaseScores.filter(s => !fwins.includes(s));
    topScores = [...fwins, ...rest].slice(0, 5);
  } else {
    topScores = allBaseScores.slice(0, 5);
  }

  const overUnder = computeOverUnder(scoreCounts, safeSims);
  const handicapProbs = getHandicapProbs(scoreCounts, safeSims);
  const marketStats = computeMarketStats(scoreCounts, safeSims);
  const calibrated = calibrateProbTriple(finalHome, finalDraw, finalAway);

  return {
    home: homeName, away: awayName,
    homeWinProb: calibrated.home, drawProb: calibrated.draw, awayWinProb: calibrated.away,
    eloOnly: { homeWinProb, drawProb, awayWinProb },
    monteCarlo: { homeWinProb: mcHome, drawProb: mcDraw, awayWinProb: mcAway },
    lambdaHome, lambdaAway,
    homeElo, awayElo, eloDiff,
    topScores,
    overUnder,
    handicapProbs,
    marketStats,
    restInfo: { homeRestBonus, awayRestBonus, homeMotivation, awayMotivation },
    explain: {
      factors: _factors.filter(f => Math.abs(f.delta) >= 0.005),
      base: { homeAdvantage: +(homeLambdaMul - 1).toFixed(2), eloDiff: +eloDiff.toFixed(0), eloLambdaFactor: +eloLambdaFactor.toFixed(3) },
      isRivalry: (typeof isRivalry === "function") ? isRivalry(homeName, awayName) : false,
      motivation: { home: +homeMotivation.toFixed(3), away: +awayMotivation.toFixed(3) },
    },
    sims: safeSims,
    mlProbs, features, usedRealMl, // usedRealMl=true면 진짜 학습된 모델(PIPELINE_ML_ENSEMBLE), false면 하드코딩 트리 폴백
    timestamp: Date.now(),
  };
}

function computeOverUnder(scoreCounts, totalSims) {
  const lines = [2.5, 3.5];
  const result = {};
  for (const line of lines) {
    let over = 0;
    for (const [score, count] of Object.entries(scoreCounts)) {
      const [h, a] = score.split("-").map(Number);
      if ((h + a) > line) over += count;
    }
    result[line] = { over: over / totalSims, under: 1 - over / totalSims };
  }
  return result;
}

function computeMarketStats(scoreCounts, totalSims) {
  let bttsYes = 0;       // 양 팀 득점
  let homeCS = 0;        // 홈 클린시트 (원정 무득점)
  let awayCS = 0;        // 원정 클린시트 (홈 무득점)
  let homeWinNil = 0;    // 홈 무실점 승리
  let awayWinNil = 0;    // 원정 무실점 승리
  const over15 = { o:0 }, over05 = { o:0 };
  let oddTotal = 0;      // 총득점 홀수

  const exactDist = Object.entries(scoreCounts)
    .map(([score, count]) => ({ score, prob: count / totalSims }))
    .sort((a, b) => b.prob - a.prob);

  for (const [score, count] of Object.entries(scoreCounts)) {
    const [h, a] = score.split("-").map(Number);
    if (h >= 1 && a >= 1) bttsYes += count;
    if (a === 0) homeCS += count;
    if (h === 0) awayCS += count;
    if (h > a && a === 0) homeWinNil += count;
    if (a > h && h === 0) awayWinNil += count;
    if (h + a > 1.5) over15.o += count;
    if (h + a > 0.5) over05.o += count;
    if ((h + a) % 2 === 1) oddTotal += count;
  }

  const p = (x) => x / totalSims;
  return {
    btts: { yes: p(bttsYes), no: 1 - p(bttsYes) },
    cleanSheet: { home: p(homeCS), away: p(awayCS) },
    winToNil: { home: p(homeWinNil), away: p(awayWinNil) },
    over15: { over: p(over15.o), under: 1 - p(over15.o) },
    over05: { over: p(over05.o), under: 1 - p(over05.o) },
    oddEven: { odd: p(oddTotal), even: 1 - p(oddTotal) },
    exactDist: exactDist.slice(0, 8),   // 상위 8개 스코어
  };
}

function impliedProbabilityFromOdds(odds) {
  if (typeof odds !== "number" || !isFinite(odds) || odds <= 1) return null;
  return 1 / odds;
}

function devigOdds(oddsObj) {
  if (!oddsObj) return null;
  const ih = impliedProbabilityFromOdds(oddsObj.home);
  const id = impliedProbabilityFromOdds(oddsObj.draw);
  const ia = impliedProbabilityFromOdds(oddsObj.away);
  if (ih == null || id == null || ia == null) return null;
  const sum = ih + id + ia;
  if (sum <= 0) return null;
  return { home: ih/sum, draw: id/sum, away: ia/sum, source: oddsObj.source || null };
}

async function predictMatchLive(homeName, awayName, sims = 100000, dateISO = null) {
  const [homeMot, awayMot] = await Promise.all([
    getMotivationFactorV2(homeName, dateISO).catch(() => getMotivationFactor(homeName, dateISO)),
    getMotivationFactorV2(awayName,  dateISO).catch(() => getMotivationFactor(awayName,  dateISO)),
  ]);
  const baseMot = {
    home: getMotivationFactor(homeName, dateISO),
    away: getMotivationFactor(awayName,  dateISO),
  };
  const homeDelta = homeMot - baseMot.home; // 0이면 변화 없음
  const awayDelta = awayMot - baseMot.away;

  const base = predictMatch(homeName, awayName, sims, { dateISO, neutralVenue: true });

  let lambdaHome = base.lambdaHome * (1 + homeDelta);
  let lambdaAway = base.lambdaAway * (1 + awayDelta);
  lambdaHome = Math.max(0.15, lambdaHome);
  lambdaAway = Math.max(0.15, lambdaAway);

  if (!RUNTIME_CONFIG.useLiveOdds) return { ...base, lambdaHome, lambdaAway, liveApplied: false, liveSources: [], motivationApplied: (homeDelta!==0||awayDelta!==0) };

  const [oddsRaw, bsdPred, afPred] = await Promise.all([
    fetchMatchOdds(homeName, awayName).catch(() => null),
    fetchBsdPrediction(homeName, awayName).catch(() => null),
    fetchApiFootballPrediction(homeName, awayName, dateISO).catch(() => null),
  ]);

  const marketProbs = devigOdds(oddsRaw);
  const sources = [];
  const ext = { home: [], draw: [], away: [] };
  if (marketProbs) { ext.home.push(marketProbs.home); ext.draw.push(marketProbs.draw); ext.away.push(marketProbs.away); sources.push("market"); }
  const addPred = (p) => {
    if (!p || p.home == null) return;
    const s = (p.home||0)+(p.draw||0)+(p.away||0);
    if (s > 0) { ext.home.push(p.home/s); ext.draw.push((p.draw||0)/s); ext.away.push(p.away/s); sources.push(p.source || "apiPrediction"); }
  };
  addPred(bsdPred);
  addPred(afPred);
  const apiPred = afPred || bsdPred; // 카드/요약 표시용 (API-Football 우선)

  if (!sources.length) {
    return { ...base, lambdaHome, lambdaAway, liveApplied: false, liveSources: [], marketProbs: null, apiPrediction: apiPred || null };
  }

  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  const consensus = { home: avg(ext.home), draw: avg(ext.draw), away: avg(ext.away) };

  const w = Math.min(0.8, Math.max(0, RUNTIME_CONFIG.liveOddsWeight));
  let h = base.homeWinProb*(1-w) + consensus.home*w;
  let d = base.drawProb*(1-w) + consensus.draw*w;
  let a = base.awayWinProb*(1-w) + consensus.away*w;
  const tot = h+d+a;
  h/=tot; d/=tot; a/=tot;

  const homeShift = base.homeWinProb > 0 ? h/base.homeWinProb : 1;
  const awayShift = base.awayWinProb > 0 ? a/base.awayWinProb : 1;
  lambdaHome = Math.max(0.2, lambdaHome * Math.pow(homeShift, 0.6));
  lambdaAway = Math.max(0.2, lambdaAway * Math.pow(awayShift, 0.6));

  const reSims = 8000;
  const scoreCounts = {};
  for (let i=0;i<reSims;i++) {
    const hg = poissonRandom(lambdaHome), ag = poissonRandom(lambdaAway);
    const key = `${hg}-${ag}`;
    scoreCounts[key] = (scoreCounts[key]||0)+1;
  }
  const allScores = Object.entries(scoreCounts).sort((x,y)=>y[1]-x[1])
    .map(([score,count])=>({ score, prob: count/reSims }));

  const favored = h > a && h > d ? "home" : a > h && a > d ? "away" : "draw";
  let topScores;
  if (favored !== "draw") {
    const favWins = allScores.filter(s => {
      const [hg,ag] = s.score.split("-").map(Number);
      return favored === "home" ? hg > ag : ag > hg;
    });
    const rest = allScores.filter(s => !favWins.includes(s));
    const combined = [...favWins, ...rest];
    topScores = combined.slice(0, 5);
  } else {
    topScores = allScores.slice(0, 5);
  }

  const overUnder = computeOverUnder(scoreCounts, reSims);

  return {
    ...base,
    homeWinProb: h, drawProb: d, awayWinProb: a,
    lambdaHome, lambdaAway, topScores, overUnder,
    staticOverUnder: base.overUnder,
    staticProbs: { home: base.homeWinProb, draw: base.drawProb, away: base.awayWinProb },
    marketProbs, marketTotals: oddsRaw?.totals || null, marketTotalsSource: oddsRaw?.totalsSource || null, apiPrediction: apiPred || null,
    consensus,
    liveApplied: true,
    liveWeight: w,
    liveSources: sources,
    motivationApplied: (homeDelta!==0||awayDelta!==0),
    timestamp: Date.now(),
  };
}

function calcVariance(values) {
  const valid = values.filter(v => typeof v === "number" && !isNaN(v));
  if (valid.length < 2) return 0;
  const mean = valid.reduce((a,b)=>a+b,0) / valid.length;
  return valid.reduce((a,b)=>a + (b-mean)**2, 0) / valid.length;
}
function calculateConsensus(items) {
  const valid = items.filter(it => typeof it.value === "number" && !isNaN(it.value));
  if (!valid.length) return null;
  const totalW = valid.reduce((a,b)=>a+b.weight, 0);
  if (totalW === 0) return null;
  return valid.reduce((a,b)=>a + b.value*b.weight, 0) / totalW;
}
function calculateDeviation(ourProb, consensusProb) {
  if (consensusProb === null || typeof ourProb !== "number") return null;
  return Math.abs(ourProb - consensusProb);
}
function calculateConfidenceScore(deviation, variance) {
  if (deviation === null) return 50;
  const devPenalty = Math.min(40, deviation * 150);
  const varPenalty = Math.min(20, (variance || 0) * 200);
  return Math.max(10, Math.round(100 - devPenalty - varPenalty));
}

function ratingDiffToProbs(diff, scale = 15, capDraw = 0.85) {
  const homeRaw = 1 / (1 + Math.pow(10, -diff / scale));
  const home = homeRaw * capDraw;
  const away = (1 - homeRaw) * capDraw;
  const draw = Math.max(0, 1 - home - away);
  return { home, draw, away };
}

async function crossValidate(homeName, awayName, ourProbs, dateISO = null) {
  try {
    const hSpi = SPI_RATINGS[homeName], aSpi = SPI_RATINGS[awayName];
    const hOpta = OPTA_RANKINGS[homeName], aOpta = OPTA_RANKINGS[awayName];

    const spiP = (hSpi && aSpi) ? ratingDiffToProbs(hSpi.spi - aSpi.spi) : null;
    const optaP = (hOpta && aOpta) ? ratingDiffToProbs(hOpta.powerScore - aOpta.powerScore) : null;

    let marketP = null, apiP = null;
    const [odds, afPred, bsdPred] = await Promise.all([
      fetchMatchOdds(homeName, awayName).catch(() => null),
      fetchApiFootballPrediction(homeName, awayName, dateISO).catch(() => null),
      fetchBsdPrediction(homeName, awayName).catch(() => null),
    ]);
    marketP = devigOdds(odds); // 마진 제거된 정규화 확률
    const apiPred = afPred || bsdPred;
    if (apiPred && apiPred.home != null) {
      const s = (apiPred.home||0)+(apiPred.draw||0)+(apiPred.away||0);
      if (s > 0) apiP = { home: apiPred.home/s, draw: (apiPred.draw||0)/s, away: apiPred.away/s, advice: apiPred.advice, underOver: apiPred.underOver, goalsAvg: apiPred.goalsAvg, source: apiPred.source };
    }

    const consensusHome = calculateConsensus([
      { value: spiP?.home ?? null, weight: 0.20 },
      { value: optaP?.home ?? null, weight: 0.30 },
      { value: marketP?.home ?? null, weight: 0.30 },
      { value: apiP?.home ?? null, weight: 0.20 },
    ]);
    const variance = calcVariance([spiP?.home, optaP?.home, marketP?.home, apiP?.home, ourProbs?.homeWinProb]);
    const deviation = calculateDeviation(ourProbs?.homeWinProb, consensusHome);
    const confidence = calculateConfidenceScore(deviation, variance);

    return { spi: spiP, opta: optaP, market: marketP, apiFootball: apiP, consensusHome, deviation, variance, confidence };
  } catch (e) {

// ============================================================ 캘리브레이션 기반 자동 확률 보정
// 정산된 예측들의 "확신도별 실제 적중률" 곡선을 이용해, 모델이 과신/과소평가하는 경향을
// 자동으로 살짝 보정한다. RUNTIME_CONFIG.autoCalibration이 켜져 있고 표본이 20건 이상일 때만 적용.
let _settledHistoryCache = [];
function updateSettledHistoryCache(history) {
  _settledHistoryCache = Array.isArray(history) ? history.filter(h => h && h.settled) : [];
}
function getCalibrationBuckets() {
  const backup = (typeof BACKUP_SEED !== "undefined" && Array.isArray(BACKUP_SEED.history)) ? BACKUP_SEED.history : [];
  const merged = [..._settledHistoryCache, ...backup];
  const stats = (typeof computeAccuracyMetrics === "function") ? computeAccuracyMetrics(merged) : null;
  return (stats && stats.n >= 20) ? stats.buckets : null;
}
function calibrationFactorFor(conf, buckets) {
  if (!buckets || !buckets.length) return 1;
  let closest = buckets[0], minDist = Infinity;
  for (const b of buckets) {
    const dist = Math.abs((b.avgConfidence ?? 0) - conf);
    if (dist < minDist) { minDist = dist; closest = b; }
  }
  if (!closest || !closest.avgConfidence) return 1;
  const factor = closest.actualHitRate / closest.avgConfidence;
  return Math.max(0.7, Math.min(1.3, factor)); // 안전을 위해 ±30%로 제한
}
function calibrateProbTriple(home, draw, away) {
  if (!RUNTIME_CONFIG.autoCalibration) return { home, draw, away };
  const buckets = getCalibrationBuckets();
  if (!buckets) return { home, draw, away };
  const probs = { home, draw, away };
  const topKey = (home >= draw && home >= away) ? "home" : ((away >= draw && away >= home) ? "away" : "draw");
  probs[topKey] *= calibrationFactorFor(probs[topKey], buckets);
  const sum = probs.home + probs.draw + probs.away;
  if (sum > 0) { probs.home /= sum; probs.draw /= sum; probs.away /= sum; }
  return probs;
}

async function fetchWithTimeout(url, options = {}, timeoutMs = 6000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    return res;
  } finally {
    clearTimeout(timer);
  }
}

async function rawFetch(url, headers = {}, timeoutMs = 8000) {
  try {
    const res = await fetchWithTimeout(url, { headers }, timeoutMs);
    const text = await res.text();
    let json = null;
    try { json = JSON.parse(text); } catch (e) {}
    return { ok: res.ok, status: res.status, text, json };
  } catch (e) {
    return { ok: false, status: 0, text: "", json: null, error: e?.message || String(e) };
  }
}

async function fetchViaProxies(url, options = {}, timeoutMs = 4000) {
  const tried = new Set();
  for (const proxy of PROXY_FALLBACKS) {
    const p = proxy === null ? RUNTIME_CONFIG.corsProxy : proxy;
    if (!p || tried.has(p)) continue;
    tried.add(p);
    try {
      const target = p === "DIRECT" ? url : (p + encodeURIComponent(url));
      const res = await fetchWithTimeout(target, options, timeoutMs);
      if (res.ok) return res;
    } catch (e) { /* 다음 프록시로 */ }
  }
  return null;
}

function normTeamStr(s) {
  return String(s || "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]/g, "");
}
function isSameTeam(koName, foreignName) {
  if (!foreignName) return false;
  const target = normTeamStr(foreignName);
  if (!target) return false;
  const aliases = TEAM_NAME_EN[koName] || [koName];
  for (const a of aliases) {
    const na = normTeamStr(a);
    if (!na) continue;
    if (na === target || target.includes(na) || na.includes(target)) return true;
  }
  return false;
}

function parseOddsApiIoOdds(data, swapped) {
  if (!data) return null;
  const candidates = [];
  if (Array.isArray(data?.bookmakers)) candidates.push(...data.bookmakers);
  if (Array.isArray(data?.data?.bookmakers)) candidates.push(...data.data.bookmakers);
  if (Array.isArray(data)) candidates.push(...data);

  let h2h = null, totalsMarket = null;
  for (const bk of candidates) {
    const markets = bk?.markets || bk?.odds || [];
    if (!Array.isArray(markets)) continue;
    for (const m of markets) {
      const key = (m.key || m.market || m.name || "").toLowerCase();
      if (!h2h && (key.includes("h2h") || key.includes("1x2") || key.includes("moneyline") || key.includes("match winner"))) h2h = m;
      if (!totalsMarket && key.includes("total")) totalsMarket = m;
    }
    if (h2h) break;
  }
  if (!h2h) {
    if (data?.h2h && Array.isArray(data.h2h) && data.h2h.length === 3) {
      const [a,b,c] = data.h2h;
      return swapped ? { home: c, draw: b, away: a, source: "odds-api.io" } : { home: a, draw: b, away: c, source: "odds-api.io" };
    }
    if (typeof data?.home === "number" && typeof data?.away === "number") {
      return swapped
        ? { home: data.away, draw: data.draw, away: data.home, source: "odds-api.io" }
        : { home: data.home, draw: data.draw, away: data.away, source: "odds-api.io" };
    }
    return null;
  }
  const outcomes = h2h.outcomes || h2h.selections || [];
  let oh=null, od=null, oa=null;
  for (const o of outcomes) {
    const name = (o.name || o.label || "").toLowerCase();
    const price = o.price ?? o.odds ?? o.value;
    if (typeof price !== "number") continue;
    if (name.includes("draw") || name === "x" || name.includes("무")) od = price;
    else if (oh === null) oh = price;
    else oa = price;
  }
  if (oh == null || oa == null) return null;
  const result = swapped ? { home: oa, draw: od, away: oh } : { home: oh, draw: od, away: oa };
  if (totalsMarket) {
    const tOutcomes = totalsMarket.outcomes || totalsMarket.selections || [];
    result.totalsRaw = tOutcomes.map(o => ({ name: o.name, point: o.point, price: o.price ?? o.odds }));
  }
  result.source = "odds-api.io";
  return result;
}

function groupTotalsByPoint(outcomes) {
  if (!Array.isArray(outcomes)) return null;
  const byPoint = {};
  for (const o of outcomes) {
    const point = typeof o.point === "number" ? o.point : Number(o.point);
    const price = o.price ?? o.odds;
    const name = String(o.name || o.label || "").toLowerCase();
    if (!isFinite(point) || typeof price !== "number") continue;
    const key = point.toFixed(2);
    byPoint[key] = byPoint[key] || { point };
    if (name.includes("over") || name.includes("오버")) byPoint[key].over = price;
    else if (name.includes("under") || name.includes("언더")) byPoint[key].under = price;
  }
  const lines = Object.values(byPoint).filter(l => l.over && l.under);
  return lines.length ? lines.sort((a,b)=>a.point-b.point) : null;
}

async function loadApiFootballFixtures(force = false) {
  const FX_TTL = 24 * 3600 * 1000;
  try {
    const r = await window.storage.get("wc:afFixtures", false);
    if (r?.value) {
      const data = JSON.parse(r.value);
      if (!force && data.ts && (Date.now() - data.ts) < FX_TTL && Array.isArray(data.fixtures)) {
        return data.fixtures;
      }
    }
  } catch (e) {}
  if (!RUNTIME_CONFIG.apiFootballKey) return [];
  try {
    const headers = { "x-apisports-key": RUNTIME_CONFIG.apiFootballKey };
    const res = await fetchViaProxies(`https://v3.football.api-sports.io/fixtures?league=1&season=2026`, { headers }, 8000);
    const j = res ? await res.json().catch(()=>null) : null;
    if (Array.isArray(j?.response)) {
      const fixtures = j.response.map(f => ({
        id: f.fixture?.id,
        date: f.fixture?.date,
        home: f.teams?.home?.name || "",
        away: f.teams?.away?.name || "",
      })).filter(f => f.id);
      await window.storage.set("wc:afFixtures", JSON.stringify({ fixtures, ts: Date.now() }), false).catch(()=>{});
      return fixtures;
    }
  } catch (e) {}
  return [];
}

async function getApiFootballFixture(home, away) {
  const fixtures = await loadApiFootballFixtures();
  if (!fixtures.length) return null;
  const direct = fixtures.find(f => isSameTeam(home, f.home) && isSameTeam(away, f.away));
  if (direct) return { ...direct, swapped:false };
  const swapped = fixtures.find(f => isSameTeam(home, f.away) && isSameTeam(away, f.home));
  if (swapped) return { ...swapped, swapped:true };
  return null;
}

async function afCached(key, ttlMs, fetcher) {
  try {
    const r = await window.storage.get(key, false);
    if (r?.value) {
      const cached = JSON.parse(r.value);
      if (cached.ts && (Date.now() - cached.ts) < ttlMs) return cached.data;
    }
  } catch (e) {}
  const data = await fetcher();
  if (data != null) {
    try { await window.storage.set(key, JSON.stringify({ ts: Date.now(), data }), false); } catch (e) {}
  }
  return data;
}

async function fetchApiFootballOdds(home, away) {
  if (!RUNTIME_CONFIG.apiFootballKey) return null;
  const fx = await getApiFootballFixture(home, away);
  if (!fx) return null;
  return await afCached(`wc:afOdds:${fx.id}`, 6*3600*1000, async () => {
    try {
      const headers = { "x-apisports-key": RUNTIME_CONFIG.apiFootballKey };
      const res = await fetchViaProxies(`https://v3.football.api-sports.io/odds?fixture=${fx.id}`, { headers }, 8000);
      const j = res ? await res.json().catch(()=>null) : null;
      const bookmakers = j?.response?.[0]?.bookmakers;
      if (!Array.isArray(bookmakers) || !bookmakers.length) return null;
      let h2h = null, totals = null, bkName = null;
      for (const bk of bookmakers) {
        for (const bet of (bk.bets || [])) {
          if (!h2h && /match winner/i.test(bet.name || "")) {
            const ho = bet.values?.find(v=>v.value==="Home")?.odd;
            const dr = bet.values?.find(v=>v.value==="Draw")?.odd;
            const ao = bet.values?.find(v=>v.value==="Away")?.odd;
            if (ho && dr && ao) { h2h = { home:+ho, draw:+dr, away:+ao }; bkName = bk.name; }
          }
          if (!totals && /over\/under|goals over/i.test(bet.name || "")) {
            const grouped = {};
            for (const v of (bet.values || [])) {
              const m = String(v.value||"").match(/(Over|Under)\s*([\d.]+)/i);
              if (m) {
                const point = m[2];
                grouped[point] = grouped[point] || { point: +point };
                grouped[point][m[1].toLowerCase()] = +v.odd;
              }
            }
            const arr = Object.values(grouped).filter(o => o.over && o.under);
            if (arr.length) totals = arr.sort((a,b)=>a.point-b.point);
          }
        }
        if (h2h && totals) break;
      }
      if (!h2h && !totals) return null;
      if (h2h && fx.swapped) { const t = h2h.home; h2h.home = h2h.away; h2h.away = t; }
      return { ...(h2h||{}), totals, source: `API-Football(${bkName||"avg"})` };
    } catch (e) { return null; }
  });
}

// ============================================================ BSD 배당 (2026-07-31 추가, 1순위)
// 공식 OpenAPI 스펙(football-schema.json, 사용자가 BSD 공식 사이트에서 직접 받아온
// 것)으로 필드명 확인됨 — 추측 아님. /api/v2/odds/는 (event, bookmaker, market,
// outcome) 튜플의 최신 관측치를 준다. outcome이 팀명이 아니라 HOME/DRAW/AWAY
// 코드라서, odds-api.io/the-odds-api처럼 팀명 fuzzy 매칭이 실패할 걱정이 아예 없다
// — SCHEDULE의 g.id가 이 경기의 BSD event_id 그대로라(같은 BSD 이벤트 객체에서
// 나온 값), 매칭 자체가 애매할 수가 없는 구조.
// ⚠️ BSD 공식 페이지에 "배당 기능 자체를 없앨지 고민 중"이라는 경고가 떠있었음
// (2026-07-31 확인) — 언제 사라질 수 있는 소스라는 점 감안, 실패해도 기존
// odds-api.io/the-odds-api 체인으로 자연스럽게 폴백되도록 설계.
function findScheduleEventId(home, away) {
  const g = (SCHEDULE || []).find(m =>
    (isSameTeam(home, m.home) && isSameTeam(away, m.away)) ||
    (isSameTeam(home, m.away) && isSameTeam(away, m.home)));
  if (!g || g.id == null) return null;
  return { id: g.id, swapped: !isSameTeam(home, g.home) };
}

async function fetchBsdBookmakerOdds(eventId) {
  if (!RUNTIME_CONFIG.bsdToken || eventId == null) return [];
  try {
    const url = `https://sports.bzzoiro.com/api/v2/odds/?event_id=${eventId}&market=1x2&limit=200`;
    const res = await fetchViaProxies(url, { headers: { "Authorization": `Token ${RUNTIME_CONFIG.bsdToken}` } }, 8000);
    const j = res ? await res.json().catch(() => null) : null;
    const rows = Array.isArray(j) ? j : (Array.isArray(j?.results) ? j.results : null);
    if (!Array.isArray(rows) || !rows.length) return [];
    const byBookmaker = {};
    for (const r of rows) {
      if (r.market !== "1x2") continue;
      const slug = r.bookmaker_slug;
      if (!slug || slug === "consensus") continue;  // consensus는 스펙상 "합성 평균"이지 실제 북메이커가 아님
      if (!byBookmaker[slug]) byBookmaker[slug] = { bookmaker: r.bookmaker_name || slug };
      if (r.outcome === "HOME") byBookmaker[slug].home = r.decimal_odds;
      else if (r.outcome === "DRAW") byBookmaker[slug].draw = r.decimal_odds;
      else if (r.outcome === "AWAY") byBookmaker[slug].away = r.decimal_odds;
    }
    return Object.values(byBookmaker).filter(b => b.home != null && b.draw != null && b.away != null);
  } catch (e) {
    return [];
  }
}

async function fetchMatchOdds(home, away) {
  if (!RUNTIME_CONFIG.useLiveOdds) return null;

  const sched = findScheduleEventId(home, away);
  if (sched) {
    const bsdRows = await fetchBsdBookmakerOdds(sched.id).catch(() => []);
    if (bsdRows.length) {
      const best = bsdRows.find(b => true) || bsdRows[0];
      return {
        home: sched.swapped ? best.away : best.home,
        draw: best.draw,
        away: sched.swapped ? best.home : best.away,
        source: `BSD(${best.bookmaker})`,
      };
    }
  }

  let h2hResult = null;        // {home, draw, away, source}
  let eventMeta = {};
  let fallbackTotals = null;   // odds-api.io totals (오버/언더 보조)

  if (RUNTIME_CONFIG.oddsApiIoKey) {
    try {
      const evUrl = `https://api.odds-api.io/v3/events?apiKey=${RUNTIME_CONFIG.oddsApiIoKey}&sport=football&status=pending`;
      const res = await fetchViaProxies(evUrl, {}, 8000);
      if (res) {
        const events = await res.json().catch(()=>null);
        const list = Array.isArray(events) ? events : (Array.isArray(events?.data) ? events.data : null);
        if (Array.isArray(list)) {
          const direct = list.find(ev => isSameTeam(home, ev.home) && isSameTeam(away, ev.away));
          const swapped = direct ? null : list.find(ev => isSameTeam(home, ev.away) && isSameTeam(away, ev.home));
          const match = direct || swapped;
          if (match) {
            const oddsUrl = `https://api.odds-api.io/v3/odds?apiKey=${RUNTIME_CONFIG.oddsApiIoKey}&eventId=${match.id}`;
            const oddsRes = await fetchViaProxies(oddsUrl, {}, 8000);
            if (oddsRes) {
              const oddsData = await oddsRes.json().catch(()=>null);
              const parsed = parseOddsApiIoOdds(oddsData, !!swapped);
              if (parsed) {
                h2hResult = { home: parsed.home, draw: parsed.draw, away: parsed.away, source: parsed.source };
                if (parsed.totalsRaw) fallbackTotals = groupTotalsByPoint(parsed.totalsRaw);
                eventMeta = { eventId: match.id, matchedHome: match.home, matchedAway: match.away };
              }
            }
          }
        }
      }
    } catch (e) { /* 다음 소스로 */ }
  }

  let mainTotals = null;
  let totalsSource = null;
    // 2026-07-31: the-odds-api.com 공식문서 재확인 결과 "모든 플랜이 모든 스포츠 접근 가능"(무료 포함, 축구 제외 언급 없음) — 07-15의 "무료는 축구 미지원" 판단은 근거 재확인 결과 틀렸을 가능성 높음. 새 유료키로 다시 활성화, 실배포 후 실제 응답으로 재검증할 것
  if (RUNTIME_CONFIG.oddsApiKey) {
    try {
      const oddsUrl = `https://api.the-odds-api.com/v4/sports/soccer_epl/odds?apiKey=${RUNTIME_CONFIG.oddsApiKey}&regions=eu&markets=h2h,totals&oddsFormat=decimal`;
      const res = await fetchViaProxies(oddsUrl, {}, 8000);
      if (res) {
        const j = await res.json().catch(()=>null);
        if (Array.isArray(j)) {
          const ev = j.find(e => isSameTeam(home, e.home_team) && isSameTeam(away, e.away_team));
          if (ev) {
            for (const bk of (ev.bookmakers || [])) {
              const markets = bk.markets || [];
              if (!mainTotals) {
                const totalsMkt = markets.find(m => m.key === "totals");
                if (totalsMkt) {
                  const grouped = groupTotalsByPoint(totalsMkt.outcomes || []);
                  if (grouped) { mainTotals = grouped; totalsSource = `the-odds-api(${bk.key})`; }
                }
              }
              if (!h2hResult) {
                const h2h = markets.find(m => m.key === "h2h");
                if (h2h) {
                  const oh = h2h.outcomes.find(o => isSameTeam(home, o.name))?.price;
                  const oa = h2h.outcomes.find(o => isSameTeam(away, o.name))?.price;
                  const od = h2h.outcomes.find(o => o.name === "Draw")?.price;
                  if (oh && oa && od) h2hResult = { home: oh, draw: od, away: oa, source: `the-odds-api(${bk.key})` };
                }
              }
              if (mainTotals && h2hResult) break;
            }
          }
        }
      }
    } catch (e) { /* 무시 */ }
  }

  if ((!h2hResult || !mainTotals) && RUNTIME_CONFIG.apiFootballKey) {
    try {
      const afOdds = await fetchApiFootballOdds(home, away);
      if (afOdds) {
        if (!h2hResult && afOdds.home && afOdds.draw && afOdds.away) {
          h2hResult = { home: afOdds.home, draw: afOdds.draw, away: afOdds.away, source: afOdds.source };
        }
        if (!mainTotals && Array.isArray(afOdds.totals) && afOdds.totals.length) {
          mainTotals = afOdds.totals;
          totalsSource = afOdds.source;
        }
      }
    } catch (e) { /* 무시 */ }
  }

  if (!h2hResult) {
    const staticOdds = STATIC_MARKET_ODDS[`${home}_${away}`];
    if (staticOdds) {
      return {
        home: staticOdds.home, draw: staticOdds.draw, away: staticOdds.away,
        source: "static-report",
        totals: null, totalsSource: null,
      };
    }
    return null;
  }
  const totals = mainTotals || fallbackTotals || null;
  return {
    ...h2hResult, ...eventMeta,
    totals,
    totalsSource: totalsSource || (fallbackTotals ? "odds-api.io" : null),
  };
}

async function fetchTeamNews(team) {
  const cached = _newsCache[team];
  if (cached && Date.now() - cached.ts < NEWS_TTL) return cached.items;
  try {
    const q = `${team} 프리미어리그 부상 OR 결장 OR 라인업`;
    const gnewsUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=ko&gl=KR&ceid=KR:ko`;

    const res = await fetchViaProxies(url, {}, 8000);
    if (!res) { _newsCache[team] = { ts: Date.now(), items: [] }; return []; }
    const j = await res.json().catch(()=>null);
    const items = (j?.status === "ok" && Array.isArray(j.items))
      ? j.items.slice(0, 6).map(it => ({
          title: (it.title || "").replace(/\s*-\s*[^-]+$/, ""), // 끝의 " - 출처명" 제거
          link: it.link, source: it.title?.split(" - ").pop() || "",
          pubDate: it.pubDate,
        }))
      : [];
    _newsCache[team] = { ts: Date.now(), items };
    return items;

    return [];
  }
}

async function fetchBsdPrediction(home, away) {
  if (!RUNTIME_CONFIG.bsdToken) return null;
  try {
    const url = "https://sports.bzzoiro.com/api/predictions/";
    const res = await fetchViaProxies(url, { headers: { "Authorization": `Token ${RUNTIME_CONFIG.bsdToken}` } }, 8000);
    if (!res) return null;
    const j = await res.json().catch(()=>null);
    const list = j?.results || j?.data || (Array.isArray(j) ? j : null);
    if (!Array.isArray(list)) return null;
    const hit = list.find(p => {
      const ev = p.event || p;
      return (isSameTeam(home, ev.home_team) && isSameTeam(away, ev.away_team)) ||
             (isSameTeam(home, ev.away_team) && isSameTeam(away, ev.home_team));
    });
    if (!hit) return null;
    const ev = hit.event || hit;
    const swapped = isSameTeam(home, ev.away_team);
    const pick = (...keys) => { for (const k of keys) { const v = hit[k] ?? hit?.prediction?.[k] ?? hit?.probabilities?.[k]; if (typeof v === "number") return v; } return null; };
    let pHome = pick("home_win_probability","home_win_prob","home_win","prob_home","p_home","home");
    let pDraw = pick("draw_probability","draw_prob","draw","prob_draw","p_draw");
    let pAway = pick("away_win_probability","away_win_prob","away_win","prob_away","p_away","away");
    if (pHome == null || pAway == null) return null;
    if (pHome > 1 || pAway > 1 || (pDraw && pDraw > 1)) { pHome/=100; pAway/=100; if (pDraw!=null) pDraw/=100; }
    if (swapped) { const t = pHome; pHome = pAway; pAway = t; }
    return { home: pHome, draw: pDraw ?? Math.max(0, 1-pHome-pAway), away: pAway, source: "bsd" };
  } catch (e) { return null; }
}

function getLocalTeamStanding(team) {
  const grp = "PL";
  if (!SQUADS[team]) return null;
  const table = calcGroupStandings()[grp];
  if (!Array.isArray(table) || !table.length) return null;
  const idx = table.findIndex(r => r.team === team);
  if (idx < 0) return null;
  const row = table[idx];
  if (!row.played) return null; // 아직 치른 경기 없음 → 순위 보정 의미 없음
  return {
    group: grp, position: idx + 1, playedGames: row.played,
    won: row.won, draw: row.drawn, lost: row.lost,
    points: row.pts, goalsFor: row.gf, goalsAgainst: row.ga,
  };
}

async function getMotivationFactorV2(team, matchDate) {
  const base = getMotivationFactor(team, matchDate); // 원본 함수 유지
  try {
    const standing = getLocalTeamStanding(team);
    if (!standing) return base;
    if (standing.position >= 18) return Math.min(1.12, base * 1.07);
    if (standing.position === 1) return Math.max(0.97, base * 0.99);
  } catch (e) {}
  return base;
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, rad = Math.PI/180;
  const dLat = (lat2-lat1)*rad, dLon = (lon2-lon1)*rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function getTravelFatiguePenalty(team, venueCity) {
  const homeCoord = TEAM_HOME_COORDS[team];
  const venueCoord = VENUE_COORDS[venueCity];
  if (!homeCoord || !venueCoord) return 0;
  const km = haversineKm(homeCoord[0], homeCoord[1], venueCoord[0], venueCoord[1]);
  if (km < 1000) return 0;
  if (km < 5000) return -(km-1000)/4000 * 0.02;
  return -0.02 - (Math.min(km,12000)-5000)/7000 * 0.025;
}

// 2026-07-25 수정: 기존엔 EPL 20팀 전부 정확히 동일한 값(psxg:1.35, bigChances:2.0 등)이
// 하드코딩되어 있어서 getAdvancedStats()가 항상 이 자리(1순위)에서 걸려버렸고, 그 결과
// - "고급지표비교" 패널이 팀 구분 없이 항상 같은 숫자를 보여줬고(화면 버그)
// - setPieceLambdaAdjust/headingLambdaAdjust/homeAwaySplitAdjust(실제 예측 보정 로직)도
//   팀별로 달라져야 할 보정값이 모든 경기에 동일한 상수로 적용되고 있었음(예측 정확도 버그)
// "FBref/FotMob 기준"이라는 라벨과 달리 실제로 FBref/FotMob에서 가져온 값이 아니라 임시
// 플레이스홀더였음(EPL_고급지표_인수인계.md에 기록된 옵션 A 적용: 하드코딩 제거).
// 팀명을 키로 실측값을 넣으면 그 팀만 1순위로 쓰이고, 없는 팀은 아래 getAdvancedStats()의
// ELO/xG 기반 추정 공식(2순위, estimated:true로 정직하게 표시됨)이 자동으로 대신함.
const ADVANCED_STATS = {};

const _advCache = {};
function getAdvancedStats(team) {
  if (ADVANCED_STATS[team]) return ADVANCED_STATS[team];
  if (!ELO[team]) return null; // 본선/등록팀이 아니면 추정 안 함

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const g = (f) => (typeof getDynElo === "function" ? getDynElo(team, f) : (ELO[team]?.[f]));
  const xG  = Number.isFinite(g("xG"))  ? g("xG")  : 1.3;
  const xGA = Number.isFinite(g("xGA")) ? g("xGA") : 1.3;
  const npXg = Number.isFinite(g("npXg")) ? g("npXg") : xG * 0.9;
  const base = Number.isFinite(g("base")) ? g("base") : 1500;

  const psxg = clamp((xG * 0.55 + npXg * 0.45), 0.85, 2.25);
  const psxgAllowed = clamp(xGA * 0.98, 0.65, 1.50);
  const bigChances = clamp(xG * 1.55, 1.3, 4.0);
  const bigChancesAllowed = clamp(xGA * 1.65, 1.0, 2.4);
  const shotQuality = clamp(0.092 + (base - 1400) / 7000 + (xG - 1.3) * 0.010, 0.075, 0.150);

  const spCornerXg   = clamp(xG * 0.09, 0.05, 0.30);
  const spFreekickXg = clamp(xG * 0.04, 0.02, 0.15);
  const spPenaltyXg  = 0.06;
  const spCornerXgA   = clamp(xGA * 0.09, 0.05, 0.30);
  const spFreekickXgA = clamp(xGA * 0.04, 0.02, 0.15);
  const spPenaltyXgA  = 0.06;
  const aerialWinPct  = clamp(50 + (base - 1500) / 40, 38, 62);
  const headerGoals        = clamp(spCornerXg * 0.9, 0.05, 0.35);
  const headerGoalsAllowed = clamp(spCornerXgA * 0.9, 0.05, 0.35);
  const gkPsxgSaved  = clamp((1.35 - psxgAllowed) * 0.8, -0.4, 0.6);
  const cleanSheetPct = clamp(34 - (xGA - 1.3) * 22, 8, 55);
  const savePct       = clamp(70 + (1.35 - psxgAllowed) * 12, 58, 82);
  const homeXg  = +(xG * 1.10).toFixed(2), homeXga = +(xGA * 0.92).toFixed(2);
  const awayXg  = +(xG * 0.90).toFixed(2), awayXga = +(xGA * 1.10).toFixed(2);

  return {
    psxg: +psxg.toFixed(2),
    psxgAllowed: +psxgAllowed.toFixed(2),
    bigChances: +bigChances.toFixed(1),
    bigChancesAllowed: +bigChancesAllowed.toFixed(1),
    shotQuality: +shotQuality.toFixed(3),
    spCornerXg, spFreekickXg, spPenaltyXg,
    spCornerXgA, spFreekickXgA, spPenaltyXgA,
    aerialWinPct: +aerialWinPct.toFixed(1),
    headerGoals: +headerGoals.toFixed(2),
    headerGoalsAllowed: +headerGoalsAllowed.toFixed(2),
    gkPsxgSaved: +gkPsxgSaved.toFixed(2),
    cleanSheetPct: +cleanSheetPct.toFixed(1),
    savePct: +savePct.toFixed(1),
    homeXg, homeXga, awayXg, awayXga,
    euRotation: 0,
    estimated: true, // 추정값 표시용 플래그
  };
}

async function autoFetchAndStoreResult(home, away, dateISO) {
  const existing = getStoredResult(home, away);
  if (existing && existing.source !== "manual" && (Date.now() - (existing.fetched||0)) < 3600000) return existing;
  const score = await fetchSportScore(home, away, dateISO).catch(()=>null);
  if (!score) return existing;
  setStoredResult(home, away, score.homeGoals, score.awayGoals, score.source || "api-sports");
  await saveLiveResults();
  return getStoredResult(home, away);
}

function calcGroupStandings() {
  const standings = {}; // { teamName: {played,won,drawn,lost,gf,ga,gd,pts} }
  const initTeam = (t) => {
    if (!standings[t]) standings[t] = {team:t,played:0,won:0,drawn:0,lost:0,gf:0,ga:0,gd:0,pts:0,
      form:[], homeW:0,homeD:0,homeL:0, awayW:0,awayD:0,awayL:0};
  };
  // 결과가 하나도 없는 팀도 0점으로 미리 순위표에 올려둔다 (시즌 초반 빈 순위표 방지).
  for (const t of getAllTeamsList()) initTeam(t);
  for (const match of SCHEDULE.filter(m=>m&&m.home&&m.away)) {
    const res = getStoredResult(match.home, match.away);
    if (!res) continue;
    const hg = res.home ?? (res.home === match.home ? res.home : res.away);
    const ag = res.away ?? (res.away === match.away ? res.away : res.home);
    const stored = _liveResults[resultKey(match.home, match.away)] || _liveResults[resultKey(match.away, match.home)];
    if (!stored) continue;
    const isSwapped = !!_liveResults[resultKey(match.away, match.home)] && !_liveResults[resultKey(match.home, match.away)];
    const homeGoals = isSwapped ? stored.away : stored.home;
    const awayGoals = isSwapped ? stored.home : stored.away;

    initTeam(match.home); initTeam(match.away);
    standings[match.home].played++;
    standings[match.away].played++;
    standings[match.home].gf += homeGoals;
    standings[match.home].ga += awayGoals;
    standings[match.away].gf += awayGoals;
    standings[match.away].ga += homeGoals;
    standings[match.home].gd = standings[match.home].gf - standings[match.home].ga;
    standings[match.away].gd = standings[match.away].gf - standings[match.away].ga;
    if (homeGoals > awayGoals) {
      standings[match.home].won++; standings[match.home].pts+=3;
      standings[match.away].lost++;
      standings[match.home].form.push("W"); standings[match.away].form.push("L");
      standings[match.home].homeW++; standings[match.away].awayL++;
    } else if (homeGoals < awayGoals) {
      standings[match.away].won++; standings[match.away].pts+=3;
      standings[match.home].lost++;
      standings[match.away].form.push("W"); standings[match.home].form.push("L");
      standings[match.away].awayW++; standings[match.home].homeL++;
    } else {
      standings[match.home].drawn++; standings[match.home].pts++;
      standings[match.away].drawn++; standings[match.away].pts++;
      standings[match.home].form.push("D"); standings[match.away].form.push("D");
      standings[match.home].homeD++; standings[match.away].awayD++;
    }
  }
  const byGroup = { PL: [] };
  for (const [team, stat] of Object.entries(standings)) {
    byGroup.PL.push({...stat});
  }
  // 타이브레이커: 승점 → 골득실 → 다득점 → ELO(전력 기준, 시즌 초반 무결과 동점자 처리용)
  byGroup.PL.sort((a,b)=> b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || (getDynElo(b.team,"base")-getDynElo(a.team,"base")));
  return byGroup;
}

// ============================================================ 시즌 전체 몬테카를로 시뮬레이션
// 남은 경기를 compositeElo 기반 포아송 득점으로 대량 시뮬레이션하여
// 팀별 최종 순위 분포(우승/TOP4/강등 확률, 평균 승점)를 산출한다.
function getAllTeamsList() {
  return Object.keys(ELO);
}

function getRemainingFixtures() {
  return SCHEDULE.filter(m => {
    if (!m || !m.home || !m.away) return false;
    const res = _liveResults[resultKey(m.home, m.away)] || _liveResults[resultKey(m.away, m.home)];
    return !res;
  });
}

function quickMatchLambdas(home, away, homeAdv = 60) {
  const eH = compositeElo(home) + homeAdv;
  const eA = compositeElo(away);
  const diff = eH - eA;
  const base = 1.35;
  let lh = base * Math.pow(10, diff / 1000);
  let la = base * Math.pow(10, -diff / 1000);
  lh = Math.min(3.6, Math.max(0.35, lh));
  la = Math.min(3.6, Math.max(0.35, la));
  return { lh, la };
}

function simulateSeason(numSims = 3000) {
  const teams = getAllTeamsList();
  const standingsNow = calcGroupStandings().PL || [];
  const base = {};
  for (const t of teams) base[t] = { pts:0, gf:0, ga:0, played:0 };
  for (const s of standingsNow) {
    base[s.team] = { pts:s.pts, gf:s.gf, ga:s.ga, played:s.played };
  }
  const remaining = getRemainingFixtures();
  // 각 경기 람다는 시즌 내내 고정(현재 전력 스냅샷) — 매 시뮬마다 재계산하면 너무 무거움
  const fixtureLambdas = remaining.map(m => ({ ...m, ...quickMatchLambdas(m.home, m.away) }));

  const posCount = {}; // team -> [20개 순위 카운트]
  const ptsSum = {};
  for (const t of teams) { posCount[t] = new Array(teams.length).fill(0); ptsSum[t] = 0; }

  for (let s = 0; s < numSims; s++) {
    const sim = {};
    for (const t of teams) sim[t] = { ...base[t] };
    for (const f of fixtureLambdas) {
      const hg = poissonRandom(f.lh);
      const ag = poissonRandom(f.la);
      sim[f.home].played++; sim[f.away].played++;
      sim[f.home].gf += hg; sim[f.home].ga += ag;
      sim[f.away].gf += ag; sim[f.away].ga += hg;
      if (hg > ag) sim[f.home].pts += 3;
      else if (hg < ag) sim[f.away].pts += 3;
      else { sim[f.home].pts += 1; sim[f.away].pts += 1; }
    }
    const table = teams.map(t => ({ team:t, pts:sim[t].pts, gd: sim[t].gf - sim[t].ga, gf: sim[t].gf }));
    table.sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
    table.forEach((row, idx) => {
      posCount[row.team][idx]++;
      ptsSum[row.team] += row.pts;
    });
  }

  const n = teams.length;
  const result = teams.map(t => {
    const dist = posCount[t];
    const titleProb = dist[0] / numSims;
    const top4Prob = dist.slice(0,4).reduce((a,b)=>a+b,0) / numSims;
    const top6Prob = dist.slice(0,6).reduce((a,b)=>a+b,0) / numSims;
    const relegationProb = dist.slice(n-3).reduce((a,b)=>a+b,0) / numSims;
    const avgPos = dist.reduce((sum, cnt, idx) => sum + cnt*(idx+1), 0) / numSims;
    return {
      team: t,
      curPts: base[t].pts,
      curPlayed: base[t].played,
      avgFinalPts: ptsSum[t] / numSims,
      avgPos,
      titleProb, top4Prob, top6Prob, relegationProb,
    };
  });
  result.sort((a,b) => a.avgPos - b.avgPos);
  return { table: result, remainingCount: remaining.length, simsRun: numSims };
}

function modelProbsQuick(home, away, homeAdv = 60) {
  if (!ELO[home] || !ELO[away]) return null;
  const eH = getDynElo(home, "base") + homeAdv;
  const eA = getDynElo(away, "base");
  const diff = eH - eA;
  let pHomeRaw = 1 / (1 + Math.pow(10, -diff / 400));
  const drawP = Math.max(0.10, 0.30 - Math.abs(diff) / 1600);
  const pHome = pHomeRaw * (1 - drawP);
  const pAway = (1 - pHomeRaw) * (1 - drawP);
  return { home: pHome, draw: drawP, away: pAway };
}

function findHiddenTossups(opts = {}) {
  const marketFavMin = opts.marketFavMin ?? 0.34; // 시장 favorite 확률 하한. 무승부 높은 진짜 접전은 favorite도 34~40%대라 0.34로 설정
  const marginMax    = opts.marginMax ?? 0.25;    // 모델 두 팀 승률차 상한(박빙 기준, 25%p 이내)
  const out = [];
  const today = new Date().toISOString().slice(0,10);
  for (const [key, odds] of Object.entries(STATIC_MARKET_ODDS)) {
    if (odds.date && odds.date <= today) continue;
    const [home, away] = key.split("_");
    if (!ELO[home] || !ELO[away]) continue;
    const mkt = devigOdds(odds);
    const mdl = modelProbsQuick(home, away, 60);
    if (!mkt || !mdl) continue;

    const mktHomeFav = mkt.home >= mkt.away;
    const marketFavProb = mktHomeFav ? mkt.home : mkt.away;
    const modelFavProb  = mktHomeFav ? mdl.home : mdl.away;   // 같은(시장 favorite) 팀의 모델 확률
    const modelMargin   = Math.abs(mdl.home - mdl.away);      // 모델상 전력 격차(작을수록 박빙)
    const gap           = marketFavProb - modelFavProb;       // 시장이 favorite을 모델보다 띄운 정도

    const drawDominant = mkt.draw >= 0.40 && mkt.draw >= marketFavProb; // 무승부가 최고 확률 = 전형적 박빙
    if (modelMargin <= marginMax && (marketFavProb >= marketFavMin || drawDominant)) {
      const underdog = mktHomeFav ? away : home;
      const underdogOdds = mktHomeFav ? odds.away : odds.home;
      const underdogModelP = mktHomeFav ? mdl.away : mdl.home;
      out.push({
        home, away, date: odds.date || null,
        marketFav: mktHomeFav ? home : away,
        marketFavProb, modelFavProb, modelMargin, gap,
        underdog, underdogModelP,
        underdogValue: (underdogModelP * underdogOdds) - 1,
        parityScore: Math.max(0, 1 - modelMargin / marginMax),
      });
    }
  }
  out.sort((a, b) => (b.parityScore - a.parityScore) || (b.gap - a.gap));
  return out;
}

function setPieceLambdaAdjust(lambdaHome, lambdaAway, home, away) {
  const h = getAdvancedStats(home), a = getAdvancedStats(away);
  if (!h || !a) return { lH: lambdaHome, lA: lambdaAway };
  const hSetAtk = (h.spCornerXg||0) + (h.spFreekickXg||0) + (h.spPenaltyXg||0);
  const aSetDef = (a.spCornerXgA||0) + (a.spFreekickXgA||0) + (a.spPenaltyXgA||0);
  const aSetAtk = (a.spCornerXg||0) + (a.spFreekickXg||0) + (a.spPenaltyXg||0);
  const hSetDef = (h.spCornerXgA||0) + (h.spFreekickXgA||0) + (h.spPenaltyXgA||0);
  const lH = Math.max(0.15, lambdaHome + ((hSetAtk + aSetDef) / 2 - 0.23) * 0.35);
  const lA = Math.max(0.15, lambdaAway + ((aSetAtk + hSetDef) / 2 - 0.23) * 0.35);
  return { lH, lA };
}

function headingLambdaAdjust(lambdaHome, lambdaAway, home, away) {
  const h = getAdvancedStats(home), a = getAdvancedStats(away);
  if (!h || !a) return { lH: lambdaHome, lA: lambdaAway };
  const hAerial = ((h.aerialWinPct||50) - (a.aerialWinPct||50)) / 100;
  const aAerial = -hAerial;
  const hHead = ((h.headerGoals||0.15) + (a.headerGoalsAllowed||0.15)) / 2 - 0.15;
  const aHead = ((a.headerGoals||0.15) + (h.headerGoalsAllowed||0.15)) / 2 - 0.15;
  const lH = Math.max(0.15, lambdaHome + hAerial * 0.10 + hHead * 0.40);
  const lA = Math.max(0.15, lambdaAway + aAerial * 0.10 + aHead * 0.40);
  return { lH, lA };
}

function homeAwaySplitAdjust(lambdaHome, lambdaAway, home, away) {
  const h = getAdvancedStats(home), a = getAdvancedStats(away);
  if (!h || !a) return { lH: lambdaHome, lA: lambdaAway };
  let lH = lambdaHome, lA = lambdaAway;
  if (Number.isFinite(h.homeXg) && Number.isFinite(a.awayXga)) {
    const target = (h.homeXg + a.awayXga) / 2;
    lH = Math.max(0.15, lambdaHome * 0.75 + target * 0.25);
  }
  if (Number.isFinite(a.awayXg) && Number.isFinite(h.homeXga)) {
    const target = (a.awayXg + h.homeXga) / 2;
    lA = Math.max(0.15, lambdaAway * 0.75 + target * 0.25);
  }
  return { lH, lA };
}

function euRotationPenalty(team, matchDate) {
  const adv = getAdvancedStats(team);
  if (!adv || !adv.euRotation) return 0;
  const days = (typeof getRestDays === "function") ? getRestDays(team, matchDate) : null;
  if (days !== null && days < 4) return -0.03;
  return -0.01;
}

// ── 선수 능력치 기준선 (A단계, 2026-07-22) ──────────────────────────────
// PLAYER_BASELINE: player_baseline.json(update_player_baseline())의 players 구조 그대로.
// app_export.py의 PIPELINE_PLAYER_BASELINE을 Object.assign으로 채운다.
// { "이름|국가": { club_en, source, per90:{scoring, creating, defending}, ... }, ... }
// 6개 리그 앱(multi_league_index.html)과 동일 로직. source==="league"(=실제 시즌
// 데이터로 갱신된 선수)만 세고, 팀당 표본이 PLAYER_MIN_SAMPLE 미만이면 무효과(폴백).
let PLAYER_BASELINE = (typeof PIPELINE_PLAYER_BASELINE !== "undefined") ? PIPELINE_PLAYER_BASELINE : {};
const PLAYER_MIN_SAMPLE = 4;

// teamMatchedBaseline: 한글 팀명 → TEAM_NAME_EN으로 club_en 후보들을 얻어,
// 그 팀 소속이면서 source=league인 선수만 추출.
function teamMatchedBaseline(teamName) {
  const enList = (typeof TEAM_NAME_EN !== "undefined" && TEAM_NAME_EN[teamName]) || null;
  if (!enList || !enList.length) return [];
  const enSet = new Set(enList);
  return Object.values(PLAYER_BASELINE).filter(p =>
    p && p.club_en && enSet.has(p.club_en) && p.source === "league" &&
    p.per90 && Number.isFinite(p.per90.scoring) && Number.isFinite(p.per90.creating));
}

// leagueAvgBaselinePer90: EPL 전체(20팀) 매칭 선수 기준 평균 scoring+creating.
// 팀 지수를 이 평균 대비 상대값으로 계산해 공정 비교.
function leagueAvgBaselinePer90() {
  let sum = 0, n = 0;
  for (const t of Object.keys(SQUADS)) {
    teamMatchedBaseline(t).forEach(p => { sum += p.per90.scoring + p.per90.creating; n++; });
  }
  return n > 0 ? sum / n : null;
}

// playerBaselineLambdaAdjust: 팀별 매칭 선수의 (scoring+creating) per90 평균이 리그
// 평균보다 높으면 공격 λ 소폭 상향, 낮으면 하향. 표본 부족 시 무효과(1.0). 효과 최대
// ±8% — 팀 단위 ELO/xG보다 신뢰도 낮은 보조 신호이므로. EPL predictMatch의 다른
// xxxLambdaAdjust와 동일한 시그니처/반환형.
function playerBaselineLambdaAdjust(lambdaHome, lambdaAway, home, away) {
  const avgLeague = leagueAvgBaselinePer90();
  function factor(team) {
    const matched = teamMatchedBaseline(team);
    if (matched.length < PLAYER_MIN_SAMPLE) return 1;
    if (!Number.isFinite(avgLeague) || avgLeague <= 0) return 1;
    const teamAvg = matched.reduce((s, p) => s + p.per90.scoring + p.per90.creating, 0) / matched.length;
    const rel = (teamAvg - avgLeague) / avgLeague;
    return Math.max(0.92, Math.min(1.08, 1 + rel * 0.16));
  }
  const lH = Math.max(0.15, lambdaHome * factor(home));
  const lA = Math.max(0.15, lambdaAway * factor(away));
  return { lH, lA, applied: factor(home) !== 1 || factor(away) !== 1 };
}

function injuryLambdaAdjust(lambdaHome, lambdaAway, home, away) {
  // keyOut(핵심 결장) 1명당 -6%, injured(부상 로테이션) 1명당 -2% (홈팀 공격 λ, 원정도 동일 로직)
  function penalty(team) {
    const sq = SQUADS[team] || {};
    const keyOut = Array.isArray(sq.keyOut) ? sq.keyOut.length : 0;
    const injured = Array.isArray(sq.injured) ? sq.injured.length : 0;
    return Math.max(0.72, 1 - keyOut * 0.06 - injured * 0.02); // 하한 -28%
  }
  const lH = Math.max(0.15, lambdaHome * penalty(home));
  const lA = Math.max(0.15, lambdaAway * penalty(away));
  return { lH, lA };
}

function formDecayFactor(team) {
  // formArr: 최근 경기 결과 배열(예: [승=1, 무=0, 패=-1] 또는 득실차). 최신에 가중치↑
  const arr = (ELO[team] && Array.isArray(ELO[team].formArr)) ? ELO[team].formArr : null;
  if (!arr || !arr.length) return 1.0;
  // 지수 감쇠: 최신 경기 가중치 1.0, 한 경기 오래될수록 ×0.7
  let wsum = 0, vsum = 0, w = 1.0;
  for (let i = arr.length - 1; i >= 0; i--) {
    vsum += arr[i] * w; wsum += w; w *= 0.7;
  }
  const avg = wsum > 0 ? vsum / wsum : 0; // -1~+1 근처
  return Math.max(0.90, Math.min(1.10, 1 + avg * 0.08)); // 폼 좋으면 최대 +10%
}

function formLambdaAdjust(lambdaHome, lambdaAway, home, away) {
  const lH = Math.max(0.15, lambdaHome * formDecayFactor(home));
  const lA = Math.max(0.15, lambdaAway * formDecayFactor(away));
  return { lH, lA };
}

function promotedLambdaAdjust(lambdaHome, lambdaAway, home, away) {
  // 승격팀은 EPL 첫 시즌 → 공격 λ 소폭↓, 피실점 방향은 상대 λ 소폭↑
  let lH = lambdaHome, lA = lambdaAway;
  if (PROMOTED_TEAMS[home]) { lH *= 0.93; lA *= 1.05; }
  if (PROMOTED_TEAMS[away]) { lA *= 0.93; lH *= 1.05; }
  return { lH: Math.max(0.15, lH), lA: Math.max(0.15, lA) };
}

function psxgLambdaAdjust(lambdaHome, lambdaAway, home, away) {
  const hAdv = getAdvancedStats(home);
  const aAdv = getAdvancedStats(away);
  if (!hAdv || !aAdv) return { lH: lambdaHome, lA: lambdaAway };
  const hAtkFactor = hAdv.psxg > 0 ? hAdv.psxg / 1.75 : 1;
  const aGkFactor  = aAdv.psxgAllowed > 0 ? 1.0 / (aAdv.psxgAllowed / 1.0) : 1;
  const aAtkFactor = aAdv.psxg > 0 ? aAdv.psxg / 1.75 : 1;
  const hGkFactor  = hAdv.psxgAllowed > 0 ? 1.0 / (hAdv.psxgAllowed / 1.0) : 1;
  const lH = Math.max(0.2, lambdaHome * Math.pow(hAtkFactor * aGkFactor, 0.25));
  const lA = Math.max(0.2, lambdaAway * Math.pow(aAtkFactor * hGkFactor, 0.25));
  return { lH, lA };
}

function bigChanceSkew(home, away) {
  const h = getAdvancedStats(home), a = getAdvancedStats(away);
  if (!h || !a) return 0;
  const diff = (h.bigChances - h.bigChancesAllowed) - (a.bigChances - a.bigChancesAllowed);
  return Math.max(-0.06, Math.min(0.06, diff * 0.015));
}
