          </div>
          <div style={{fontSize:9.5, color:T.dim, marginTop:6, lineHeight:1.5, textAlign:"center"}}>
            본선 전 팀 대비 정규화한 ELO 세부 지표 (바깥쪽일수록 강함)
          </div>
        </>
      )}
    </Card>
  );
}

async function updateLeaderboardsFromApiFootball(force = false) {
  if (!RUNTIME_CONFIG.apiFootballKey) return null;
  const state = await loadLeaderboardState();
  if (!state.scorersAF) state.scorersAF = {};
  if (!state.assistsAF) state.assistsAF = {};

  const COOLDOWN_MS = 6 * 3600 * 1000; // 6시간
  if (!force && state.apiFootballLastFetch && (Date.now() - state.apiFootballLastFetch) < COOLDOWN_MS) {
    return state; // 캐시 유지 (API 호출 안 함)
  }

  const headers = { "x-apisports-key": RUNTIME_CONFIG.apiFootballKey };
  try {
    const [scRes, asRes] = await Promise.all([
      fetchViaProxies(`https://v3.football.api-sports.io/players/topscorers?league=1&season=2026`, { headers }, 8000),
      fetchViaProxies(`https://v3.football.api-sports.io/players/topassists?league=1&season=2026`, { headers }, 8000),
    ]);
    const scJ = scRes ? await scRes.json().catch(()=>null) : null;
    const asJ = asRes ? await asRes.json().catch(()=>null) : null;

    if (Array.isArray(scJ?.response)) {
      const fresh = {};
      for (const entry of scJ.response) {
        const name = entry.player?.name;
        const stat = entry.statistics?.[0];
        const goals = stat?.goals?.total;
        const teamName = espnTeamToKorean(stat?.team?.name || "");
        if (name && goals != null) fresh[`${name}|${teamName}`] = goals;
      }
      if (Object.keys(fresh).length) state.scorersAF = fresh;
    }
    if (Array.isArray(asJ?.response)) {
      const fresh = {};
      for (const entry of asJ.response) {
        const name = entry.player?.name;
        const stat = entry.statistics?.[0];
        const assists = stat?.goals?.assists;
        const teamName = espnTeamToKorean(stat?.team?.name || "");
        if (name && assists != null && assists > 0) fresh[`${name}|${teamName}`] = assists;
      }
      if (Object.keys(fresh).length) state.assistsAF = fresh;
    }
    state.apiFootballLastFetch = Date.now();
    await saveLeaderboardState(state);
  } catch (e) { /* 실패 시 기존 캐시 유지 */ }
  return state;
}

async function updateLeaderboards(maxDates = 4) {
  const state = await loadLeaderboardState();
  if (!state.scorers) state.scorers = {};
  if (!state.assists) state.assists = {};
  if (!state.gk) state.gk = {};
  if (!state.cards) state.cards = {};
  if (!state.ownGoals) state.ownGoals = {};
  const processedSet = new Set(state.processedEvents || []);

  const _ld = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const today = _ld();
  const dates = [...new Set(SCHEDULE.filter(m => m && m.date).map(m => m.date))].sort();
  const pending = dates.filter(d => d <= today && (!state.lastDate || d > state.lastDate));

  let datesDone = 0;
  for (const date of pending) {
    if (datesDone >= maxDates) break;
    const d0 = new Date(date + "T00:00:00Z");
    const dPrev = new Date(d0); dPrev.setUTCDate(d0.getUTCDate() - 1);
    const dNext = new Date(d0); dNext.setUTCDate(d0.getUTCDate() + 1);
    const fmt = dt => dt.toISOString().slice(0,10).replace(/-/g,"");
    const rangeStr = `${fmt(dPrev)}-${fmt(dNext)}`;
    try {
      const sbRes = await fetchViaProxies(`https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=${rangeStr}&limit=50`, {}, 8000);
      const sb = sbRes ? await sbRes.json().catch(()=>null) : null;
      const events = sb?.events || [];
      let pendingThisDate = 0;

      for (const ev of events) {
        const evDateUTC = ev.date ? new Date(ev.date) : null;
        const completed = !!ev.status?.type?.completed;

        if (processedSet.has(ev.id)) { continue; }

        if (!completed) {
          if (evDateUTC) {
            const kst = new Date(evDateUTC.getTime() + 9*3600*1000);
            const kstDate = `${kst.getUTCFullYear()}-${String(kst.getUTCMonth()+1).padStart(2,"0")}-${String(kst.getUTCDate()).padStart(2,"0")}`;
            if (kstDate === date) pendingThisDate++;
          }
          continue;
        }

        const sumRes = await fetchViaProxies(`https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=${ev.id}`, {}, 8000);
        const sum = sumRes ? await sumRes.json().catch(()=>null) : null;
        if (!sum) { continue; }

        const comp0 = sum.header?.competitions?.[0] || sum.competitions?.[0] || {};
        const eventArrays = [
          sum.keyEvents,
          sum.scoringPlays,
          sum.plays,
          comp0.details,
          comp0.keyEvents,
        ].filter(Array.isArray);
        const allEvents = [].concat(...eventArrays);

        for (const ke of allEvents) {
          const t = (ke.type?.text || ke.type?.name || ke.text || ke.shortText || "").toLowerCase();
          const players = ke.athletesInvolved || ke.participants || [];
          const teamName = espnTeamToKorean(ke.team?.displayName || ke.team?.name || "");
          const isGoal = ke.scoringPlay === true || (t.includes("goal") && !t.includes("no goal"));

          if (isGoal && !t.includes("missed") && !t.includes("disallowed") && !t.includes("penalty shootout")) {
            const isOwn = t.includes("own");
            const getName = p => p?.displayName || p?.shortName || p?.athlete?.displayName || p?.athlete?.shortName;
            if (players.length && !isOwn) {
              const scorer = getName(players[0]);
              if (scorer) state.scorers[`${scorer}|${teamName}`] = (state.scorers[`${scorer}|${teamName}`] || 0) + 1;
              const assister = getName(players[1]);
              if (assister) state.assists[`${assister}|${teamName}`] = (state.assists[`${assister}|${teamName}`] || 0) + 1;
            } else if (players.length && isOwn) {
              const player = getName(players[0]);
              if (player) state.ownGoals[`${player}|${teamName}`] = (state.ownGoals[`${player}|${teamName}`] || 0) + 1;
            }
          } else if (t.includes("card") || t.includes("caution") || t.includes("sent off")) {
            const player = players[0]?.displayName || players[0]?.shortName || players[0]?.athlete?.displayName;
            if (player) {
              const ckey = `${player}|${teamName}`;
              if (!state.cards[ckey]) state.cards[ckey] = { yellow:0, red:0 };
              if (t.includes("red") || t.includes("second yellow") || t.includes("sent off")) state.cards[ckey].red += 1;
              else if (t.includes("yellow") || t.includes("caution")) state.cards[ckey].yellow += 1;
            }
          }
        }

        const comps = sum.header?.competitions?.[0]?.competitors || [];
        for (const c of comps) {
          const opp = comps.find(o => o.id !== c.id);
          const oppScore = Number(opp?.score ?? NaN);
          if (Number.isNaN(oppScore)) continue;
          const myTeamName = espnTeamToKorean(c.team?.displayName || c.team?.name || "");
          const roster = (sum.rosters || []).find(r => String(r.team?.id) === String(c.team?.id) || r.homeAway === c.homeAway);
          const startGk = (roster?.roster || []).find(p => p.starter &&
            (p.position?.abbreviation === "G" || (p.position?.name || "").toLowerCase().includes("goalkeeper")));
          const gkName = startGk?.athlete?.displayName || startGk?.athlete?.shortName;
          if (gkName) {
            const gkey = `${gkName}|${myTeamName}`;
            if (!state.gk[gkey]) state.gk[gkey] = { apps:0, cs:0, conceded:0 };
            state.gk[gkey].apps += 1;
            state.gk[gkey].conceded += oppScore;
            if (oppScore === 0) state.gk[gkey].cs += 1;
          }
        }

        processedSet.add(ev.id);
      }

      if (pendingThisDate === 0) { state.lastDate = date; datesDone++; }
      else break; // 이 날짜에 아직 진행 중 경기 → 다음 갱신에서 재시도
    } catch (e) { break; }
  }

  state.processedEvents = [...processedSet];
  await saveLeaderboardState(state);
  return state;
}

async function fetchEspnLineup(home, away, dateISO) {
  try {
    const baseISO = dateISO || (() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
    const d0 = new Date(baseISO + "T12:00:00Z");
    const dPrev = new Date(d0); dPrev.setUTCDate(d0.getUTCDate() - 1);
    const dNext = new Date(d0); dNext.setUTCDate(d0.getUTCDate() + 1);
    const fmt = dt => `${dt.getUTCFullYear()}${String(dt.getUTCMonth()+1).padStart(2,"0")}${String(dt.getUTCDate()).padStart(2,"0")}`;
    const rangeStr = `${fmt(dPrev)}-${fmt(dNext)}`;
    const sbUrl = `https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=${rangeStr}&limit=50`;
    const sbRes = await fetchViaProxies(sbUrl, {}, 8000);
    if (!sbRes) return null;
    const sb = await sbRes.json().catch(()=>null);
    const events = sb?.events || [];

    let eventId = null;
    for (const ev of events) {
      const teams = ev.competitions?.[0]?.competitors || [];
      const h = teams.find(t=>t.homeAway==="home");
      const a = teams.find(t=>t.homeAway==="away");
      const hn = h?.team?.displayName || h?.team?.name || "";
      const an = a?.team?.displayName || a?.team?.name || "";
      if ((isSameTeam(home, hn) && isSameTeam(away, an)) || (isSameTeam(home, an) && isSameTeam(away, hn))) {
        eventId = ev.id; break;
      }
    }
    if (!eventId) return null;

    const sumUrl = `https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=${eventId}`;
    const sumRes = await fetchViaProxies(sumUrl, {}, 8000);
    if (!sumRes) return null;
    const sum = await sumRes.json().catch(()=>null);
    if (!sum) return null;

    const competitors = sum.header?.competitions?.[0]?.competitors || [];
    let ourHomeId = null, ourAwayId = null;
    for (const c of competitors) {
      const tn = c.team?.displayName || c.team?.name || "";
      if (isSameTeam(home, tn)) ourHomeId = c.team?.id;
      else if (isSameTeam(away, tn)) ourAwayId = c.team?.id;
    }

    let homeNames = [], awayNames = [];
    for (const r of (sum.rosters || [])) {
      const names = (r.roster || []).filter(p => p.starter)
        .map(p => p.athlete?.displayName || p.athlete?.shortName || p.athlete?.fullName)
        .filter(Boolean);
      if (!names.length) continue;
      const tid = r.team?.id ?? r.homeAway; // 일부 응답은 team.id 없이 homeAway만 있을 수 있음
      if (String(tid) === String(ourHomeId)) homeNames = names;
      else if (String(tid) === String(ourAwayId)) awayNames = names;
    }

    const cards = { home: [], away: [] };
    const subs = { home: [], away: [] };
    const penalties = { home: [], away: [] };
    const ownGoals = { home: [], away: [] };
    const varEvents = [];
    for (const ke of (sum.keyEvents || [])) {
      const typeText = (ke.type?.text || ke.text || "").toLowerCase();
      const tid = ke.team?.id;
      const side = String(tid) === String(ourHomeId) ? "home" : String(tid) === String(ourAwayId) ? "away" : null;
      const players = ke.athletesInvolved || [];
      const minute = ke.clock?.displayValue || "";

      if (typeText.includes("card")) {
        const isRed = typeText.includes("red");
        const player = players[0];
        const pname = player?.displayName || player?.shortName || "선수";
        const label = `${pname} ${isRed ? "🟥" : "🟨"}`;
        if (side) cards[side].push(label);
      } else if (typeText.includes("substitution")) {
        const out = players.find(p => (p.subType||p.type||"").toLowerCase().includes("out")) || players[0];
        const inP = players.find(p => (p.subType||p.type||"").toLowerCase().includes("in")) || players[1];
        const outName = out?.displayName || out?.shortName;
        const inName = inP?.displayName || inP?.shortName;
        if (side && (outName || inName)) subs[side].push({ minute, out: outName || "?", in: inName || "?" });
      } else if (typeText.includes("penalty") && (typeText.includes("missed") || typeText.includes("saved"))) {
        const player = players[0]?.displayName || players[0]?.shortName || "선수";
        if (side) penalties[side].push({ player, result: typeText.includes("saved") ? "막힘" : "실패", minute });
      } else if (typeText.includes("own goal")) {
        const player = players[0]?.displayName || players[0]?.shortName || "선수";
        if (side) ownGoals[side].push({ player, minute });
      } else if (typeText.includes("var") || typeText.includes("video review") || typeText.includes("review")) {
        varEvents.push({ desc: ke.type?.text || ke.text || "VAR 판독", minute, side });
      }
    }

    const playerStats = { home: [], away: [] };
    const numFrom = v => { const n = parseFloat(String(v).replace(/[^\d.\-]/g,"")); return isFinite(n) ? n : null; };
    const findKey = (keys, ...patterns) => {
      for (const p of patterns) {
        const idx = keys.findIndex(k => (k||"").toLowerCase() === p);
        if (idx >= 0) return idx;
      }
      for (const p of patterns) {
        const idx = keys.findIndex(k => (k||"").toLowerCase().includes(p));
        if (idx >= 0) return idx;
      }
      return -1;
    };
    for (const tb of (sum.boxscore?.players || [])) {
      const tid = tb.team?.id;
      const side = String(tid) === String(ourHomeId) ? "home" : String(tid) === String(ourAwayId) ? "away" : null;
      if (!side) continue;
      for (const grp of (tb.statistics || [])) {
        const keys = (grp.keys || grp.names || []).map(k => String(k||"").toLowerCase());
        if (!keys.length) continue;
        const iGoals = findKey(keys, "goals", "totalgoals");
        const iAssists = findKey(keys, "goalassists", "assists");
        const iShots = findKey(keys, "totalshots", "shotstotal", "shots");
        const iShotsOn = findKey(keys, "shotsontarget", "ontargetscoringattempt");
        const iTackles = findKey(keys, "totaltackles", "tackles", "effectivetackles");
        const iRating = findKey(keys, "rating", "matchrating");
        const iPasses = findKey(keys, "totalpasses", "accuratepasses", "touches");
        for (const a of (grp.athletes || [])) {
          const name = a.athlete?.displayName || a.athlete?.shortName;
          if (!name) continue;
          const stats = a.stats || [];
          const entry = {
            name,
            goals: iGoals>=0 ? numFrom(stats[iGoals]) : null,
            assists: iAssists>=0 ? numFrom(stats[iAssists]) : null,
            shots: iShots>=0 ? numFrom(stats[iShots]) : null,
            sot: iShotsOn>=0 ? numFrom(stats[iShotsOn]) : null,
            tackles: iTackles>=0 ? numFrom(stats[iTackles]) : null,
            rating: iRating>=0 ? numFrom(stats[iRating]) : null,
            passes: iPasses>=0 ? numFrom(stats[iPasses]) : null,
          };
          if (Object.values(entry).slice(1).some(v => v != null)) playerStats[side].push(entry);
        }
      }
    }

    const teamStats = { home: null, away: null };
    for (const tb of (sum.boxscore?.teams || [])) {
      const tid = tb.team?.id;
      const side = String(tid) === String(ourHomeId) ? "home" : String(tid) === String(ourAwayId) ? "away" : null;
      if (!side) continue;
      const out = {};
      for (const s of (tb.statistics || [])) {
        const n = (s.name || s.label || s.displayName || "").toLowerCase().replace(/\s+/g,"");
        const v = s.displayValue ?? s.value;
        if (v == null) continue;
        if (n.includes("poss")) out.poss = v;
        else if (n.includes("shotsontarget") || n.includes("ontargetshots")) out.sot = v;
        else if (n === "totalshots" || n === "shots" || n.includes("totalshots")) out.shots = v;
        else if (n.includes("corner")) out.corners = v;
        else if (n.includes("foul")) out.fouls = v;
      }
      if (Object.keys(out).length) teamStats[side] = out;
    }

    let referee = null;
    const officials = sum.gameInfo?.officials || sum.officials || [];
    const refObj = officials.find(o => /referee/i.test(o.position?.name || o.position?.displayName || "") && !/assistant/i.test(o.position?.name || ""))
      || officials[0];
    if (refObj) referee = refObj.displayName || refObj.fullName || null;

    let shootout = null;
    const homeComp = competitors.find(c => String(c.team?.id) === String(ourHomeId));
    const awayComp = competitors.find(c => String(c.team?.id) === String(ourAwayId));
    const hSO = homeComp?.shootoutScore, aSO = awayComp?.shootoutScore;
    if (hSO != null || aSO != null) shootout = { home: Number(hSO||0), away: Number(aSO||0) };

    const hasLineup = homeNames.length > 0 || awayNames.length > 0;
    const hasCards = cards.home.length > 0 || cards.away.length > 0;
    const hasPlayerStats = playerStats.home.length > 0 || playerStats.away.length > 0;
    const hasExtra = subs.home.length || subs.away.length || penalties.home.length || penalties.away.length ||
      ownGoals.home.length || ownGoals.away.length || varEvents.length || teamStats.home || teamStats.away || shootout || hasPlayerStats;
    if (!hasLineup && !hasCards && !hasExtra) return null;

    return {
      home: homeNames, away: awayNames, cards,
      subs, penalties, ownGoals, varEvents, teamStats, referee, shootout, playerStats,
      confirmed: hasLineup,
      status: sum.header?.competitions?.[0]?.status?.type?.description || null,
      source: "espn",
    };
  } catch (e) { return null; }
}

function matchDetailKey(home, away, dateISO) {
  return `wc:match:${(dateISO||"").replace(/-/g,"")}_${home}_${away}`;
}
async function loadMatchDetail(home, away, dateISO) {
  try {
    const r = await window.storage.get(matchDetailKey(home, away, dateISO), false);
    if (r?.value) return JSON.parse(r.value);
  } catch (e) {}
  return null;
}
async function saveMatchDetail(home, away, dateISO, data) {
  try { await window.storage.set(matchDetailKey(home, away, dateISO), JSON.stringify(data), false); } catch (e) {}
}

async function fetchLiveLineup(home, away, dateISO) {
  const key = RUNTIME_CONFIG.footballDataOrgKey;
  if (key) {
    try {
      const today = dateISO || new Date().toISOString().slice(0,10);
      const url = `https://api.football-data.org/v4/matches?dateFrom=${today}&dateTo=${today}&competitions=2000`;
      const res = await fetchViaProxies(url, { headers: { "X-Auth-Token": key } }, 8000);
      if (res) {
        const j = await res.json().catch(() => null);
        const matches = j?.matches || [];
        const match = matches.find(m => {
          const hn = m.homeTeam?.name || "", an = m.awayTeam?.name || "";
          return (isSameTeam(home, hn) && isSameTeam(away, an)) ||
                 (isSameTeam(home, an) && isSameTeam(away, hn));
        });
        if (match) {
          const swapped = match.homeTeam && isSameTeam(away, match.homeTeam.name);
          const homeLu = swapped ? match.awayTeam?.lineup : match.homeTeam?.lineup;
          const awayLu = swapped ? match.homeTeam?.lineup : match.awayTeam?.lineup;
          if (homeLu?.length || awayLu?.length) {
            return {
              home: homeLu?.map(p => p.name || p.player?.name) || [],
              away: awayLu?.map(p => p.name || p.player?.name) || [],
              cards: { home: [], away: [] },
              source: "football-data.org",
              confirmed: true,
            };
          }
        }
      }
    } catch (e) { /* 2) ESPN으로 폴백 */ }
  }
  const espn = await fetchEspnLineup(home, away, dateISO);
  if (espn) return espn;
  return null;
}

// 선수 배열에서 xG+xA 상위 3명 추출 (핵심선수)
function homeKeyPlayersFrom(players) {
  if (!players || !players.length) return [];
  return players
    .map(p => ({ name:p.name, pos:p.pos, xg:p.xg||0, xa:p.xa||0, goals:p.goals||0, assists:p.assists||0 }))
    .filter(p => (p.xg + p.xa) > 0 || p.goals > 0 || p.assists > 0)
    .sort((a,b) => (b.xg+b.xa)-(a.xg+a.xa) || (b.goals+b.assists)-(a.goals+a.assists))
    .slice(0,3);
}

function PlayerContributionPanel({home, away, matchDate, onAbsenceChange}) {
  const staticKey = `${home}_${away}`;
  const staticData = STATIC_MATCH_STATS[staticKey] || null;

  // ── 팀 단위 조별리그 3경기 원본 기록 (특정 매치업 키가 없어도 어느 상대와 매칭해도 재사용) ──
  const teamHomeGames = (typeof TEAM_GROUP_GAMES !== "undefined") ? TEAM_GROUP_GAMES[home] : null;
  const teamAwayGames = (typeof TEAM_GROUP_GAMES !== "undefined") ? TEAM_GROUP_GAMES[away] : null;
  const useTeamGames = !(staticData && staticData.homeGames && staticData.awayGames) && !!(teamHomeGames || teamAwayGames);

  const hasGames = !!(staticData && staticData.homeGames && staticData.awayGames) || useTeamGames;
  const gameLabels = hasGames
    ? Object.keys((staticData && staticData.homeGames) || teamHomeGames || teamAwayGames)
    : [];
  const [selGame, setSelGame] = useState(hasGames ? ((staticData && staticData.defaultGame) || gameLabels[gameLabels.length-1]) : null);

  const pickPlayers = () => {
    if (staticData && staticData.homeGames && staticData.awayGames && selGame) {
      return { home: staticData.homeGames[selGame] || [], away: staticData.awayGames[selGame] || [] };
    }
    if (useTeamGames && selGame) {
      return {
        home: (teamHomeGames && teamHomeGames[selGame]) || [],
        away: (teamAwayGames && teamAwayGames[selGame]) || [],
      };
    }
    if (staticData) return { home: staticData.home, away: staticData.away };
    return null;
  };

  const hasStaticOrTeamData = !!staticData || useTeamGames;

  const [stats, setStats] = useState(pickPlayers());
  const [loading, setLoading] = useState(!hasStaticOrTeamData);
  const [tried, setTried] = useState(hasStaticOrTeamData);
  const [source, setSource] = useState(hasStaticOrTeamData ? "경기 통계 리포트" : null);
  const [expanded, setExpanded] = useState(false);
  const [absentTick, setAbsentTick] = useState(0);

  useEffect(() => {
    if (hasStaticOrTeamData) setStats(pickPlayers());
  }, [selGame]);

  useEffect(() => {
    let cancelled = false;

    if (hasStaticOrTeamData) {
      setStats(pickPlayers());
      setSource("경기 통계 리포트");
      setLoading(false);
      setTried(true);
      return; // 정적 기록이 가장 충실하므로 API 조회로 덮어쓰지 않음
    }

    setLoading(true);

    loadMatchDetail(home, away, matchDate).then(cached => {
      if (cancelled) return;
      if (cached?.playerStats) setStats(cached.playerStats);
    });

    (async () => {
      try {
        const af = await fetchApiFootballPlayerStats(home, away, matchDate);
        if (!cancelled && af && (af.home.length || af.away.length)) {
          setStats(af);
          setSource("API-Football");
          setLoading(false);
          setTried(true);
          return;
        }
      } catch (e) {}
      try {
        const result = await fetchLiveLineup(home, away, matchDate);
        if (cancelled) return;
        if (result?.playerStats && (result.playerStats.home.length || result.playerStats.away.length)) {
          setStats(result.playerStats);
          setSource("ESPN");
        }
      } catch (e) {}
      if (!cancelled) { setLoading(false); setTried(true); }
    })();

    return () => { cancelled = true; };
  }, [home, away, matchDate]);

  const hasDetailed = !!staticData || useTeamGames; // xG/xA/키패스/인터셉트/걷어내기까지 있는지 여부

  // 핵심선수 = 3경기 평균×일관성 기반 종합 기여도 상위 (getKeyPlayers 사용)
  const keyHome = hasDetailed ? getKeyPlayers(home) : [];
  const keyAway = hasDetailed ? getKeyPlayers(away) : [];

  function toggleAbsent(team, name) {
    if (typeof window === "undefined") return;
    if (!window.__absentPlayers[team]) window.__absentPlayers[team] = new Set();
    const s = window.__absentPlayers[team];
    if (s.has(name)) s.delete(name); else s.add(name);
    setAbsentTick(t => t + 1);
    if (typeof onAbsenceChange === "function") onAbsenceChange();
  }
  function isAbsent(team, name) {
    if (typeof window === "undefined") return false;
    return !!(window.__absentPlayers[team] && window.__absentPlayers[team].has(name));
  }

  // 하단 상세 목록: 3경기 평균 스탯 기준(경기 탭 제거에 맞춰 평균으로 표시)
  function avgStatsFor(team) {
    const aggr = aggregateTeamPlayers(team); // [{name,pos,games:[...]}]
    return aggr.map(p => {
      const n = p.games.length || 1;
      const sum = (k) => p.games.reduce((a,g)=>a+(g[k]||0),0);
      const sc = playerContribScore(p);
      const avg = (k,d=2) => +(sum(k)/n).toFixed(d);
      return {
        name:p.name, pos:p.pos,
        goals:avg("goals"), assists:avg("assists"),
        shots:avg("shots",1), sot:avg("sot",1),
        xg:avg("xg"), xa:avg("xa"),
        icp:avg("icp",1), tackles:avg("tackles",1), clr:avg("clr",1),
        // ── 우선 15개 지표 (평균) ──
        progPass:avg("progPass",1), progCarry:avg("progCarry",1),
        sca:avg("sca",1), gca:avg("gca",2),
        psxgGA:avg("psxgGA"), bigChances:avg("bigChances",2), keyPasses:avg("keyPasses",1),
        tacklesWon:avg("tacklesWon",1), interceptions:avg("interceptions",1), recoveries:avg("recoveries",1),
        aerialWinPct:avg("aerialWinPct",1), takeOnPct:avg("takeOnPct",1), takeOns:avg("takeOns",1),
        apps:n, contrib: sc.atk*0.7 + sc.def*0.3,
      };
    });
  }

  const all = hasDetailed ? [
    ...avgStatsFor(home).map(p=>({...p, team: home})),
    ...avgStatsFor(away).map(p=>({...p, team: away})),
  ] : [
    ...(stats?.home||[]).map(p=>({...p, team: home})),
    ...(stats?.away||[]).map(p=>({...p, team: away})),
  ];
  const ranked = hasDetailed
    ? all.filter(p => p.contrib > 0).sort((a,b)=> b.contrib - a.contrib)
    : all
      .filter(p => (p.goals||0) > 0 || (p.assists||0) > 0 || (p.rating!=null) || (p.xg||0) > 0 || (p.xa||0) > 0 || (p.shots||0) > 0)
      .sort((a,b) => (b.goals||0)-(a.goals||0) || (b.assists||0)-(a.assists||0) || (b.rating||0) - (a.rating||0) || (b.xg||0)-(a.xg||0));
  const top = expanded ? ranked : ranked.slice(0, 8);

  const absentCountH = keyHome.filter(p=>isAbsent(home,p.name)).length;
  const absentCountA = keyAway.filter(p=>isAbsent(away,p.name)).length;

  return (
    <Card style={{marginTop:12}}>
      <SectionTitle sub={hasDetailed
        ? `${source} 기반 (골·도움·슈팅·xG·xA·인터셉트·태클·걷어내기 전체)`
        : `${source || "API-Football/ESPN"} 경기 통계 기반 (골·어시스트·슈팅·태클·평점) — 경기 진행/종료 후 표시`}>
        👤 개인 기여도
      </SectionTitle>

      {hasGames && false && (
        <div style={{display:"none"}} />
      )}

      {hasDetailed && (keyHome.length>0 || keyAway.length>0) && (
        <div style={{marginBottom:10, padding:"8px", background:"rgba(255,255,255,0.03)", borderRadius:8, border:`1px solid ${T.border}`}}>
          <div style={{fontSize:11, color:T.dim, marginBottom:6}}>
            ⭐ 핵심선수 (3경기 평균×꾸준함 + GK 선방·클린시트) — 결장 시 등급별 상한 내 승률 차등 반영 (팀 총 최대 15%p)
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"4px 12px"}}>
            <div>
              <div style={{fontSize:10.5, color:T.muted, fontWeight:700, marginBottom:3}}>{home}{absentCountH>0?` (결장 ${absentCountH})`:""}</div>
              {keyHome.map((p,i)=>(
                <label key={i} style={{display:"flex", alignItems:"center", gap:5, fontSize:11.5, padding:"2px 0", cursor:"pointer",
                  color: isAbsent(home,p.name) ? T.red : T.text, textDecoration: isAbsent(home,p.name)?"line-through":"none"}}>
                  <input type="checkbox" checked={isAbsent(home,p.name)} onChange={()=>toggleAbsent(home,p.name)} style={{cursor:"pointer"}}/>
                  {p.name} <span style={{color:T.dim, fontSize:10}}>(-{p.impactPct.toFixed(1)}%p)</span>
                </label>
              ))}
            </div>
            <div>
              <div style={{fontSize:10.5, color:T.muted, fontWeight:700, marginBottom:3}}>{away}{absentCountA>0?` (결장 ${absentCountA})`:""}</div>
              {keyAway.map((p,i)=>(
                <label key={i} style={{display:"flex", alignItems:"center", gap:5, fontSize:11.5, padding:"2px 0", cursor:"pointer",
                  color: isAbsent(away,p.name) ? T.red : T.text, textDecoration: isAbsent(away,p.name)?"line-through":"none"}}>
                  <input type="checkbox" checked={isAbsent(away,p.name)} onChange={()=>toggleAbsent(away,p.name)} style={{cursor:"pointer"}}/>

          {ranked.length > 8 && (

      ) : (

          <div style={{display:"flex", fontSize:10.5, color:T.dim, padding:"0 4px"}}>
            <span style={{flex:2}}>선수</span>

            <span style={{flex:"0 0 30px", textAlign:"center"}}>도움</span>
            <span style={{flex:"0 0 36px", textAlign:"center"}}>슈팅</span>
            <span style={{flex:"0 0 36px", textAlign:"center"}}>태클</span>
            <span style={{flex:"0 0 40px", textAlign:"center"}}>평점</span>
          </div>
          {top.map((p, i) => (
            <div key={i} style={{display:"flex", alignItems:"center", fontSize:12, padding:"6px 4px",
              borderTop:`1px solid ${T.border}`}}>
              <span style={{flex:2, color:T.text}}>{p.name} <span style={{color:T.dim, fontSize:10.5}}>({p.team})</span></span>
              <span style={{flex:"0 0 30px", textAlign:"center", color:T.muted}}>{p.goals ?? "-"}</span>
              <span style={{flex:"0 0 30px", textAlign:"center", color:T.muted}}>{p.assists ?? "-"}</span>
              <span style={{flex:"0 0 36px", textAlign:"center", color:T.muted}}>{p.shots ?? "-"}</span>
              <span style={{flex:"0 0 36px", textAlign:"center", color:T.muted}}>{p.tackles ?? "-"}</span>
              <span style={{flex:"0 0 40px", textAlign:"center", fontWeight:800,
                color: p.rating>=7.5 ? T.green : p.rating!=null && p.rating<6 ? T.red : T.text}}>
                {p.rating!=null ? p.rating.toFixed(1) : "-"}
              </span>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

function LiveLineupPanel({home, away, matchDate, onAbsenceChange}) {
  const [lineup, setLineup] = useState(null);
  const [loading, setLoading] = useState(true);
  const [fromCache, setFromCache] = useState(false);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    setFromCache(false);

    loadMatchDetail(home, away, matchDate).then(cached => {
      if (cancelled) return;
      if (cached) { setLineup(cached); setFromCache(true); }
    });

    fetchLiveLineup(home, away, matchDate).then(result => {
      if (cancelled) return;
      if (result) {
        setLineup(result);
        setFromCache(false);
        saveMatchDetail(home, away, matchDate, result);
      }
      setLoading(false);
    }).catch(() => { if (!cancelled) setLoading(false); });

    return () => { cancelled = true; };
  }, [home, away, matchDate]);

  const homeXi = SQUADS[home]?.xi || [];
  const awayXi = SQUADS[away]?.xi || [];
  const staticMatch = STATIC_MATCH_STATS[`${home}_${away}`] || null;
  const isLive = lineup?.confirmed && (lineup.home?.length || lineup.away?.length);
  const homeList = isLive ? lineup.home : homeXi;
  const awayList = isLive ? lineup.away : awayXi;
  const cards = lineup?.cards || { home: [], away: [] };
  const hasCards = cards.home.length > 0 || cards.away.length > 0;
  const subs = lineup?.subs || { home: [], away: [] };
  const hasSubs = subs.home.length > 0 || subs.away.length > 0;
  const pens = lineup?.penalties || { home: [], away: [] };
  const hasPens = pens.home.length > 0 || pens.away.length > 0;
  const ownGoals = lineup?.ownGoals || { home: [], away: [] };
  const hasOwnGoals = ownGoals.home.length > 0 || ownGoals.away.length > 0;

class ErrorBoundary extends React.Component {

    if (this.state.hasError) return (
      <div style={{background:"rgba(255,61,87,0.1)",border:`1px solid ${T.red}`,borderRadius:12,padding:14,margin:"10px 0",color:T.red,fontSize:12}}>
        ⚠️ 렌더링 오류: {this.state.error?.message || "알 수 없는 오류"}<br/>
        <button onClick={()=>this.setState({hasError:false,error:null})}
          style={{marginTop:8,padding:"6px 12px",borderRadius:8,border:`1px solid ${T.red}`,background:"transparent",color:T.red,cursor:"pointer",fontSize:11}}>

function TeamCrest({name, size=16}) {

function getH2H(teamA, teamB) {
  // 1) 앱이 직접 추적한 결과(_liveResults, 이번 시즌 위주)
  const games = [];
  const seen = new Set(); // date+home+away 중복 방지 (파이프라인과 겹칠 수 있음)
  try {
    for (const [k, v] of Object.entries(_liveResults || {})) {
      if (!v || typeof v.home !== "number") continue;
      const parts = k.split("__");
      if (parts.length !== 2) continue;
      const [h, a] = parts;
      if ((h === teamA && a === teamB) || (h === teamB && a === teamA)) {
        const dedupKey = `${v.date||""}|${h}|${a}`;
        if (seen.has(dedupKey)) continue;
        seen.add(dedupKey);
        games.push({ home: h, away: a, hg: v.home, ag: v.away, date: v.date || "", source: v.source });
      }
    }
  } catch(e) {}
  // 2) 파이프라인이 BSD에서 모아온 과거 맞대결(여러 시즌치)
  try {
    const pipelineKey = [teamA, teamB].sort().join("|||");
    (H2H[pipelineKey] || []).forEach(g => {
      const dedupKey = `${g.date||""}|${g.home}|${g.away}`;
      if (seen.has(dedupKey)) return;
      seen.add(dedupKey);
      games.push({ home: g.home, away: g.away, hg: g.homeGoals, ag: g.awayGoals, date: g.date || "", source: "pipeline" });
    });
  } catch(e) {}
  games.sort((x, y) => (x.date < y.date ? 1 : -1)); // 최신순
  // teamA 관점 집계
  let aWin = 0, draw = 0, bWin = 0, aGF = 0, aGA = 0;
  for (const g of games) {
    const aIsHome = g.home === teamA;
    const aScore = aIsHome ? g.hg : g.ag;
    const bScore = aIsHome ? g.ag : g.hg;
    aGF += aScore; aGA += bScore;
    if (aScore > bScore) aWin++;
    else if (aScore < bScore) bWin++;
    else draw++;
  }
  return { games, aWin, draw, bWin, aGF, aGA, total: games.length };
}


function PlayerRadar({ player }) {
  // player: statLeaders row. 8축 능력치를 0~1로 정규화(리그 상대값 없이 절대 스케일 근사)
  const axes = [
    { key:"xg",    label:"득점력", max:0.8 },
    { key:"xa",    label:"찬스",   max:0.5 },
    { key:"keyPasses", label:"키패스", max:2.5 },
    { key:"progPass",  label:"전개",   max:5 },
    { key:"tacklesWon", label:"태클",  max:3 },
    { key:"interceptions", label:"차단", max:2.5 },
    { key:"recoveries", label:"회수",  max:8 },
    { key:"aerialWinPct", label:"공중", max:100 },
  ];
  const vals = axes.map(a => Math.max(0, Math.min(1, (player[a.key]||0) / a.max)));
  const size = 200, cx = size/2, cy = size/2, R = 74;
  const N = axes.length;
  const pt = (i, r) => {
    const ang = (Math.PI*2*i/N) - Math.PI/2;
    return [cx + Math.cos(ang)*r, cy + Math.sin(ang)*r];
  };
  const poly = vals.map((v,i)=>pt(i, R*v).join(",")).join(" ");
  const grid = [0.25,0.5,0.75,1].map(g => axes.map((_,i)=>pt(i,R*g).join(",")).join(" "));
  return (
    <div style={{display:"flex", justifyContent:"center", padding:"6px 0"}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        {grid.map((g,i)=><polygon key={i} points={g} fill="none" stroke={T.border} strokeWidth="1"/>)}
        {axes.map((_,i)=>{ const [x,y]=pt(i,R); return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={T.border} strokeWidth="1"/>; })}
        <polygon points={poly} fill="rgba(41,121,255,0.35)" stroke={T.accent} strokeWidth="2"/>
        {vals.map((v,i)=>{ const [x,y]=pt(i,R*v); return <circle key={i} cx={x} cy={y} r="2.5" fill={T.accent}/>; })}
        {axes.map((a,i)=>{ const [x,y]=pt(i,R+14);
          return <text key={i} x={x} y={y} fontSize="9" fill={T.muted} textAnchor="middle" dominantBaseline="middle">{a.label}</text>; })}
      </svg>
    </div>
  );
}

// ── 팀 결장/불투명 인원을 사유별(레드·경고누적·부상)로 파싱 ──
// SQUADS[team].injured 문자열 노트에서 "이번 라운드에 실제로 못 뛰는/불투명한" 선수만 추출.
function parseTeamAbsences(team) {
  const sq = (typeof SQUADS !== "undefined") ? SQUADS[team] : null;
  const notes = (sq && Array.isArray(sq.injured)) ? sq.injured.slice() : [];
  const out = { red: [], warn: [], injury: [], doubt: [] };
  const seen = {}; // 선수명 -> 카테고리(중복 제거, 중증 우선)
  const sevRank = { red: 3, warn: 2, injury: 1, doubt: 0 };
  for (const raw of notes) {
    if (!raw || typeof raw !== "string") continue;
    const mName = raw.split("(")[0].trim();
    const reason = (raw.match(/\(([^)]*)\)/)?.[1] || "").trim();
    const R = reason;
    // 확실히 '출전 가능/복귀'면 제외
    if (/(출전가능|복귀 ?예정|복귀\)|복귀중|회복,|선발출전|교체출전|컨디션변수|예방|출전예정)/.test(R)) continue;
    // 단순 경고 1장(누적 아님)은 결장 아님 → 제외
    if (/경고 ?1장/.test(R) && !/누적/.test(R)) continue;
    let cat = null;
    if (/(레드카드|퇴장|출전정지|출전 ?정지|정지)/.test(R)) cat = "red";
    else if (/(경고 ?누적|누적)/.test(R)) cat = "warn";
    else if (/(대회 ?아웃|대회 ?불참|명단 ?제외|명단교체|결장|골절|파열|수술|ACL|인대|근육|햄스트링|아킬레스|건염|뇌진탕|부상)/.test(R)) {
      cat = /(불투명|미정|낮음|가능성|의심)/.test(R) ? "doubt" : "injury";
    } else if (/(불투명|미정|출전여부)/.test(R)) cat = "doubt";
    if (!cat || !mName) continue;
    if (seen[mName] && sevRank[seen[mName]] >= sevRank[cat]) continue;
    // 이전에 다른 카테고리로 들어갔으면 제거 후 재배치
    if (seen[mName]) {
      const prev = seen[mName];
      out[prev] = out[prev].filter(x => x.name !== mName);
    }
    seen[mName] = cat;
    out[cat].push({ name: mName, reason: R });
  }
  return out;
}

// ============================================================ 라이브 인플레이 재계산
// 경기 중 현재 스코어·경과 시간을 입력하면, 사전 예측된 팀 득점 기대값(λ)을
// 남은 시간 비율만큼 축소해 재시뮬레이션 → 인플레이 승/무/패 확률을 갱신한다.
// ============================================================ 팀 스타일 레이더 차트
// 공격/수비/압박/점유(필드틸트)/세트피스/최근폼 6개 축을 리그 20팀 min-max 기준으로
// 0~100 정규화하여 두 팀의 플레이 스타일을 한눈에 비교한다.
const RADAR_AXES = ["공격", "수비", "압박강도", "점유(필드틸트)", "세트피스", "최근폼"];

function getTeamRadarProfile(team) {
  const teams = getAllTeamsList();
  const raw = {};
  for (const t of teams) {
    const xG = Number.isFinite(getDynElo(t, "xG")) ? getDynElo(t, "xG") : 1.35;
    const xGA = Number.isFinite(getDynElo(t, "xGA")) ? getDynElo(t, "xGA") : 1.35;
    const ppda = ELO[t]?.ppda ?? 12;
    const fieldTilt = ELO[t]?.fieldTilt ?? 50;
    const setPxg = ELO[t]?.setPxg ?? 0.30;
    const form = Number.isFinite(getDynElo(t, "form")) ? getDynElo(t, "form") : 1500;
    raw[t] = { 공격: xG, 수비: -xGA, 압박강도: -ppda, "점유(필드틸트)": fieldTilt, 세트피스: setPxg, 최근폼: form };
  }
  const norm = {};
  for (const t of teams) norm[t] = {};
  for (const ax of RADAR_AXES) {
    const vals = teams.map(t => raw[t][ax]);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = max - min;
    for (const t of teams) norm[t][ax] = range > 1e-9 ? ((raw[t][ax]-min)/range)*100 : 50;
  }
  return { raw: raw[team], norm: norm[team] };
}

function RadarChart({axes, series, size=260}) {
  const center = size/2;
  const radius = size/2 - 46;
  const labelRadius = radius + 26;
  const angleStep = (Math.PI*2) / axes.length;
  const ptAt = (value, i, r=radius) => {
    const angle = -Math.PI/2 + i*angleStep;
    const rr = (value/100) * r;
    return [center + rr*Math.cos(angle), center + rr*Math.sin(angle)];
  };
  const gridLevels = [20,40,60,80,100];
  return (
    <svg width={size} height={size} style={{display:"block", margin:"0 auto"}}>
      {gridLevels.map(lvl => (
        <polygon key={lvl} points={axes.map((_,i)=>ptAt(lvl,i).join(",")).join(" ")}
          fill="none" stroke={T.border} strokeWidth={1}/>
      ))}
      {axes.map((_,i) => {
        const [x,y] = ptAt(100,i);
        return <line key={i} x1={center} y1={center} x2={x} y2={y} stroke={T.border} strokeWidth={1}/>;
      })}
      {series.map((s,si) => (
        <polygon key={si} points={s.values.map((v,i)=>ptAt(v,i).join(",")).join(" ")}
          fill={s.color} fillOpacity={0.22} stroke={s.color} strokeWidth={2}/>
      ))}
      {axes.map((label,i) => {
        const angle = -Math.PI/2 + i*angleStep;
        const x = center + labelRadius*Math.cos(angle);
        const y = center + labelRadius*Math.sin(angle);
        return (
          <text key={i} x={x} y={y} fill={T.muted} fontSize={10.5} fontWeight={700}
            textAnchor="middle" dominantBaseline="middle">{label}</text>
        );
      })}
    </svg>
  );
}

// ============================================================ 배당 비교 대시보드용: 첫 북메이커만 쓰던 기존 로직과 달리
// 응답에 담긴 모든 북메이커의 1X2 배당을 추출해 나란히 비교할 수 있게 한다.
function extractAllBookmakerOddsFromOddsApiIo(data, swapped) {
  if (!data) return [];
  const candidates = [];
  if (Array.isArray(data?.bookmakers)) candidates.push(...data.bookmakers);
  if (Array.isArray(data?.data?.bookmakers)) candidates.push(...data.data.bookmakers);
  if (Array.isArray(data)) candidates.push(...data);
  const out = [];
  for (const bk of candidates) {
    const markets = bk?.markets || bk?.odds || [];
    if (!Array.isArray(markets)) continue;
    let h2h = null;
    for (const m of markets) {
      const key = (m.key || m.market || m.name || "").toLowerCase();
      if (key.includes("h2h") || key.includes("1x2") || key.includes("moneyline") || key.includes("match winner")) { h2h = m; break; }
    }
    if (!h2h) continue;
    const outcomes = h2h.outcomes || h2h.selections || [];
    let oh=null, od=null, oa=null;
    for (const o of outcomes) {
      const name = (o.name || o.label || "").toLowerCase();
      const price = o.price ?? o.odds ?? o.value;
      if (typeof price !== "number") continue;
      if (name.includes("draw") || name === "x" || name.includes("무")) od = price;
      else if (oh === null) oh = price;
      else oa = price;
    }
    if (oh == null || oa == null) continue;
    const bkName = bk.name || bk.key || bk.title || bk.bookmaker || "북메이커";
    out.push(swapped ? { bookmaker: bkName, home: oa, draw: od, away: oh } : { bookmaker: bkName, home: oh, draw: od, away: oa });
  }
  return out;
}

function extractAllBookmakersFromTheOddsApi(ev) {
  const out = [];
  for (const bk of (ev.bookmakers || [])) {
    const markets = bk.markets || [];
    const h2h = markets.find(m => m.key === "h2h");
    if (!h2h) continue;
    const oh = h2h.outcomes?.find(o => isSameTeam(ev.home_team, o.name))?.price;
    const oa = h2h.outcomes?.find(o => isSameTeam(ev.away_team, o.name))?.price;
    const od = h2h.outcomes?.find(o => o.name === "Draw")?.price;
    if (oh && oa && od) out.push({ bookmaker: bk.title || bk.key, home: oh, draw: od, away: oa });
  }
  return out;
}

async function fetchBookmakerComparison(home, away) {
  const results = [];
  if (RUNTIME_CONFIG.oddsApiIoKey) {
    try {
      const evUrl = `https://api.odds-api.io/v3/events?apiKey=${RUNTIME_CONFIG.oddsApiIoKey}&sport=football&status=pending`;
      const res = await fetchViaProxies(evUrl, {}, 8000);
      if (res) {
        const events = await res.json().catch(()=>null);
        const list = Array.isArray(events) ? events : (Array.isArray(events?.data) ? events.data : null);
        if (Array.isArray(list)) {
          const direct = list.find(ev => isSameTeam(home, ev.home) && isSameTeam(away, ev.away));
          const swapped = direct ? null : list.find(ev => isSameTeam(home, ev.away) && isSameTeam(away, ev.home));
          const match = direct || swapped;
          if (match) {
            const oddsUrl = `https://api.odds-api.io/v3/odds?apiKey=${RUNTIME_CONFIG.oddsApiIoKey}&eventId=${match.id}`;
            const oddsRes = await fetchViaProxies(oddsUrl, {}, 8000);
            if (oddsRes) {
              const oddsData = await oddsRes.json().catch(()=>null);
              results.push(...extractAllBookmakerOddsFromOddsApiIo(oddsData, !!swapped));
            }
          }
        }
      }
    } catch (e) { /* 다음 소스로 */ }
  }
  if (RUNTIME_CONFIG.oddsApiKey) {
    try {
      const oddsUrl = `https://api.the-odds-api.com/v4/sports/soccer_fifa_world_cup/odds?apiKey=${RUNTIME_CONFIG.oddsApiKey}&regions=eu&markets=h2h&oddsFormat=decimal`;
      const res = await fetchViaProxies(oddsUrl, {}, 8000);
      if (res) {
        const j = await res.json().catch(()=>null);
        if (Array.isArray(j)) {
          const ev = j.find(e => isSameTeam(home, e.home_team) && isSameTeam(away, e.away_team));
          if (ev) results.push(...extractAllBookmakersFromTheOddsApi(ev));
        }
      }
    } catch (e) { /* 무시 */ }
  }
  const seen = new Set();
  const deduped = results.filter(r => {
    if (seen.has(r.bookmaker)) return false;
    seen.add(r.bookmaker);
    return true;
  });
  if (!deduped.length) {
    const staticOdds = STATIC_MARKET_ODDS[`${home}_${away}`];
    if (staticOdds) return [{ bookmaker: "기본 배당(참고용)", home: staticOdds.home, draw: staticOdds.draw, away: staticOdds.away }];
  }
  return deduped;
}

// ============================================================ 예측 결과 공유 카드
// Canvas로 예측 결과를 이미지 카드로 렌더링 → Web Share API(모바일) 또는 PNG 다운로드로 공유한다.
function loadImageAsync(src) {
  return new Promise((resolve, reject) => {
    if (!src) { reject(new Error("no src")); return; }
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

async function generateShareImage(home, away, result) {
  const W = 750, H = 1000;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#05080f");
  grad.addColorStop(1, "#0b1220");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#2979ff";
  ctx.font = "bold 30px 'Apple SD Gothic Neo', sans-serif";
  ctx.fillText("⚽ 프리미어리그 예측기", W/2, 62);
  ctx.fillStyle = "#6b8aad";
  ctx.font = "14px 'Apple SD Gothic Neo', sans-serif";
  ctx.fillText("하이브리드 ELO · xG · ML 앙상블 · 몬테카를로 100,000회", W/2, 90);

  const crestSize = 110;
  try {
    const homeImg = await loadImageAsync(CLUB_LOGOS[home]);
    ctx.drawImage(homeImg, W*0.24 - crestSize/2, 130, crestSize, crestSize);
  } catch (e) {}
  try {
    const awayImg = await loadImageAsync(CLUB_LOGOS[away]);
    ctx.drawImage(awayImg, W*0.76 - crestSize/2, 130, crestSize, crestSize);
  } catch (e) {}

  ctx.fillStyle = "#e8f0fe";
  ctx.font = "bold 22px 'Apple SD Gothic Neo', sans-serif";
  ctx.fillText(home, W*0.24, 275);
  ctx.fillText(away, W*0.76, 275);
  ctx.fillStyle = "#6b8aad";
  ctx.font = "bold 26px sans-serif";
  ctx.fillText("VS", W/2, 195);

  const top = result.topScores?.[0];
  if (top) {
    const [hg, ag] = top.score.split("-");
    ctx.fillStyle = "#00bcd4";
    ctx.font = "bold 66px 'Apple SD Gothic Neo', sans-serif";
    ctx.fillText(`${hg} : ${ag}`, W/2, 380);
    ctx.fillStyle = "#6b8aad";
    ctx.font = "14px 'Apple SD Gothic Neo', sans-serif";
    ctx.fillText(`자체 모델 예상 스코어 · 확률 ${(top.prob*100).toFixed(1)}%`, W/2, 406);
  }

  const barX = 60, barY = 450, barW = W-120, barH = 46;
  const hw = result.homeWinProb, dw = result.drawProb, aw = result.awayWinProb;
  ctx.save();
  roundRectPath(ctx, barX, barY, barW, barH, 12);
  ctx.clip();
  let x = barX;
  for (const seg of [{w:barW*hw, color:"#2979ff"}, {w:barW*dw, color:"#6b8aad"}, {w:barW*aw, color:"#f5a623"}]) {
    ctx.fillStyle = seg.color;
    ctx.fillRect(x, barY, seg.w+1, barH);
    x += seg.w;
  }
  ctx.restore();

  ctx.font = "bold 16px sans-serif";
  ctx.fillStyle = "#fff";
  ctx.textAlign = "left";
  ctx.fillText(`${(hw*100).toFixed(0)}%`, barX+12, barY+barH/2+6);
  ctx.textAlign = "right";
  ctx.fillText(`${(aw*100).toFixed(0)}%`, barX+barW-12, barY+barH/2+6);
  ctx.textAlign = "center";
  if (dw > 0.08) ctx.fillText(`${(dw*100).toFixed(0)}%`, barX+barW*hw+barW*dw/2, barY+barH/2+6);

  ctx.font = "13px 'Apple SD Gothic Neo', sans-serif";
  ctx.fillStyle = "#6b8aad";
  ctx.fillText(`${home} 승  ·  무승부  ·  ${away} 승`, W/2, barY+barH+26);

  ctx.font = "17px 'Apple SD Gothic Neo', sans-serif";
  ctx.fillStyle = "#e8f0fe";
  ctx.fillText(`예상 기대득점(xG)  ${result.lambdaHome.toFixed(2)} : ${result.lambdaAway.toFixed(2)}`, W/2, 580);

  ctx.font = "12px sans-serif";
  ctx.fillStyle = "#2a3f5f";
  const dateStr = new Date().toLocaleDateString("ko-KR");
  ctx.fillText(`생성일 ${dateStr} · 통계 모델 기반 예측(참고용, 실제 결과와 다를 수 있음)`, W/2, H-42);
  ctx.fillText("v1.0 · 프리미어리그 예측기", W/2, H-22);

  return canvas;
}

function LiveInPlayPanel({home, away, lambdaHome, lambdaAway}) {
  const [active, setActive] = useState(false);
  const [hg, setHg] = useState("0");
  const [ag, setAg] = useState("0");
  const [minute, setMinute] = useState(45);
  const [live, setLive] = useState(null);
  const [busy, setBusy] = useState(false);

  const recalc = useCallback(() => {
    const curH = Math.max(0, Number(hg)||0);
    const curA = Math.max(0, Number(ag)||0);
    const min = Math.min(90, Math.max(0, Number(minute)||0));
    setBusy(true);
    setTimeout(() => {
      const remainFrac = Math.max(0, (90 - min) / 90);
      const rlh = Math.max(0.02, lambdaHome * remainFrac);
      const rla = Math.max(0.02, lambdaAway * remainFrac);
      const sims = 30000;
      let hw=0, dr=0, aw=0;
      const scoreCounts = {};
      for (let i=0;i<sims;i++) {
        const addH = poissonRandom(rlh);
        const addA = poissonRandom(rla);
        const fh = curH + addH, fa = curA + addA;
        if (fh > fa) hw++; else if (fh < fa) aw++; else dr++;
        const key = `${fh}-${fa}`;
        scoreCounts[key] = (scoreCounts[key]||0)+1;
      }
      const topScores = Object.entries(scoreCounts).sort((a,b)=>b[1]-a[1]).slice(0,3)
        .map(([score,count])=>({score, prob:count/sims}));
      setLive({
        homeWinProb: hw/sims, drawProb: dr/sims, awayWinProb: aw/sims,
        topScores, minute: min, curH, curA, remainFrac,
      });
      setBusy(false);
    }, 20);
  }, [hg, ag, minute, lambdaHome, lambdaAway]);

  return (
    <Card style={{marginTop:12}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <SectionTitle sub="경기 중 스코어·경과 시간을 넣으면 남은 시간 기준으로 확률을 다시 계산합니다">🔴 라이브 인플레이 재계산</SectionTitle>
        <button onClick={()=>setActive(a=>!a)} style={{fontSize:11, color:T.accent, background:"transparent",
                border:`1px solid ${T.border}`, borderRadius:8, padding:"5px 10px", cursor:"pointer", whiteSpace:"nowrap"}}>
          {active ? "접기" : "펼치기"}
        </button>
      </div>
      {active && (
        <div>
          <div style={{display:"flex", gap:8, alignItems:"center", marginTop:10}}>
            <span style={{fontSize:11.5, color:T.muted, minWidth:0, flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{home}</span>
            <input type="number" min="0" value={hg} onChange={e=>setHg(e.target.value)}
              style={{width:50, padding:"7px", borderRadius:7, background:T.surface, border:`1px solid ${T.border}`, color:T.text, textAlign:"center"}}/>
            <span style={{color:T.muted}}>:</span>
            <input type="number" min="0" value={ag} onChange={e=>setAg(e.target.value)}
              style={{width:50, padding:"7px", borderRadius:7, background:T.surface, border:`1px solid ${T.border}`, color:T.text, textAlign:"center"}}/>
            <span style={{fontSize:11.5, color:T.muted, minWidth:0, flex:1, textAlign:"right", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{away}</span>
          </div>
          <div style={{marginTop:12}}>
            <div style={{display:"flex", justifyContent:"space-between", fontSize:11.5, color:T.muted}}>
              <span>경과 시간</span>
              <span style={{color:T.text, fontWeight:700}}>{minute}분</span>
            </div>
            <input type="range" min="1" max="90" step="1" value={minute} onChange={e=>setMinute(Number(e.target.value))} style={{width:"100%", marginTop:6}}/>
          </div>
          <button onClick={recalc} disabled={busy}
            style={{width:"100%", marginTop:12, padding:"11px", borderRadius:9, border:"none",
                    background: busy ? T.dim : T.red, color:"#fff", fontSize:13, fontWeight:800, cursor:busy?"default":"pointer"}}>
            {busy ? "재계산 중..." : "🔴 실시간 확률 재계산"}
          </button>

          {live && (
            <div style={{marginTop:12}}>
              <div style={{textAlign:"center", fontSize:11, color:T.muted, marginBottom:6}}>
                {live.minute}분 경과 · 현재 {live.curH}-{live.curA} · 남은 {Math.round(live.remainFrac*90)}분 기준 재계산
              </div>
              <ProbBar home={live.homeWinProb} draw={live.drawProb} away={live.awayWinProb} homeLabel={home} awayLabel={away}/>
              <div style={{fontSize:11, color:T.muted, marginTop:8, textAlign:"center"}}>
                예상 최종 스코어: {live.topScores.map(s=>`${s.score} (${pct(s.prob)})`).join(" · ")}
              </div>
            </div>
          )}
        </div>
      )}
    </Card>
  );
}

function PredictTab({home, away, setHome, setAway, sims, setSims, stage, setStage,
                      result, loading, onPredict, onSave}) {
  const swap = () => { const h=home; setHome(away); setAway(h); };
  const sm = STAGE_META[stage] || STAGE_META.group;

  const matchInfo = useMemo(() => SCHEDULE.find(g =>
    (g.home===home && g.away===away) || (g.home===away && g.away===home)
  ), [home, away]);

  const knownResult = useMemo(() => {
    const stored = getStoredResult(home, away);
    if (!stored) return null;
    const isSwapped = !!_liveResults[resultKey(away, home)] && !_liveResults[resultKey(home, away)];
    return { hg: isSwapped ? stored.away : stored.home, ag: isSwapped ? stored.home : stored.away, source: stored.source };
  }, [home, away]);

  return (
    <div>
      <HiddenTossupPanel onPick={(h,a)=>{ setHome(h); setAway(a); if(typeof window!=="undefined") window.scrollTo({top:0,behavior:"smooth"}); }}/>
      <Card>
        <div style={{display:"flex", gap:8, alignItems:"flex-end"}}>
          <GroupedTeamSelect value={home} onChange={setHome} label="🏠 홈팀" exclude={away}/>
          <button onClick={swap} title="교체" style={{padding:"10px 10px", borderRadius:9, background:T.surface,
                  border:`1px solid ${T.border}`, color:T.accent, fontSize:15, cursor:"pointer"}}>⇄</button>
          <GroupedTeamSelect value={away} onChange={setAway} label="✈️ 원정팀" exclude={home}/>
        </div>

        {/* 프리미어리그는 단일 정규리그 — 라운드 선택 불필요 */}

        <div style={{marginTop:14}}>
          <div style={{display:"flex", justifyContent:"space-between", fontSize:11.5, color:T.muted}}>
            <span>몬테카를로 시뮬레이션 횟수</span>
            <span style={{color:T.text, fontWeight:700}}>{sims.toLocaleString()}회</span>
          </div>
          <input type="range" min="10000" max="100000" step="10000" value={sims}
                 onChange={e=>setSims(Number(e.target.value))} style={{width:"100%", marginTop:6}}/>
        </div>

        <button onClick={onPredict} disabled={loading || home===away}
          style={{width:"100%", marginTop:14, padding:"13px", borderRadius:10, border:"none",
                  background: (loading||home===away) ? T.dim : T.accent, color:"#fff",
                  fontSize:15, fontWeight:800, cursor: (loading||home===away)?"default":"pointer"}}>
          {loading ? "분석 중... (실시간 데이터 조회 포함)" : (home===away ? "서로 다른 팀을 선택하세요" : "🔮 예측 실행")}
        </button>

        {knownResult && (
          <div style={{marginTop:10, padding:"10px 14px", borderRadius:10,
            background:"rgba(0,200,83,0.12)", border:`1px solid ${T.green}`,
            display:"flex", alignItems:"center", justifyContent:"space-between"}}>
            <div>
              <div style={{fontSize:12, color:T.green, fontWeight:700}}>🏁 이미 종료된 경기</div>
              <div style={{fontSize:11, color:T.muted, marginTop:2}}>
                {knownResult.source === "manual" ? "✏️ 수동 입력" : "🤖 자동 조회"} 결과
              </div>
            </div>
            <div style={{fontSize:26, fontWeight:900, color:T.text, fontFamily:"monospace"}}>
              <span style={{color: knownResult.hg > knownResult.ag ? T.green : T.text}}>{knownResult.hg}</span>
              <span style={{color:T.dim}}> : </span>
              <span style={{color: knownResult.ag > knownResult.hg ? T.green : T.text}}>{knownResult.ag}</span>
            </div>
          </div>
        )}
      </Card>

      {home !== away && <H2HCard teamA={home} teamB={away} />}
      {home !== away && <TeamStyleRadarCard home={home} away={away} />}

      {result && (
        <>
          <Card style={{marginTop:12}}>
            <div style={{textAlign:"center", fontSize:17, fontWeight:800}}>
              <TeamCrest name={home}/> {home} <span style={{color:T.muted, fontWeight:400}}>vs</span> {away} <TeamCrest name={away}/>
            </div>
            <div style={{textAlign:"center", marginTop:6}}>
              <span style={{display:"inline-block", padding:"4px 12px", borderRadius:20, background:"rgba(245,166,35,0.12)",
                            border:`1px solid ${T.accent}`, fontSize:11.5, color:T.accent, fontWeight:700}}>
                {sm.emoji} {sm.label}
              </span>
            </div>
            {matchInfo && (
              <div style={{textAlign:"center", marginTop:6}}>
                <span style={{display:"inline-block", padding:"4px 12px", borderRadius:20, background:T.surface,
                              border:`1px solid ${T.border}`, fontSize:11.5, color:T.cyan, fontWeight:700}}>
                  📅 {matchInfo.date} {matchInfo.time} 경기
                </span>
              </div>
            )}
            <div style={{textAlign:"center", marginTop:8}}>
              {result.liveApplied ? (
                <span style={{display:"inline-block", padding:"5px 12px", borderRadius:20, background:"rgba(0,200,83,0.15)",
                              border:`1px solid ${T.green}`, fontSize:11.5, color:T.green, fontWeight:700}}>
                  🟢 실시간 연동 ({result.liveSources.join(", ")} · 가중치 {Math.round(result.liveWeight*100)}%)
                </span>
              ) : (
                <span style={{display:"inline-block", padding:"5px 12px", borderRadius:20, background:"rgba(245,166,35,0.15)",
                              border:`1px solid ${T.gold}`, fontSize:11.5, color:T.gold, fontWeight:700}}>
                  📁 정적 모델 (실시간 미연동 — 설정에서 프록시/키 확인)
                </span>
              )}
            </div>
            <ProbBar home={result.homeWinProb} draw={result.drawProb} away={result.awayWinProb} homeLabel={home} awayLabel={away}/>
            {sm.knockout && (() => {
              const hw = result.homeWinProb, aw = result.awayWinProb, dw = result.drawProb;
              const denom = hw + aw;
              const advH = denom > 0 ? hw + dw * (hw/denom) : hw + dw/2;
              const advA = denom > 0 ? aw + dw * (aw/denom) : aw + dw/2;
              return (
                <div style={{marginTop:10, padding:"9px 12px", borderRadius:9,
                  background:"rgba(245,166,35,0.08)", border:`1px solid ${T.border}`}}>
                  <div style={{fontSize:11, color:T.accent, fontWeight:700, marginBottom:4}}>
                    {sm.emoji} {sm.label} — 무승부 시 연장·승부차기로 승부 결정
                  </div>
                  <div style={{fontSize:12, color:T.text}}>
                    최종 진출 확률(무승부 {pct(dw)} 배분): <TeamCrest name={home}/> <b>{pct(advH)}</b> · <b>{pct(advA)}</b> <TeamCrest name={away}/>
                  </div>
                </div>
              );
            })()}
            {result.liveApplied && result.staticProbs && (
              <div style={{fontSize:11, color:T.muted, marginTop:8, textAlign:"center"}}>
                정적 모델 기준: 홈 {pct(result.staticProbs.home)} · 무 {pct(result.staticProbs.draw)} · 원정 {pct(result.staticProbs.away)}
              </div>
            )}
          </Card>

          <AbsenceSummaryPanel home={home} away={away}/>

          <LiveInPlayPanel home={home} away={away} lambdaHome={result.lambdaHome} lambdaAway={result.lambdaAway}/>

          <OddsComparisonPanel home={home} away={away}
            modelProbs={{home: result.homeWinProb, draw: result.drawProb, away: result.awayWinProb}}/>

          <ShareResultPanel home={home} away={away} result={result}/>

          <Card style={{marginTop:12, textAlign:"center"}}>
            <SectionTitle sub="자체 모델이 가장 높은 확률로 예측한 단일 스코어">🎯 자체 분석 예상 스코어</SectionTitle>
            {(() => {
              const top = result.topScores?.[0];
              if (!top) return null;
              const [hg, ag] = top.score.split("-").map(Number);
              const { homeWinProb:hw, drawProb:dw, awayWinProb:aw } = result;
              const maxP = Math.max(hw, dw, aw);
              const favored = hw===maxP ? "home" : aw===maxP ? "away" : "draw";
              const favoredLabel = favored==="home" ? `${home} 승` : favored==="away" ? `${away} 승` : "무승부";
              const isDrawScore = hg === ag;
              const favWinScore = favored !== "draw"
                ? result.topScores.find(s => { const [h2,a2]=s.score.split("-").map(Number); return favored==="home"?h2>a2:a2>h2; })
                : null;
              return (
                <>
                  <div style={{fontSize:36, fontWeight:900, letterSpacing:1, marginTop:4}}>
                    <span style={{color:T.cyan}}>{hg}</span>
                    <span style={{color:T.muted, margin:"0 8px"}}>:</span>
                    <span style={{color:T.cyan}}>{ag}</span>
                  </div>
                  <div style={{fontSize:12, color:T.muted, marginTop:4}}>
                    {home} {hg} - {ag} {away} · 확률 {pct(top.prob)}
                  </div>
                  <div style={{marginTop:10, paddingTop:8, borderTop:`1px dashed ${T.border}`, fontSize:11.5, lineHeight:1.8}}>
                    <div style={{display:"flex", justifyContent:"space-around", marginBottom:6}}>
                      <span><b style={{color:T.accent}}>{home} 승</b><br/><span style={{fontSize:14, fontWeight:800, color:T.accent}}>{pct(hw)}</span></span>
                      <span><b style={{color:T.muted}}>무승부</b><br/><span style={{fontSize:14, fontWeight:800, color:T.muted}}>{pct(dw)}</span></span>
                      <span><b style={{color:T.gold}}>{away} 승</b><br/><span style={{fontSize:14, fontWeight:800, color:T.gold}}>{pct(aw)}</span></span>
                    </div>
                    <div style={{color:T.muted}}>
                      📊 결과 예측: <b style={{color:T.text}}>{favoredLabel}</b> 우세 ({pct(maxP)})
                      {isDrawScore && favored!=="draw" && (
                        <div style={{marginTop:4, fontSize:11}}>
                          💡 최빈 단일 스코어는 무승부지만, 전체 확률로는 {favoredLabel}가 더 높습니다
                          {favWinScore && ` (${favoredLabel} 시 유력: ${favWinScore.score} · ${pct(favWinScore.prob)})`}
                        </div>
                      )}
                    </div>
                  </div>
                </>
              );
            })()}
          </Card>

          <div style={{display:"flex", gap:10, marginTop:12}}>
            <Card style={{flex:1, textAlign:"center"}}>
              <div style={{fontSize:11.5, color:T.muted}}>예상 기대득점 (xG)</div>
              <div style={{fontSize:24, fontWeight:800, marginTop:4}}>{result.lambdaHome.toFixed(2)} : {result.lambdaAway.toFixed(2)}</div>
            </Card>
            <Card style={{flex:1, textAlign:"center"}}>
              <div style={{fontSize:11.5, color:T.muted}}>ELO (홈/원정)</div>
              <div style={{fontSize:24, fontWeight:800, marginTop:4}}>{Math.round(result.homeElo)} : {Math.round(result.awayElo)}</div>
            </Card>
          </div>

          <Card style={{marginTop:12}}>
            <SectionTitle>주요 예상 스코어라인 (Top 5)</SectionTitle>
            <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
              {result.topScores.map((s,i) => (
                <div key={s.score} style={{flex:"1 1 28%", minWidth:90}}>
                  <ScoreRow rank={i+1} score={`${s.score} (${pct(s.prob)})`} prob={s.prob} top={i===0}/>
                </div>
              ))}
            </div>
          </Card>

          <Card style={{marginTop:12}}>
            <SectionTitle sub="모델 예측 vs 실시간 시장 배당">오버/언더 (총 골수 기준)</SectionTitle>
            <div style={{display:"flex", gap:10}}>
              {["2.5","3.5"].map(line => {
                const ou = result.overUnder[line];
                const rec = ou && ou.over > ou.under ? "오버" : "언더";
                const recColor = rec === "오버" ? T.green : T.gold;
                const lineNum = parseFloat(line);
                const mktEntry = Array.isArray(result.marketTotals)
                  ? result.marketTotals.find(t => Math.abs(t.point - lineNum) < 0.01)
                  : null;
                const mktProb = mktEntry ? devigTotalsLine(mktEntry) : null;
                const evOver = mktEntry ? computeEV(ou?.over, mktEntry.over) : null;
                const evUnder = mktEntry ? computeEV(ou?.under, mktEntry.under) : null;
                const bestEv = (evOver != null && evUnder != null)
                  ? (evOver >= evUnder ? {label:"오버", ev:evOver, color:T.green} : {label:"언더", ev:evUnder, color:T.gold})
                  : null;
                return (
                  <div key={line} style={{flex:1, textAlign:"center"}}>
                    <div style={{fontSize:12, color:T.muted}}>라인 {line}</div>
                    <div style={{fontSize:14, fontWeight:700, marginTop:4}}>
                      <span style={{color:T.green}}>오버 {pct(ou?.over)}</span>{" "}
                      <span style={{color:T.gold}}>언더 {pct(ou?.under)}</span>
                    </div>
                    <div style={{marginTop:6, height:6, borderRadius:3, background:T.dim, overflow:"hidden"}}>
                      <div style={{height:"100%", width:pct(ou?.over), background:T.green}}/>
                    </div>
                    <span style={{display:"inline-block", marginTop:8, padding:"4px 12px", borderRadius:16,
                                  background: recColor+"26", border:`1px solid ${recColor}`, color:recColor, fontSize:11.5, fontWeight:800}}>
                      예측: {rec} {line}
                    </span>

                    {mktEntry ? (
                      <div style={{marginTop:10, paddingTop:8, borderTop:`1px dashed ${T.border}`}}>
                        <div style={{fontSize:10.5, color:T.muted}}>실시간 시장 배당</div>
                        <div style={{fontSize:12.5, fontWeight:800, marginTop:3}}>
                          <span style={{color:T.green}}>O {mktEntry.over.toFixed(2)}</span>{" "}
                          <span style={{color:T.gold}}>U {mktEntry.under.toFixed(2)}</span>
                        </div>
                        {mktProb && (
                          <div style={{fontSize:10.5, color:T.muted, marginTop:2}}>
                            시장확률 오버 {pct(mktProb.over)} · 언더 {pct(mktProb.under)}
                          </div>
                        )}
                        {bestEv && (
                          <div style={{fontSize:10.5, marginTop:4, fontWeight:800,
                            color: bestEv.ev > 0.03 ? bestEv.color : T.muted}}>
                            {bestEv.ev > 0.03 ? "💰 " : ""}{bestEv.label} EV {bestEv.ev>=0?"+":""}{(bestEv.ev*100).toFixed(1)}%
                          </div>
                        )}
                      </div>
                    ) : (
                      <div style={{marginTop:10, paddingTop:8, borderTop:`1px dashed ${T.border}`, fontSize:10.5, color:T.dim}}>
                        해당 라인 시장 배당 없음
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:10.5, color:T.dim, marginTop:10}}>
              {result.marketTotals
                ? `📡 ${result.marketTotalsSource?.startsWith("the-odds-api") ? "The Odds API" : result.marketTotalsSource?.startsWith("API-Football") ? result.marketTotalsSource : "odds-api.io"} 실시간 오버/언더 배당 기준 · EV는 모델확률×시장배당-1`
                : "ℹ️ 이 경기의 실시간 오버/언더 배당을 찾지 못했습니다 (모델 예측만 표시). 설정탭에서 The Odds API 키 확인."}
            </div>
          </Card>

          {/* ── 핸디캡 확률 카드 (점수/오버언더와 한 묶음으로 표시) ── */}
          {result.handicapProbs && (
            <Card style={{marginTop:12}}>
              <SectionTitle sub="홈팀 기준 아시안 핸디캡 커버 확률">🎯 핸디캡 (Asian Handicap)</SectionTitle>
              <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
                {Object.entries(result.handicapProbs).map(([h, prob]) => {
                  const isPos = prob > 0.55, isNeg = prob < 0.45;
                  const color = isPos ? T.green : isNeg ? T.red : T.muted;
                  return (
                    <div key={h} style={{flex:"1 1 22%", minWidth:70, textAlign:"center", padding:"8px 4px",
                      borderRadius:9, background:T.surface, border:`1px solid ${isPos?T.green:isNeg?T.red:T.border}`}}>
                      <div style={{fontSize:11, color:T.muted}}>홈 {h}</div>
                      <div style={{fontSize:15, fontWeight:800, color, marginTop:2}}>{pct(prob)}</div>
                    </div>
                  );
                })}
              </div>
              <div style={{fontSize:11, color:T.dim, marginTop:8}}>💡 홈팀이 해당 핸디캡을 극복할 확률. 50% 이상이면 홈팀 유리.</div>
            </Card>
          )}

          {/* ── 신규: 시뮬레이션 마켓 통계 (BTTS·클린시트·정확스코어 등) ── */}
          {result.marketStats && (() => {
            const ms = result.marketStats;
            const Row = ({label, a, aLbl, b, bLbl, hi}) => (
              <div style={{display:"flex", alignItems:"center", gap:8, padding:"7px 0", borderBottom:`1px solid ${T.border}33`}}>
                <span style={{fontSize:12, color:T.text, fontWeight:600, width:96, flexShrink:0}}>{label}</span>
                <div style={{flex:1, display:"flex", height:22, borderRadius:6, overflow:"hidden", background:T.bg}}>
                  <div style={{width:pct(a), background: hi===0?T.green:T.cyan, display:"flex", alignItems:"center", justifyContent:"center"}}>
                    {a>=0.15 && <span style={{fontSize:10, fontWeight:700, color:"#000"}}>{pct(a)}</span>}
                  </div>
                  <div style={{width:pct(b), background: hi===1?T.green:T.dim, display:"flex", alignItems:"center", justifyContent:"center"}}>
                    {b>=0.15 && <span style={{fontSize:10, fontWeight:700, color:"#000"}}>{pct(b)}</span>}
                  </div>
                </div>
              </div>
            );
            return (
              <Card style={{marginTop:12}}>
                <SectionTitle sub={`몬테카를로 ${result.sims.toLocaleString()}회 시뮬레이션 기반`}>📊 마켓 분석</SectionTitle>
                {/* 라벨 헤더 */}
                <div style={{display:"flex", gap:8, marginBottom:4}}>
                  <span style={{width:96, flexShrink:0}}/>
                  <div style={{flex:1, display:"flex", justifyContent:"space-between", fontSize:9.5, color:T.muted}}>
                    <span>← 첫 번째</span><span>두 번째 →</span>
                  </div>
                </div>
                <Row label="양팀득점 BTTS" a={ms.btts.yes} b={ms.btts.no} hi={0}/>
                <div style={{fontSize:9, color:T.dim, marginTop:-2, marginBottom:2, paddingLeft:104}}>예/아니오</div>
                <Row label="오버 1.5골" a={ms.over15.over} b={ms.over15.under} hi={0}/>
                <div style={{fontSize:9, color:T.dim, marginTop:-2, marginBottom:2, paddingLeft:104}}>오버/언더</div>
                <Row label={`${home} 클린시트`} a={ms.cleanSheet.home} b={1-ms.cleanSheet.home} hi={0}/>
                <div style={{fontSize:9, color:T.dim, marginTop:-2, marginBottom:2, paddingLeft:104}}>무실점/실점</div>
                <Row label={`${away} 클린시트`} a={ms.cleanSheet.away} b={1-ms.cleanSheet.away} hi={0}/>
                <div style={{fontSize:9, color:T.dim, marginTop:-2, marginBottom:2, paddingLeft:104}}>무실점/실점</div>
                <Row label="총득점 홀짝" a={ms.oddEven.odd} b={ms.oddEven.even} hi={-1}/>
                <div style={{fontSize:9, color:T.dim, marginTop:-2, marginBottom:8, paddingLeft:104}}>홀수/짝수</div>

                {/* 무실점 승리 */}
                <div style={{display:"flex", gap:8, marginTop:6}}>
                  <div style={{flex:1, textAlign:"center", padding:"8px 4px", borderRadius:9, background:T.surface, border:`1px solid ${T.border}`}}>
                    <div style={{fontSize:10.5, color:T.muted}}>{home} 무실점승</div>
                    <div style={{fontSize:15, fontWeight:800, color:T.green, marginTop:2}}>{pct(ms.winToNil.home)}</div>
                  </div>
                  <div style={{flex:1, textAlign:"center", padding:"8px 4px", borderRadius:9, background:T.surface, border:`1px solid ${T.border}`}}>
                    <div style={{fontSize:10.5, color:T.muted}}>{away} 무실점승</div>
                    <div style={{fontSize:15, fontWeight:800, color:T.cyan, marginTop:2}}>{pct(ms.winToNil.away)}</div>
                  </div>
                </div>

                {/* 정확한 스코어 분포 */}
                <div style={{marginTop:14}}>
                  <div style={{fontSize:12, fontWeight:700, color:T.text, marginBottom:6}}>정확한 스코어 확률 (상위 8)</div>
                  <div style={{display:"flex", flexDirection:"column", gap:3}}>
                    {ms.exactDist.map((d,i) => (
                      <div key={d.score} style={{display:"flex", alignItems:"center", gap:8}}>
                        <span style={{fontSize:12, fontWeight:700, color: i===0?T.accent:T.text, width:34, flexShrink:0}}>{d.score}</span>
                        <div style={{flex:1, height:14, background:T.bg, borderRadius:4, overflow:"hidden"}}>
                          <div style={{height:"100%", width:pct(d.prob/ms.exactDist[0].prob), background: i===0?T.accent:T.cyan}}/>
                        </div>
                        <span style={{fontSize:11, color:T.muted, width:42, textAlign:"right", flexShrink:0}}>{pct(d.prob)}</span>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{fontSize:9.5, color:T.dim, marginTop:10, lineHeight:1.5}}>
                  ⚠️ 골 시뮬레이션에서 직접 산출한 확률입니다. 코너·카드·전후반 등은 모델에 없어 제공하지 않습니다.
                </div>
              </Card>
            );
          })()}

          <div style={{textAlign:"center", marginTop:14, fontSize:12, color:T.muted, lineHeight:1.6}}>

            <span style={{fontSize:11, color:T.dim}}>v2: PSxG 골키퍼 보정 · 빅찬스 스큐 · 원정 피로도 반영</span>
          </div>

          {/* ── 신규: 전력 레이더 차트 ── */}
          <ErrorBoundary>
            <RadarPanel home={home} away={away}/>
          </ErrorBoundary>

          {/* ── 신규: 모델 신뢰도 분석 (보정 차트) ── */}
          <ErrorBoundary>
            <CalibrationPanel predProb={Math.max(result.homeWinProb, result.drawProb, result.awayWinProb)}/>
          </ErrorBoundary>

          {/* ── 신규: 골드만삭스 진출 확률 ── */}
          <ErrorBoundary>
            <GoldmanPanel home={home} away={away}/>
          </ErrorBoundary>

          {/* ── 신규: 최근 5경기 폼 ── */}
          <ErrorBoundary>
            <RecentFormPanel home={home} away={away}/>
          </ErrorBoundary>

          {/* ── v3 신규: 실시간 선발 라인업 ── */}
          <ErrorBoundary>
            <LiveLineupPanel home={home} away={away} matchDate={matchInfo?.date || null}
              onAbsenceChange={() => { if (typeof onPredict === "function") onPredict(); }}/>
          </ErrorBoundary>

          {/* ── v4 신규: 개인 기여도 (ESPN 통계) ── */}
          <ErrorBoundary>
            <PlayerContributionPanel home={home} away={away} matchDate={matchInfo?.date || null}
              onAbsenceChange={() => { if (typeof onPredict === "function") onPredict(); }}/>
